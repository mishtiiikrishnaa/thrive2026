<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ask anything</title>
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.cdnfonts.com/css/cmu-serif" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/cmu-sans-serif" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/cmu-typewriter-text" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #e9e9ee;
    --dim: #40404a;
    --faint: #565662;
    --accent: #ffa6c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  body {
    font-family: "CMU Sans Serif", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }

  .scene { position: relative; height: 100vh; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* the single centred column */
  .col {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: 46%; width: min(92vw, 680px); text-align: center;
    transition: top 0.95s cubic-bezier(0.22, 0.9, 0.24, 1);
    z-index: 3;
  }
  .col.raised { top: 3.5%; }

  /* ---- the landing: nothing but the ask line ---- */
  .askline { display: flex; justify-content: center; gap: 10px; }
  .askline input {
    flex: 0 1 480px;
    font-size: 17px; letter-spacing: 0.02em; color: var(--ink);
    background: rgba(18,18,28,0.72);
    border: 1px solid var(--dim); border-radius: 999px;
    padding: 15px 26px; outline: none;
    transition: border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
  }
  .askline input::placeholder { color: var(--faint); font-style: italic; }
  .askline input:focus {
    border-color: rgba(255,166,201,0.55);
    box-shadow: 0 0 0 1px rgba(255,166,201,0.22), 0 0 34px rgba(255,166,201,0.12);
  }
  .askline input:disabled { opacity: 0.5; }
  .askline button {
    font-size: 14px; letter-spacing: 0.06em; color: var(--ink);
    background: rgba(255,166,201,0.12);
    border: 1px solid rgba(255,166,201,0.4); border-radius: 999px;
    padding: 0 28px; cursor: pointer; outline: none;
    transition: background 0.3s ease, opacity 0.4s ease;
  }
  .askline button:hover:not([disabled]) { background: rgba(255,166,201,0.24); }
  .askline button[disabled] { opacity: 0.35; cursor: default; }

  /* ---- the two half-panels: facts (left) and the growing graph ---- */
  .split {
    display: flex; gap: 28px; margin-top: 26px; text-align: left;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.7s ease, transform 0.7s ease, max-height 0.8s ease;
    max-height: 0; overflow: hidden;
  }
  .split.on { opacity: 1; transform: translateY(0); max-height: 640px; }

  .side { flex: 1 1 50%; min-width: 0; }
  .tag {
    display: block; font-family: "CMU Typewriter Text", monospace;
    font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 14px;
    transition: color 0.5s ease, text-shadow 0.5s ease;
  }
  .tag.hot { color: var(--accent); text-shadow: 0 0 14px rgba(255,166,201,0.4); }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .chip {
    font-size: 12px; letter-spacing: 0.04em; color: var(--accent);
    background: rgba(255,166,201,0.07);
    border: 1px solid rgba(255,166,201,0.32); border-radius: 999px;
    padding: 6px 14px;
  }

  /* the fact list — each fact is generated fast, with a little dot */
  .flist { display: flex; flex-direction: column; gap: 9px; }
  .fkg {
    display: flex; align-items: baseline; gap: 10px;
    opacity: 0; transition: opacity 0.5s ease;
  }
  .fkg .fdot {
    flex: 0 0 auto;
    width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid rgba(255,166,201,0.7);
    color: var(--accent);
    font-family: "CMU Sans Serif", sans-serif;
    font-size: 8.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    transform: translateY(2px);
  }
  .fkg .fl {
    font-family: "CMU Serif", Georgia, serif; font-size: 14px;
    color: rgba(233,233,238,0.9); letter-spacing: 0.01em; line-height: 1.5;
  }
  .fkg .fl .hl { color: var(--accent); }

  /* the graph region holds the canvas where nerves grow */
  .graphbox { position: relative; height: 300px; border-radius: 14px; }
  #graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .graphbox .stagehint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: "CMU Typewriter Text", monospace; font-size: 10px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim);
  }

  /* ---- the answer ---- */
  .answer {
    margin-top: 40px; max-width: 100%;
    opacity: 0; transition: opacity 1.1s ease;
    user-select: none;
    text-align: left;
  }
  .answer.show { opacity: 1; }
  .answer .ans {
    font-family: "CMU Serif", Georgia, serif;
    font-size: 16px; line-height: 1.85;
    color: rgba(233,233,238,0.95);
    letter-spacing: 0.01em;
    text-shadow: 0 0 18px rgba(255,166,201,0.12);
    white-space: pre-wrap;
  }

  .again {
    margin-top: 26px; text-align: center;
    font-family: "CMU Typewriter Text", monospace;
    font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--faint);
    transition: color 0.5s ease, opacity 0.6s ease;
    opacity: 0;
  }
  .again.show { opacity: 1; }
  .again.bright { color: var(--accent); }
</style>
</head>
<body>

  <div class="scene">
    <canvas id="stage"></canvas>

    <div class="col" id="col">
      <div class="askline">
        <input id="input" type="text" placeholder="ask anything…" autocomplete="off" spellcheck="false">
        <button id="submit">ask</button>
      </div>

      <div class="split" id="split">
        <div class="side">
          <span class="tag" id="kwtag">keywords</span>
          <div class="chips" id="chips"></div>
          <span class="tag" id="facttag">where each keyword leads</span>
          <div class="flist" id="flist"></div>
        </div>
        <div class="side">
          <span class="tag" id="graphtag">the graph learning</span>
          <div class="graphbox" id="graphbox">
            <div class="stagehint">growing…</div>
            <canvas id="graph"></canvas>
          </div>
        </div>
      </div>

      <div class="answer" id="answerzone">
        <p class="ans" id="ans"></p>
      </div>

      <div class="again" id="again">ask anything else…</div>
    </div>
  </div>

  var STOP = {};

  // ------------------------------------------------------- helpers

  function rand(a, b) { return a + Math.random() * (b - a); }

  function pathCum(path) {

  // ------------------------------------------------------- graph growth

  function growArbor(sx, sy) {
    var out = [];
    for (var b = 0; b < 3; b++) {
      var ang = rand(0, Math.PI * 2);
      var ctrl = [[sx, sy]];
      var len = rand(22, 40);
      for (var i = 1; i <= 4; i++) {
        ang += rand(-0.35, 0.35);
        ctrl.push([sx + Math.cos(ang) * len * i / 4, sy + Math.sin(ang) * len * i / 4]);
      }
      var branch = smooth(ctrl);
      out.push(branch);
      var tip = branch[branch.length - 1];
      addBouton(tip[0], tip[1], null);
      if (Math.random() < 0.5) {
        var k0 = Math.max(1, branch.length - 4);
        var base = branch[k0];
        var twAng = Math.atan2(tip[1] - base[1], tip[0] - base[0]) + rand(-0.9, 0.9);
        var twig = [base];
        for (var t2 = 1; t2 <= 2; t2++) { twAng += rand(-0.4, 0.4); twig.push([base[0] + Math.cos(twAng) * 5 * t2, base[1] + Math.sin(twAng) * 5 * t2]); }

        out.push(tpath);
        var tt = tpath[tpath.length - 1];

  }

  }
  function growCablePath(sx, sy, tx, ty) {
    var mx = (sx + tx) / 2, my = (sy + ty) / 2;

    var px = -dy / len, py = dx / len;
    var sag = Math.min(len * 0.13, 24) * rand(0.7, 1.3);
    var c1 = { x: mx - px * sag - dx * 0.15, y: my - py * sag - dy * 0.15 };
    var c2 = { x: mx + px * sag * 0.55 + dx * 0.12, y: my + py * sag * 0.55 + dy * 0.12 };
    return smooth([[sx, sy], [c1.x, c1.y], [c2.x, c2.y], [tx, ty]]);
  }

  // ------------------------------------------------------- layout (graph panel coords)

  function buildGraphLayout() {
    cells = []; boutons = [];
    var zx0 = GW * 0.08, zx1 = GW * 0.92, zy0 = GH * 0.10, zy1 = GH * 0.86;

    for (var c = 0; c < CHAIN_KEYS.length; c++) {
      var key = CHAIN_KEYS[c];
      var def = CHAINS[key];
      var ax = (def.anchor[0] + rand(-0.01, 0.01)) * GW;
      var ay = (def.anchor[1] + rand(-0.01, 0.01)) * GH;
      var pts = [];

      for (var f = 0; f < def.facts.length; f++) {
        var fact = def.facts[f];
        var ring = fact[1] === 1 ? rand(26, 46) : fact[1] === 2 ? rand(42, 66) : rand(58, 84);
        var a2 = rand(0, Math.PI * 2);
        pts.push({
          text: fact[0], ch: key, ho: fact[1], k: fact[2],
          fired: false, litIdx: 0, flashT: 0, drain: 0, charge: 0,
          x: clamp(ax + Math.cos(a2) * ring, zx0, zx1),
          y: clamp(ay + Math.sin(a2) * ring, zy0, zy1),
          qx: 0, qy: 0
        });
      }

      for (var it = 0; it < 20; it++) {
        for (var i = 0; i < pts.length; i++) {
          for (var j = i + 1; j < pts.length; j++) {
            var a = pts[i], b = pts[j];
            var dx = b.x - a.x, dy = b.y - a.y;
            var d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
            if (d < 10) {
              var push = (10 - d) / 2;
              a.x = clamp(a.x - (dx / d) * push, zx0, zx1);
              a.y = clamp(a.y - (dy / d) * push, zy0, zy1);
              b.x = clamp(b.x + (dx / d) * push, zx0, zx1);
              b.y = clamp(b.y + (dy / d) * push, zy0, zy1);
            }
          }
        }
      }

      for (var k = 0; k < pts.length; k++) {
        pts[k].qx = pts[k].x; pts[k].qy = pts[k].y;
        pts[k].arbors = growArbor(pts[k].x, pts[k].y);
      }
      var cx = 0, cy = 0;
      for (var m = 0; m < pts.length; m++) { cx += pts[m].x; cy += pts[m].y; }
      chainMeta[key] = { x: cx / pts.length, y: cy / pts.length, r: 90 };
      cells = cells.concat(pts);
    }

    buildNerveNet();
    buildMotes();
  }

  function buildNerveNet() {
    allCables = []; threads = [];
    for (var c = 0; c < CHAIN_KEYS.length; c++) {
      var key = CHAIN_KEYS[c];
      var h1 = chainCells(key, 1), h2 = chainCells(key, 2), h3 = chainCells(key, 3);
      if (h1.length && h2.length) allCables.push(makeCable(h1[0], h2[0]));
      if (h2.length && h3.length) allCables.push(makeCable(h2[0], h3[0]));
      if (h2.length > 1 && h3.length) allCables.push(makeCable(h2[1 % h2.length], h3[0]));

    }
  }
  function chainCells(key, ho) {

  // ------------------------------------------------------- matching

  function tokens(text) {
    var raw = text.toLowerCase().split(/[^a-z\u2019]+/);

      var w = raw[i];
      if (w.length > 4 && /ing$/.test(w)) w = w.slice(0, -3);
      if (w.length > 5 && /ed$/.test(w)) w = w.slice(0, -2);
      if (w.length > 4 && /s$/.test(w)) w = w.slice(0, -1);

  }

  // ------------------------------------------------------- the voice — a collection of sentences

  var COMBINERS = [
    ', because ', ', which is why ', '; in fact, ', '; that is, ',
    ', and so ', ', and in turn ', '; from there, ', ', after all, '
  ];
  var FOLLOW_UPS = [
    'that is the whole of it.',
    'and that is the shape of it.',
    'which is to say the graph already knew.',
    'and the nerves hold it together.',
    'so there it is, in one breath.',
    'and that, roughly, is the answer.'

  function buildSentence(parts) {
    var cleaned = parts.map(function (p) { return p.replace(/[.!?]+$/, ''); });

      s = cleaned[0];
    } else {
      s = cleaned[0];

      }

  }

  // the answer: always a collection of sentences, randomised shape each run
  function generateBlock(group, chips) {
    var facts = group.slice(0, 6).map(function (f) { return f.text.replace(/[.!?]+$/, ''); });
    var chip = chips[rInt(chips.length)];
    var roll = Math.random();

    var order = shuffle(facts.slice());
    var units = [];
    var i = 0;
    while (i < order.length) {
      if (i + 1 < order.length && Math.random() < 0.5) {
        units.push(buildSentence([order[i], order[i + 1]]));
        i += 2;
      } else {
        units.push(buildSentence([order[i]]));
        i += 1;
      }

      var one = shuffle(facts.slice()).slice(0, 2 + rInt(2));

      while (units.length > 2 + rInt(2)) {
        var a = units.shift(), b = units.shift();
        units.unshift(buildSentence([a, b]));

        'the short version: ',

        'so, about \u201c' + chip + '\u201d: ',

        'honestly it comes down to this: '

      text += '\n' + fu.charAt(0).toUpperCase() + fu.slice(1);
    }

    return text;
  }

  // ------------------------------------------------------- answering

  function setBox(off) {

    submitEl.disabled = off;

  }

  function resetPanels() {
    chipsEl.textContent = '';
    flistEl.textContent = '';

  }

  function run(text) {
    if (state === 'keywords' || state === 'facts' || state === 'connections' || state === 'forming') return;
    setBox(true);
    t0 = performance.now();
    resetPanels();
    for (var i = 0; i < cells.length; i++) {

    var scoredAll = cells.map(function (c, idx) { return { c: c, s: scores[idx] || 0 }; })

    if (spine0 && sel.indexOf(spine0) >= 0) {

    }

    var avgLen = Math.max(30, Math.round(answerText.length / (sentences || 1)));

    synthesis = {

      conStart: 0, conEach: 150, conEnd: 0,

    synthesis.kwEnd = synthesis.kwStart + chips.length * synthesis.kwStagger + 220;
    synthesis.factStart = synthesis.kwEnd + 240;
    synthesis.factEnd = synthesis.factStart + (ordered.length - 1) * synthesis.factEach + 260;
    synthesis.conStart = synthesis.factEnd + 200;
    synthesis.conEnd = synthesis.conStart + ordered.length * synthesis.conEach;
    synthesis.answerStart = synthesis.conEnd + 260;

    var from = { x: GW / 2, y: 14 };
    for (var o = 0; o < ordered.length; o++) {
      var to = ordered[o];
      var path = growCablePath(from.x, from.y, to.x, to.y);
      var cum = pathCum(path);
      runEdges.push({
        a: null, b: to, path: path, cum: cum,
        buildT: synthesis.conStart + o * synthesis.conEach,
        launched: false, done: false
      });
      from = { x: to.x, y: to.y };
    }
    if (ordered.length >= 3) {
      var la = ordered[0], lb = ordered[2];
      var lpath = growCablePath(la.x, la.y, lb.x, lb.y);
      runEdges.push({
        a: la, b: lb, path: lpath, cum: pathCum(lpath),
        buildT: synthesis.answerStart - 140, launched: false, done: false
      });
    }

    // fact list with little dots, generated fast
    flistEl.textContent = '';
    var hl = chips.slice(0, 3);
    for (var fx = 0; fx < ordered.length; fx++) {
      var cell = ordered[fx];
      var row = document.createElement('div');
      row.className = 'fkg';
      var dEl = document.createElement('span');
      dEl.className = 'fdot';
      dEl.textContent = String(cell.litIdx);
      var tEl = document.createElement('span');
      tEl.className = 'fl';
      var txt = cell.text;
      for (var hi = 0; hi < hl.length; hi++) {
        if (!hl[hi]) continue;
        var rx = new RegExp('(' + hl[hi].replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
        txt = txt.replace(rx, function (m) { return '<span class="hl">' + m + '</span>'; });
      }
      tEl.innerHTML = txt;
      row.appendChild(dEl);
      row.appendChild(tEl);
      flistEl.appendChild(row);
    }

    readGraphSize();
    splitEl.classList.add('on');
    kwtagEl.classList.add('hot');
    inputEl.value = '';
    ansEl.textContent = '';
    answerEl.classList.remove('show');
    againEl.classList.remove('show');
    againEl.classList.remove('bright');

    state = 'keywords';
  }

  // ------------------------------------------------------- graph renderer

  function readGraphSize() {
    gw = grCanvas.clientWidth; gh = grCanvas.clientHeight;
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    grCanvas.width = gw * dpr;
    grCanvas.height = gh * dpr;
    grCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (gw > 4 && gh > 4 && (gw !== GW || gh !== GH)) {
      GW = gw; GH = gh;
      buildGraphLayout();
    }
    return { gw: gw, gh: gh };
  }

  // cached graph size for drawing
  var gw = 0, gh = 0;

  function drawGraph() {
    var hide = state === 'forming' || state === 'answered';
    var fade = (synthesis && hide) ? synthesis.fade : 1;
    if (fade <= 0.01) return;

    grCtx.clearRect(0, 0, gw, gh);

    for (var b = 0; b < boutons.length; b++) boutons[b].flare = Math.max(0, boutons[b].flare - 0.006);
    for (var i = 0; i < cells.length; i++) {
      var n = cells[i];
      n.charge *= 0.972;
      n.qx = n.x + Math.sin(frame * 0.005 + i) * (n.fired ? 1.3 : 0.5);
      n.qy = n.y + Math.cos(frame * 0.006 + i * 1.7) * (n.fired ? 1.3 : 0.5);
      if (n.flashT > 0) n.flashT -= 0.035;
    }

    // the plexus (arbors + base cables + threads) as light
    for (var cn = 0; cn < cells.length; cn++) {
      var cell = cells[cn];
      var arbA = (0.03 + Math.min(0.5, cell.charge * 0.25)) * fade;
      for (var ap = 0; ap < cell.arbors.length; ap++) drawFibre(grCtx, cell.arbors[ap], arbA, 1.0);
    }
    for (var cb = 0; cb < allCables.length; cb++) drawFibre(grCtx, allCables[cb].path, 0.03 * fade, 0.8);
    for (var th = 0; th < threads.length; th++) drawFibre(grCtx, threads[th], 0.025 * fade, 0.7);

    // freshly grown run-edges
    for (var re = 0; re < runEdges.length; re++) {
      var eg = runEdges[re];
      if (!eg.launched) continue;
      var frac = clamp((now - eg.buildT) / 520, 0, 1);
      if (frac < 1) drawPathT(grCtx, eg.path, eg.cum, frac, 0.5 * fade, 1.2);
      else drawFibre(grCtx, eg.path, 0.12 * fade, 1.0);
    }

    // impulse wakes
    for (var im = 0; im < impulses.length; im++) {
      var imp = impulses[im];
      if (imp.done || now < imp.started) continue;
      var pos = pointAt(imp.path, imp.cum, imp.d);
      var grad = grCtx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 7);
      grad.addColorStop(0, lerpColorA(0.8, fade));
      grad.addColorStop(1, 'rgba(255,166,201,0)');
      grCtx.fillStyle = grad;
      grCtx.beginPath(); grCtx.arc(pos.x, pos.y, 7, 0, Math.PI * 2); grCtx.fill();
    }

    // neurons: bright rings for the chosen facts, faint motes otherwise
    for (var n2 = 0; n2 < cells.length; n2++) {
      var nd2 = cells[n2];
      if (nd2.fired) {
        var g = Math.min(30, 6 + Math.min(1, nd2.charge) * 20);
        var rad = grCtx.createRadialGradient(nd2.qx, nd2.qy, 0, nd2.qx, nd2.qy, g);
        rad.addColorStop(0, lerpColor((0.25 + Math.min(1, nd2.charge) * 0.2) * fade));
        rad.addColorStop(1, 'rgba(255,166,201,0)');
        grCtx.fillStyle = rad;
        grCtx.beginPath(); grCtx.arc(nd2.qx, nd2.qy, g, 0, Math.PI * 2); grCtx.fill();
        if (nd2.flashT > 0) {
          grCtx.strokeStyle = lerpColor(nd2.flashT * 0.5 * fade);
          grCtx.lineWidth = 1.3;
          grCtx.beginPath(); grCtx.arc(nd2.qx, nd2.qy, (1 - nd2.flashT) * 26 + 7, 0, Math.PI * 2); grCtx.stroke();
        }
        if (nd2.litIdx > 0) {
          grCtx.fillStyle = 'rgba(10,10,15,0.9)';
          grCtx.beginPath(); grCtx.arc(nd2.qx + 10, nd2.qy - 5, 6, 0, Math.PI * 2); grCtx.fill();
          grCtx.strokeStyle = lerpColor(0.8 * fade);
          grCtx.lineWidth = 1;
          grCtx.stroke();
          grCtx.fillStyle = ACCENT;
          grCtx.font = '700 8px "CMU Sans Serif", sans-serif';
          grCtx.textAlign = 'center'; grCtx.textBaseline = 'middle';
          grCtx.fillText(String(nd2.litIdx), nd2.qx + 10, nd2.qy - 5);
        }
      } else {
        var rst = 0.5 + 0.5 * Math.sin(now * 0.002 + nd2.litIdx * 99 + n2);
        grCtx.globalAlpha = 0.08 * fade + rst * 0.05 * fade;
        grCtx.fillStyle = GREY;
        grCtx.beginPath(); grCtx.arc(nd2.qx, nd2.qy, 1.4, 0, Math.PI * 2); grCtx.fill();
        grCtx.globalAlpha = 1;
      }
    }

    // motes drift through the graph
    for (var mo = 0; mo < motes.length; mo++) {
      var mm = motes[mo];
      mm.x += mm.vx; mm.y += mm.vy;
      if (mm.x < -4) mm.x = gw + 4; else if (mm.x > gw + 4) mm.x = -4;
      if (mm.y < -4) mm.y = gh + 4; else if (mm.y > gh + 4) mm.y = -4;
      var tw = 0.5 + 0.5 * Math.sin(now * 0.001 + mm.ph);
      grCtx.globalAlpha = (0.10 + tw * 0.08) * fade;
      grCtx.fillStyle = mm.pink ? ACCENT : GREY;
      grCtx.beginPath(); grCtx.arc(mm.x, mm.y, mm.r, 0, Math.PI * 2); grCtx.fill();
      grCtx.globalAlpha = 1;
    }
  }

  function drawFibre(c, path, alpha, width) {
    c.strokeStyle = ACCENT;
    c.lineWidth = width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.globalAlpha = alpha;
    c.beginPath();
    c.moveTo(path[0][0], path[0][1]);
    for (var i = 1; i < path.length; i++) c.lineTo(path[i][0], path[i][1]);
    c.stroke();
    c.globalAlpha = 1;
  }
  function drawPathT(c, path, cum, frac, alpha, width) {
    if (frac <= 0) return;
    var total = cum[cum.length - 1];
    var d = total * Math.min(1, frac);
    var lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
    c.globalAlpha = alpha;
    c.strokeStyle = ACCENT;
    c.lineWidth = width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(path[0][0], path[0][1]);
    for (var i = 1; i <= lo; i++) c.lineTo(path[i][0], path[i][1]);
    if (lo < path.length - 1) { var p = pointAt(path, cum, d); c.lineTo(p.x, p.y); }
    c.stroke();
    c.globalAlpha = 1;
  }

  // ------------------------------------------------------- update

  function renderChips() {
    if (!synthesis) return;
    var frags = [];
    for (var i = 0; i < synthesis.chips.length; i++) {
      var t0c = synthesis.kwStart + i * synthesis.kwStagger;
      if (now < t0c) break;
      var spent = now - t0c;
      var full = synthesis.chips[i];
      var shown = Math.min(full.length, Math.floor(spent / CHIP_MS));
      var s = document.createElement('span');
      s.className = 'chip';
      s.textContent = shown < full.length ? full.slice(0, shown) + '\u258b' : full;
      frags.push(s);
    }
    chipsEl.textContent = '';
    for (var fi = 0; fi < frags.length; fi++) chipsEl.appendChild(frags[fi]);
  }
  function revealFactsAt(start, each) {
    var rows = flistEl.querySelectorAll('.fkg');
    for (var i = 0; i < rows.length; i++) {
      if (now >= start + i * each) rows[i].style.opacity = '1';
    }
  }

  function update(dt) {
    if (synthesis) {
      var skd = synthesis;

      if (state === 'keywords') {
        renderChips();
        if (now >= skd.factStart) {
          state = 'facts';
          kwtagEl.classList.remove('hot');
          facttagEl.classList.add('hot');
          graphtagEl.classList.add('hot');
        }
      }

      if (state === 'facts') {
        revealFactsAt(skd.factStart, skd.factEach);
        for (var fo = 0; fo < skd.ordered.length; fo++) {
          var ft = skd.factStart + fo * skd.factEach;
          if (now >= ft && !skd.ordered[fo].fired) fireNode(skd.ordered[fo]);
        }
        if (now >= skd.conStart) {
          state = 'connections';
          facttagEl.classList.remove('hot');
        }
      }

      if (state === 'connections') {
        var allLaunched = true;
        for (var be = 0; be < runEdges.length; be++) {
          var edge = runEdges[be];
          if (!edge.launched) {
            if (now >= edge.buildT) {
              edge.launched = true;
              impulses.push(mkImpulse(edge, now, fireNode.bind(null, edge.b)));
            } else {
              allLaunched = false;
            }
          }
          if (edge.launched && now >= edge.buildT + 520) edge.done = true;
        }
        if (allLaunched && now >= skd.answerStart) {
          state = 'forming';
          splitEl.classList.remove('on');
          colEl.classList.remove('raised');
          skd.fade = 1;
          skd.typeRate = Math.max(6, Math.min(16, Math.round(3400 / skd.text.length)));
          skd.flowStart = now;
          answerEl.classList.add('show');
        }
      }

      if (state === 'forming') {
        skd.typeHold += dt;
        while (skd.typeIdx < skd.text.length && skd.typeHold >= skd.typeRate) {
          skd.typeHold -= skd.typeRate;
          skd.typeIdx++;
          ansEl.textContent = skd.text.slice(0, skd.typeIdx) + (skd.typeIdx < skd.text.length ? '\u2009\u258b' : '');
        }
        skd.fade = Math.max(0, skd.fade - dt / 900);
      }
      if (state === 'forming' && skd.typeIdx >= skd.text.length) {
        ansEl.textContent = skd.text;
        state = 'answered';
        againEl.classList.add('show');
        againEl.classList.add('bright');
        setBox(false);
        inputEl.focus();
        inputEl.placeholder = 'ask anything else\u2026';
      } else if (state === 'answered') {
        skd.fade = Math.max(0, skd.fade - dt / 420);
        for (var zz = 0; zz < cells.length; zz++) cells[zz].charge *= 0.985;
      } else if (state === 'settling') {
        if (synthesis && now - skd.flowStart > 2000) {
          state = 'idle';
          for (var v = 0; v < cells.length; v++) {
            cells[v].fired = false; cells[v].litIdx = 0; cells[v].drain = 0; cells[v].charge = 0;
          }
          impulses = []; runEdges = []; synthesis = null;
          againEl.classList.remove('bright');
          setBox(false);
        }
      }
    }

    for (var k = 0; k < impulses.length; k++) {
      var imp = impulses[k];
      if (imp.done || now < imp.started) continue;
      imp.d += imp.speed * dt;
      if (imp.d >= imp.len) {
        if (imp.onEnd) imp.onEnd();
        imp.done = true;
        continue;
      }
    }
  }

  function fireNode(node) {
    if (!node) return;
    if (!node.fired) { node.fired = true; node.flashT = 1; }
    node.charge = Math.min(2.4, node.charge + 1.5);
  }
  function mkImpulse(edge, started, onEnd) {
    var len = edge.cum[edge.cum.length - 1];
    var dur = clamp(len * 3.5, 300, 700);
    return { path: edge.path, cum: edge.cum, d: 0, speed: len / dur, started: started, done: false, onEnd: onEnd };
  }

  // ------------------------------------------------------- background canvas (the quiet page)

  function drawBackground() {
    var breath = now * 0.0015;
    bgCtx.clearRect(0, 0, BW, BH);
    var throb = 0.5 + 0.5 * Math.sin(breath);
    var bg = bgCtx.createRadialGradient(BW / 2, BH * 0.5, 0, BW / 2, BH * 0.5, BH * 0.95);
    bg.addColorStop(0, lerpColor(0.006 + 0.008 * throb));
    bg.addColorStop(1, 'rgba(255,166,201,0)');
    bgCtx.fillStyle = bg;
    bgCtx.fillRect(0, 0, BW, BH);
  }

  // ------------------------------------------------------- boot

  function sizeBackground() {
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    BW = bgCanvas.clientWidth; BH = bgCanvas.clientHeight;
    bgCanvas.width = BW * dpr;
    bgCanvas.height = BH * dpr;
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  submitEl.addEventListener('click', function () { if (inputEl.value.trim()) run(inputEl.value.trim()); });
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' && inputEl.value.trim()) { e.preventDefault(); run(inputEl.value.trim()); inputEl.focus(); } });

  function tick(ts) {
    var dt = lastT ? Math.min(ts - lastT, 50) : 16;
    lastT = ts;
    now = ts; frame = ts;
    update(dt);
    drawBackground();
    if (synthesis && (state === 'facts' || state === 'connections' || state === 'forming' || state === 'answered')) {
      drawGraph();
    } else {
      grCtx.clearRect(0, 0, gw, gh);
    }
    requestAnimationFrame(tick);
  }

  function resize() {
    sizeBackground();
    readGraphSize();
    colEl.classList.remove('raised');
    resetPanels();
    setBox(false);
    state = 'idle';
    synthesis = null; runEdges = []; impulses = [];
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { readGraphSize(); });
  }
})();
</script>
</body>
</html>
