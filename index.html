<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>not a lookup. a lighting-up.</title>
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #e9e9ee;
    --grey: #8e8e98;
    --dim: #45454d;
    --accent: #ffa6c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .scene {
    position: relative;
    height: 100vh;
    overflow: hidden;
  }

  #stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .title {
    position: absolute;
    top: 7%;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
  .title h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(22px, 3.4vw, 40px);
    letter-spacing: 0.02em;
    line-height: 1.3;
    color: var(--ink);
  }

  .hint {
    margin-top: 14px;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .ui {
    position: absolute;
    bottom: 7%;
    left: 0;
    right: 0;
    text-align: center;
    user-select: none;
  }

  .chips {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .chip {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 13.5px;
    letter-spacing: 0.03em;
    color: var(--grey);
    background: transparent;
    border: 1px solid var(--dim);
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    outline: none;
    transition: color 0.35s ease, border-color 0.35s ease, opacity 0.35s ease;
  }
  .chip:hover:not(.off) { color: var(--accent); border-color: rgba(255,166,201,0.5); }
  .chip.off { opacity: 0.35; cursor: default; pointer-events: none; }

  .again {
    display: inline-block;
    margin-top: 22px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--grey);
    opacity: 0;
    cursor: pointer;
    transition: opacity 0.8s ease, color 0.3s ease;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: var(--dim);
  }
  .again:hover { color: var(--accent); }
  .again.show { opacity: 1; }

  .reply {
    position: absolute;
    left: 0;
    right: 0;
    top: 61%;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 1.2s ease, transform 1.2s ease;
    user-select: none;
  }
  .reply.show {
    opacity: 1;
    transform: translateY(0);
  }
  .reply p {
    max-width: 560px;
    margin: 0 auto;
    font-size: 16px;
    line-height: 1.7;
    letter-spacing: 0.02em;
    color: var(--grey);
  }
  .reply p .soft { color: var(--ink); font-style: italic; font-family: Georgia, serif; }
</style>
</head>
<body>

  <div class="scene">
    <canvas id="stage"></canvas>

    <div class="title">
      <h1>not a lookup. a lighting-up.</h1>
      <div class="hint">choose a thought to feed it</div>
    </div>

    <div class="reply"><p id="replytext"></p></div>

    <div class="ui">
      <div class="chips" id="chips"></div>
      <div class="again" id="again">run again</div>
    </div>
  </div>

<script>
(function () {
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var chipsEl = document.getElementById('chips');
  var replyEl = document.getElementById('replytext');
  var againEl = document.getElementById('again');

  var ACCENT = '#ffa6c9';
  var DIMGREY = 'rgba(230,230,236,0.30)';

  var PROMPTS = [
    {
      text: 'why is the sky blue',
      words: ['why','is','the','sky','blue'],
      reply: 'light comes in <span class="soft">white</span> and leaves as blue.'
    },
    {
      text: 'write me a poem',
      words: ['write','me','a','poem'],
      reply: 'the stars are small holes where the dark keeps its light.'
    },
    {
      text: 'what should i eat',
      words: ['what','should','i','eat'],
      reply: 'eat what the day has already warmed.'
    }
  ];

  var W, H, DPR;
  var dots = [];          // the standing constellation
  var seeds = [];         // words entering from the top
  var now = 0;            // ms clock (updated per frame)
  var started = 0;        // when the current sequence began
  var state = 'idle';     // idle | sequence | condensing | answered
  var frame = 0;

  var condensation = null;   // { members, target, start, dur }
  var node = null;           // { x, y, born } the single lit answer

  // ---------------------------------------------------------------- dots

  function makeConstellation() {
    dots = [];
    var n = 50;
    // 4 loose clusters imply structure
    var clusters = [];
    for (var c = 0; c < 4; c++) {
      clusters.push({
        x: W * rand(0.15, 0.85),
        y: H * rand(0.2, 0.82),
        count: 9 + Math.floor(Math.random() * 4)
      });
    }
    var per = [];
    for (var i = 0; i < clusters.length; i++) {
      for (var j = 0; j < clusters[i].count; j++) per.push(i);
    }
    while (per.length < n - 8) per.push(-1);         // stragglers
    while (per.length < n) per.push(-1);

    for (var k = 0; k < per.length; k++) {
      var cl = per[k] >= 0 ? clusters[per[k]] : null;
      var x, y;
      if (cl) {
        x = cl.x + rand(-1, 1) * 160;
        y = cl.y + rand(-1, 1) * 130;
      } else {
        x = rand(0.04, 0.96) * W;
        y = rand(0.14, 0.9) * H;
      }
      dots.push({
        cx: clamp(x, 8, W - 8),
        cy: clamp(y, 8, H - 8),
        r: rand(1.4, 2.6),
        ph: rand(0, Math.PI * 2),       // twinkle phase
        dp: rand(0, Math.PI * 2),       // drift phase
        drift: rand(1.5, 5),
        lit: false,
        caughtBy: [],
        bright: false,
        fade: 1                         // used when condensing away non-members
      });
    }
  }

  // ---------------------------------------------------------------- seeds

  function spawnWords(prompt, t0) {
    seeds = [];
    var n = prompt.words.length;
    for (var i = 0; i < n; i++) {
      seeds.push({
        idx: i,
        x: W * (0.18 + i * (0.64 / (n > 1 ? n - 1 : 1))) + rand(-14, 14),
        y: -24,
        ty: H * (0.3 + (i % 2) * 0.05),
        vy: 0,
        spawned: t0 + 150 * i,
        state: 'pending',
        stateAt: 0,
        testDelay: 320 + 130 * (i % 3),
        testStart: 0,
        probes: [],
        resolvedAt: 0
      });
    }
  }

  function makeProbes(seed) {
    var ordered = dots.slice().sort(function (a, b) {
      return dist2(seed.x, seed.y, a.cx, a.cy) - dist2(seed.x, seed.y, b.cx, b.cy);
    }).slice(0, 13);

    var probes = [], caught = 0;
    for (var i = 0; i < ordered.length; i++) {
      var d = ordered[i];
      if (probes.some(function (p) { return p.dot === d; })) continue;
      if (i >= 4 && caught >= 6) break;
      var closeness = 1 - Math.sqrt(dist2(seed.x, seed.y, d.cx, d.cy)) / (W * 0.5);
      var pCatch = clamp(0.28 + closeness * 0.55, 0.25, 0.9);
      var hit = (i < 2) || Math.random() < pCatch;
      if (hit && caught < 6) caught++;
      probes.push({ dot: d, catch: hit, p: 0, resolved: false, start: 0 });
    }
    seed.probes = probes;
  }

  // ---------------------------------------------------------------- sequence update

  function update() {
    if (state === 'idle') return;
    if (state === 'sequence') updateSequence();
    else if (state === 'condensing') updateCondense();
    else updateAnswered();
  }

  function updateSequence() {
    var allDone = true, anyCatch = false;

    for (var i = 0; i < seeds.length; i++) {
      var s = seeds[i];

      if (s.state === 'pending' && now >= s.spawned) {
        s.state = 'falling';
        s.vy = rand(0.5, 0.7);
      }
      if (s.state === 'falling') {
        s.vy += 0.004;
        s.y += s.vy * 1.0;
        if (s.y >= s.ty) { s.y = s.ty; s.state = 'landed'; s.stateAt = now; }
      }
      if (s.state === 'landed' && now >= s.stateAt + s.testDelay) {
        s.state = 'testing';
        s.testStart = now;
        makeProbes(s);
        s.resolvedAt = now + 460;
      }
      if (s.state === 'testing') {
        var q = (now - s.testStart) / 460;
        if (q >= 1) s.state = 'done';
        else {
          // resolve probes progressively within the sweep
          var resolved = 0;
          for (var j = 0; j < s.probes.length; j++) {
            var pr = s.probes[j];
            var rp = clamp((now - s.testStart - j * 60) / 320, 0, 1);
            pr.p = rp;
            if (rp >= 0.82) {
              if (!pr.resolved) {
                pr.resolved = true;
                if (pr.catch) {
                  pr.dot.lit = true;
                  if (pr.dot.caughtBy.indexOf(s.idx) < 0) pr.dot.caughtBy.push(s.idx);
                  pr.dot.bright = pr.dot.caughtBy.length >= 2;
                  pr.bright = pr.dot.bright;
                } else {
                  pr.bright = false;
                }
              }
              resolved++;
            }
          }
          s.resolvedP = resolved;
        }
      }

      if (s.state !== 'done') allDone = false;
      if (s.probes.length && s.probes.some(function (x) { return x.resolved && x.catch; })) anyCatch = true;
    }

    if (allDone && anyCatch && condensation === null) {
      state = 'condensing';
      beginCondense();
    }
  }

  // ---------------------------------------------------------------- condense

  function selectMembers() {
    // union-find over seeds (with catches) and lit dots
    var parent = {}, rank = {};
    function make(k) { if (!parent[k]) { parent[k] = k; rank[k] = 0; } }
    function find(k) { make(k); while (parent[k] !== k) { parent[k] = parent[parent[k]]; k = parent[k]; } return k; }
    function uni(a, b) {
      var ra = find(a), rb = find(b);
      if (ra === rb) return;
      if (rank[ra] < rank[rb]) parent[ra] = rb;
      else if (rank[ra] > rank[rb]) parent[rb] = ra;
      else { parent[rb] = ra; rank[ra]++; }
    }

    var seedIndex = {};
    var litDots = [];
    for (var i = 0; i < seeds.length; i++) seedIndex[seeds[i].idx] = i;
    for (var k = 0; k < dots.length; k++) {
      var d = dots[k];
      if (d.lit && d.caughtBy.length) {
        litDots.push(d);
        for (var c = 0; c < d.caughtBy.length; c++) {
          var si = seedIndex[d.caughtBy[c]];
          uni('s' + si, 'd' + k);
        }
      }
    }

    // group components
    var comps = {};
    var keys = [];
    for (var key in parent) {
      var root = find(key);
      if (!comps[root]) { comps[root] = { keys: [], score: 0 }; keys.push(root); }
      comps[root].keys.push(key);
    }
    // score
    for (var r in comps) {
      var ck = comps[r].keys;
      for (var i2 = 0; i2 < ck.length; i2++) {
        var k2 = ck[i2];
        if (k2[0] === 's') {
          comps[r].score += 1;
        } else {
          var di = parseInt(k2.slice(1), 10);
          var dot = dots[di];
          comps[r].score += dot.bright ? 2.5 : 1;
          comps[r].score += dot.caughtBy.length >= 2 ? 2 : 0;
        }
      }
    }
    var best = null;
    for (var r2 in comps) {
      if (!best || comps[r2].score > best.score) best = comps[r2];
    }
    if (!best) return null;

    var members = [];
    for (var m = 0; m < best.keys.length; m++) {
      var kk = best.keys[m];
      if (kk[0] === 's') {
        var si2 = parseInt(kk.slice(1), 10);
        var seed = seeds[si2];
        if (seed.probes.some(function (x) { return x.catch && x.resolved; })) {
          members.push({ x: seed.x, y: seed.y, kind: 'seed', seed: seed });
        }
      } else {
        var dk = parseInt(kk.slice(1), 10);
        var d2 = dots[dk];
        members.push({ x: d2.x, y: d2.y, kind: 'dot', dot: d2 });
      }
    }
    return members;
  }

  function beginCondense() {
    var members = selectMembers();
    if (!members) { state = 'answered'; return; }
    // fade out lit dots that are NOT members
    for (var i = 0; i < dots.length; i++) {
      if (dots[i].lit && !members.some(function (m) { return m.dot === dots[i]; })) {
        dots[i].dotFade = 1.3; // will decay
      }
    }
    var cx = 0, cyy = 0;
    for (var j = 0; j < members.length; j++) { cx += members[j].x; cyy += members[j].y; }
    cx /= members.length; cyy /= members.length;
    condensation = {
      members: members,
      from: { x: cx, y: cyy },
      target: { x: W * 0.5, y: H * 0.48 },
      start: now,
      dur: 1200
    };
    state = 'condensing';
  }

  function updateCondense() {
    var t = clamp((now - condensation.start) / condensation.dur, 0, 1);
    var e = easeInOut(t);
    for (var i = 0; i < condensation.members.length; i++) {
      var m = condensation.members[i];
      m.x += (condensation.target.x - m.x) * (0.035 + 0.05 * easeInOut(Math.min(1, t * 1.6)));
      m.y += (condensation.target.y - m.y) * (0.035 + 0.05 * easeInOut(Math.min(1, t * 1.6)));
    }
    // decay non-member lit dots
    for (var j = 0; j < dots.length; j++) {
      var d = dots[j];
      if (d.dotFade) d.dotFade -= 0.02;
    }
    if (t >= 1) {
      node = { x: condensation.target.x, y: condensation.target.y, born: now };
      state = 'answered';
      showReply();
    }
  }

  function updateAnswered() {
    // keep decay running
    for (var j = 0; j < dots.length; j++) {
      var d = dots[j];
      if (d.dotFade) d.dotFade -= 0.02;
    }
  }

  function showReply() {
    setTimeout(function () {
      var p = replyEl.closest('.reply');
      p.classList.add('show');
      againEl.classList.add('show');
    }, 250);
  }

  // ---------------------------------------------------------------- drawing

  function draw() {
    ctx.clearRect(0, 0, W, H);

    var lx, ly;
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var x = d.cx + Math.sin(frame * 0.006 + d.dp) * d.drift;
      var y = d.cy + Math.cos(frame * 0.005 + d.dp * 1.3) * d.drift;
      d.x = x; d.y = y;
    }

    // condensation / answer state
    if (condensation && state === 'condensing') {
      var t = clamp((now - condensation.start) / condensation.dur, 0, 1);
      var ring = easeOutCubic(t);
      ctx.strokeStyle = 'rgba(255,166,201,' + (0.5 * ring) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(condensation.target.x, condensation.target.y, 6 + ring * 90, 0, Math.PI * 2);
      ctx.stroke();

      for (var m = 0; m < condensation.members.length; m++) {
        var mem = condensation.members[m];
        drawDot(mem.x, mem.y, 2.2, ACCENT, 0.55, 0.35);
      }
    }
    if (node) {
      var pulse = 0.5 + 0.5 * Math.sin(now * 0.0055);
      drawDot(node.x, node.y, 4 + pulse * 3, ACCENT, 0.95, 0.9);
    }

    // seed word particles
    for (var s = 0; s < seeds.length; s++) {
      var seed = seeds[s];
      if (seed.state === 'pending') continue;
      drawDot(seed.x, seed.y, 3.2, ACCENT, 0.9, 0.7);
      // rays that haven't resolved yet
      if (seed.state === 'testing') {
        for (var j = 0; j < seed.probes.length; j++) {
          var pr = seed.probes[j];
          if (pr.resolved) continue;
          var pl = pr.p * dist(seed.x, seed.y, pr.dot.x, pr.dot.y);
          var ang = Math.atan2(pr.dot.y - seed.y, pr.dot.x - seed.x);
          ctx.strokeStyle = 'rgba(255,166,201,' + (0.28 * Math.sin(pr.p * Math.PI) + 0.05) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(seed.x, seed.y);
          ctx.lineTo(seed.x + Math.cos(ang) * pl, seed.y + Math.sin(ang) * pl);
          ctx.stroke();
        }
      }
    }

    // persistent links before condensing (only while not yet resolved into node)
    if (state === 'sequence') {
      for (var s2 = 0; s2 < seeds.length; s2++) {
        var se2 = seeds[s2];
        for (var j2 = 0; j2 < se2.probes.length; j2++) {
          var pp = se2.probes[j2];
          if (!pp.resolved || !pp.catch) continue;
          var strong = pp.bright;
          ctx.strokeStyle = strong ? 'rgba(255,166,201,0.85)' : 'rgba(255,166,201,0.35)';
          ctx.lineWidth = strong ? 2 : 1;
          ctx.beginPath();
          ctx.moveTo(se2.x, se2.y);
          ctx.lineTo(pp.dot.x, pp.dot.y);
          ctx.stroke();
        }
      }
    }

    // constellation dots
    for (var k = 0; k < dots.length; k++) {
      var d2 = dots[k];
      if (d2.lit && !condensation) {
        // lit, still part of the search
        var gl = d2.bright ? 1 : 0.55;
        drawDot(d2.x, d2.y, d2.r + (d2.bright ? 1.2 : 0), ACCENT, gl, d2.bright ? 0.85 : 0.5);
      } else if (d2.lit && condensation && state !== 'answered') {
        // member dots are drawn with the condensation block
        continue;
      } else if (d2.dotFade) {
        if (d2.dotFade > 0) drawDot(d2.x, d2.y, d2.r, ACCENT, 0.5 * d2.dotFade, 0.4);
      } else {
        var tw = 0.8 + 0.2 * Math.sin(now * 0.002 + d2.ph);
        ctx.globalAlpha = 0.30 * tw;
        ctx.fillStyle = '#e6e6ec';
        ctx.beginPath();
        ctx.arc(d2.x, d2.y, d2.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawDot(x, y, r, col, glow, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 8 * glow + 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // ---------------------------------------------------------------- run

  function run(promptIdx) {
    if (state !== 'idle') return;
    setChips(true);
    replyEl.closest('.reply').classList.remove('show');
    againEl.classList.remove('show');
    condensation = null;
    node = null;
    started = performance.now();
    spawnWords(PROMPTS[promptIdx], started);
    replyEl.innerHTML = PROMPTS[promptIdx].reply;
    state = 'sequence';
  }

  function reset() {
    state = 'idle';
    condensation = null;
    node = null;
    seeds = [];
    replyEl.closest('.reply').classList.remove('show');
    againEl.classList.remove('show');
    for (var i = 0; i < dots.length; i++) {
      dots[i].lit = false; dots[i].caughtBy = []; dots[i].bright = false;
      dots[i].dotFade = 0;
    }
    makeConstellation();
    setChips(false);
  }

  function setChips(off) {
    var cs = document.querySelectorAll('.chip');
    for (var i = 0; i < cs.length; i++) {
      if (off) cs[i].classList.add('off'); else cs[i].classList.remove('off');
    }
  }

  // ---------------------------------------------------------------- loop

  function tick(ts) {
    var last = now;
    now = ts;
    frame = ts;
    update();
    draw();
    requestAnimationFrame(tick);
  }

  // ---------------------------------------------------------------- boot

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeConstellation();
    condensation = null; node = null; seeds = [];
    state = 'idle';
    setChips(false);
  }

  // build chips
  for (var i = 0; i < PROMPTS.length; i++) {
    (function (idx) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.textContent = PROMPTS[idx].text;
      b.addEventListener('click', function () { run(idx); });
      chipsEl.appendChild(b);
    })(i);
  }
  againEl.addEventListener('click', reset);

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);

  // ---------------------------------------------------------------- helpers

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist(x1, y1, x2, y2) { return Math.sqrt(dist2(x1, y1, x2, y2)); }
  function dist2(x1, y1, x2, y2) { var dx = x1 - x2, dy = y1 - y2; return dx * dx + dy * dy; }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
})();
</script>
</body>
</html>
