<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>type something and watch what connects</title>
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.cdnfonts.com/css/cmu-serif" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/cmu-sans-serif" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/cmu-typewriter-text" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #e9e9ee;
    --grey: #8e8e98;
    --dim: #40404a;
    --accent: #ffa6c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  body {
    font-family: "CMU Sans Serif", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }

  .scene { position: relative; height: 100vh; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .title {
    position: absolute; top: 4.5%; left: 0; right: 0;
    text-align: center; pointer-events: none; user-select: none;
  }
  .title h1 {
    font-family: "CMU Serif", Georgia, "Times New Roman", serif;
    font-weight: 500; font-size: clamp(18px, 2.5vw, 30px);
    letter-spacing: 0.02em; line-height: 1.4; color: var(--ink);
  }
  .hint {
    margin-top: 8px; font-size: 10px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--dim);
    font-family: "CMU Typewriter Text", monospace;
  }

  .promptbox {
    position: absolute; bottom: 4%; left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px; padding: 0 20px;
    user-select: none;
  }
  .promptbox input {
    flex: 0 1 420px;
    font-size: 15px; letter-spacing: 0.02em; color: var(--ink);
    background: rgba(18,18,28,0.75);
    border: 1px solid var(--dim); border-radius: 999px;
    padding: 13px 22px; outline: none;
    transition: border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
  }
  .promptbox input::placeholder { color: #565662; }
  .promptbox input:focus {
    border-color: rgba(255,166,201,0.6);
    box-shadow: 0 0 0 1px rgba(255,166,201,0.25), 0 0 26px rgba(255,166,201,0.12);
  }
  .promptbox input:disabled { opacity: 0.4; }
  .promptbox button {
    font-size: 14px; letter-spacing: 0.05em; color: var(--ink);
    background: rgba(255,166,201,0.12);
    border: 1px solid rgba(255,166,201,0.4); border-radius: 999px;
    padding: 0 24px; cursor: pointer; outline: none;
    transition: background 0.3s ease, opacity 0.4s ease;
  }
  .promptbox button:hover:not([disabled]) { background: rgba(255,166,201,0.24); }
  .promptbox button[disabled] { opacity: 0.35; cursor: default; }

  .reply {
    position: absolute; left: 0; right: 0; bottom: 13%;
    text-align: center; pointer-events: none; user-select: none;
    opacity: 0; transform: translateY(8px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .reply.show { opacity: 1; transform: translateY(0); }
  .reply p {
    display: inline-block; max-width: 680px; margin: 0 auto;
    padding: 14px 28px; font-family: "CMU Serif", Georgia, serif;
    font-size: 16px; line-height: 1.75; color: var(--ink);
    background: rgba(10,10,15,0.88);
    border: 1px solid rgba(255,166,201,0.12);
    box-shadow: 0 0 60px rgba(255,166,201,0.06);
    border-radius: 8px;
  }
</style>
</head>
<body>

  <div class="scene">
    <canvas id="stage"></canvas>

    <div class="title">
      <h1>type something and watch what connects.</h1>
      <div class="hint">a prompt fires a fact, the fact fires the next</div>
    </div>

    <div class="reply"><p id="replytext"></p></div>

    <div class="promptbox">
      <input id="input" type="text" placeholder="ask something..." autocomplete="off" spellcheck="false">
      <button id="submit">ask</button>
    </div>
  </div>

<script>
(function () {
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var inputEl = document.getElementById('input');
  var submitEl = document.getElementById('submit');
  var replyEl = document.getElementById('replytext');

  var ACCENT = '#ffa6c9';
  var GREY = '#e4e4ea';
  var PULSE_DUR = 420;

  // ----------------------------------------------------------- chains

  var CHAIN_KEYS = ['science', 'craft', 'myth', 'mind', 'machine'];

  var CHAINS = {
    science: {
      label: 'science',
      keywords: ['sky', 'blue', 'light', 'colour', 'color', 'sunlight', 'wavelength', 'scatter', 'atmosphere'],
      facts: [
        ['the sky looks blue during the day.', 1],
        ['sunlight is many colors mixed.', 1],
        ['each color of light has its own wavelength.', 1],
        ['blue light\u2019s wavelength is short.', 2],
        ['short wavelengths scatter off small particles.', 2],
        ['the air is full of tiny gas molecules.', 2],
        ['that scattering is rayleigh scattering.', 3]
      ],
      responses: [
        "blue light's wavelength is short, so gas molecules in the air scatter it hardest — that's rayleigh scattering, the reason the sky reads blue.",
        "sunlight is many colors; short wavelengths like blue scatter off air molecules more than the rest, and rayleigh scattering is what you end up seeing."
      ]
    },
    craft: {
      label: 'craft',
      keywords: ['poem', 'verse', 'haiku', 'rhyme', 'line', 'write me', 'poetry', 'sonnet', 'stanza'],
      facts: [
        ['a poem is writing arranged in lines.', 1],
        ['lines use rhythm and sometimes rhyme.', 1],
        ['a haiku is a short fixed-shape poem.', 1],
        ['a haiku has three lines.', 2],
        ['its first line has five syllables.', 2],
        ['free verse skips fixed rhyme.', 2],
        ['line breaks control the reader\u2019s pause.', 3]
      ],
      responses: [
        "a poem is arranged in lines; a haiku fixes that into three, while free verse uses line breaks alone — the pause is the craft.",
        "the line is the poet's unit; some forms like haiku lock the rhythm in, others shape it by where the lines break."
      ]
    },
    myth: {
      label: 'myth',
      keywords: ['arjuna', 'dharma', 'krishna', 'duty', 'hesitate', 'karma', 'mahabharata', 'battlefield', 'warrior'],
      facts: [
        ['arjuna is a warrior of the mahabharata.', 1],
        ['arjuna hesitates before kurukshetra.', 1],
        ['his relatives stand on the enemy side.', 1],
        ['krishna drives arjuna\u2019s chariot.', 2],
        ['krishna says fighting is his duty.', 2],
        ['this idea of duty is called dharma.', 2],
        ['skipping that duty would cause more harm.', 3]
      ],
      responses: [
        "arjuna hesitates to fight his own relatives, and krishna answers that the duty of a warrior is dharma — skipping it would do more harm than the battle.",
        "the enemy side holds his own family, so arjuna doubts; krishna's reply is that his warrior's duty — dharma — outweighs the cost."
      ]
    },
    mind: {
      label: 'mind',
      keywords: ['nerve', 'neuron', 'brain', 'signal', 'synapse', 'memory', 'think', 'thought', 'mind', 'threshold', 'how does memory'],
      facts: [
        ['signals travel along nerves as pulses.', 1],
        ['a cell fires when inputs cross a threshold.', 1],
        ['stronger signals make it fire more.', 1],
        ['cells pass the signal on at a synapse.', 2],
        ['repeated firing strengthens the connection.', 2],
        ['that is how patterns become memory.', 2],
        ['the whole network settles into a response.', 3]
      ],
      responses: [
        "a signal crosses a threshold, a cell fires, and repeated firing strengthens the path until the network settles into a response — that is a thought taking shape.",
        "nerves pass pulses across synapses; what fires often gets stronger, and out of that wiring a settled answer emerges."
      ]
    },
    machine: {
      label: 'machine',
      keywords: ['program', 'code', 'loop', 'function', 'recursion', 'algorithm', 'computer', 'software', 'bug', 'compile'],
      facts: [
        ['a program runs steps one after another.', 1],
        ['some steps only run if a condition holds.', 1],
        ['a loop repeats until a condition stops it.', 1],
        ['a function is a named, callable block.', 2],
        ['recursion is a function calling itself.', 2],
        ['the deepest call returns last.', 2],
        ['answers assemble from the deepest call up.', 3]
      ],
      responses: [
        "a loop repeats until a condition stops it, and recursion returns from its base case outward — both of them assemble an answer from pieces.",
        "branches pick a path, loops repeat until a condition ends them, and recursion builds the result from the deepest call upward."
      ]
    }
  };

  var FALLBACK = {
    responses: [
      'no chain fired for that one yet.',
      'that prompt doesn\u2019t connect to anything here.'
    ]
  };

  // domain drizzle — faint words that make the field feel vast
  var DRIZZLE = [
    'refraction','prism','ozone','violet','resonance','entropy','gravity','velocity','photon','orbit',
    'couplet','sestina','iamb','trochee','anaphora','imagery','meter','cadence','ink','stanza',
    'bhagavad','kaurava','partha','shakuni','svadharma','austerity','lotus','prayer','horizon','ritual',
    'dendrite','axon','soma','myelin','glutamate','dopamine','cortex','hippocampus','resting','threshold',
    'stack','heap','cache','compiler','pointer','byte','kernel','thread','parser','interpreter',
    'indigo','static','thunder','tide','echo','quartz','velvet','mist','fracture','whisper',
    'kuruk','ganga','samudra','vayu','agni','prana','dharma','karma','marga','seva',
    'cadence','tempo','attack','decay','sustain','release','pulse','breath','pause','stillness'
  ];

  // ----------------------------------------------------------- nodes

  var nodes = [];
  var drizzle = [];
  var lanes = {};            // chain -> { x, fired }
  var W, H, DPR;
  var W2, H2, glowCanvas, gctx;
  var now = 0, frame = 0;
  var state = 'idle';
  var promptNode = null;
  var edges = [];
  var litEdges = [];
  var t0 = 0;
  var answerAt = 0;
  var settleStart = 0;

  var motes = [];
  var filaments = [];
  var firedList = [];

  function linkCP(a, b) {
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var amt = Math.min(len * 0.16, 34);
    var side = (a.x + b.y > W / 2) ? 1 : -1;
    return { x: mx + (-dy / len) * amt * side, y: my + (dx / len) * amt * side };
  }

  function bezierAt(a, cp, b, t) {
    var it = 1 - t;
    return {
      x: it * it * a.x + 2 * it * t * cp.x + t * t * b.x,
      y: it * it * a.y + 2 * it * t * cp.y + t * t * b.y
    };
  }

  function strokeLink(a, cp, b, color, width, c) {
    c = c || ctx;
    c.beginPath();
    c.moveTo(a.x, a.y);
    c.quadraticCurveTo(cp.x, cp.y, b.x, b.y);
    c.lineWidth = width;
    c.strokeStyle = color;
    c.stroke();
    c.strokeStyle = null;
  }

  function lerpColor(alpha) {
    return 'rgba(255,166,201,' + alpha.toFixed(3) + ')';
  }

  // ----------------------------------------------------------- layout

  function laneCenters() {
    var margin = 34;
    var laneW = (W - margin * 2) / CHAIN_KEYS.length;
    var out = {};
    for (var i = 0; i < CHAIN_KEYS.length; i++) {
      out[CHAIN_KEYS[i]] = { x: margin + laneW * (i + 0.5), w: laneW };
    }
    return out;
  }

  function buildNodes() {
    nodes = [];
    lanes = laneCenters();
    var rects = [];

    for (var c = 0; c < CHAIN_KEYS.length; c++) {
      var chain = CHAIN_KEYS[c];
      var facts = CHAINS[chain].facts;
      var lx = lanes[chain].x;
      var lw = lanes[chain].w;

      for (var f = 0; f < facts.length; f++) {
        var text = facts[f][0];
        var hop = facts[f][1];
        var node = {
          text: text, chain: chain, hop: hop,
          x: 0, y: 0, w: 0, h: 0,
          fired: false, flashT: 0, drain: 0,
          charge: 0,
          trem: rand(0, Math.PI * 2),
          glowph: rand(0, Math.PI * 2),
          sparkT: rand(800, 6000),
          sparkF: 0
        };
        ctx.font = '12px "CMU Sans Serif", sans-serif';
        node.w = Math.min(340, ctx.measureText(text).width + 26);
        node.h = 26;

        // three rows per hop, staggered across the lane
        var rowY, rowX;
        if (hop === 1) {
          rowY = 0.30 + 0.085 * f;
          rowX = [-0.30, 0, 0.30][f] * lw * 0.85;
        } else if (hop === 2) {
          rowY = 0.545 + 0.08 * (f - 3);
          rowX = [-0.30, 0, 0.30][f - 3] * lw * 0.85;
        } else {
          rowY = 0.78;
          rowX = 0;
        }
        var px = clamp(lx + rowX, node.w / 2 + 10, W - node.w / 2 - 10);
        var py = clamp(rowY * H, node.h / 2 + 60, H - node.h / 2 - 56);

        // safety: nudge away from anything too close
        var tries = 0;
        var collides = true;
        while (collides && tries < 400) {
          collides = false;
          for (var q = 0; q < rects.length; q++) {
            var rr = rects[q];
            if (Math.abs(px - rr.x) < (node.w + rr.w) / 2 + 14 &&
                Math.abs(py - rr.y) < (node.h + rr.h) / 2 + 8) {
              collides = true;
              py += 8;
              tries++;
              if (tries % 40 === 0) { px += (Math.random() - 0.5) * 20; py = rowY * H; }
              break;
            }
          }
        }
        node.x = px; node.y = py;
        rects.push({ x: px, y: py, w: node.w, h: node.h });
        nodes.push(node);
      }
    }

    buildFilaments();
    buildDrizzle();
  }

  function buildDrizzle() {
    drizzle = [];
    var col = 0;
    for (var y = 0.20; y <= 0.88; y += 0.045) {
      for (var x = 40; x <= W - 40; x += 72) {
        if (col % 3 === 0) {
          var w = DRIZZLE[Math.floor(Math.random() * DRIZZLE.length)];
          drizzle.push({
            t: w,
            x: x + rand(-9, 9),
            y: y * H + rand(-5, 5),
            size: rand(9, 11.5),
            op: rand(0.09, 0.16),
            ph: rand(0, Math.PI * 2),
            dp: rand(0, Math.PI * 2)
          });
        }
        col++;
      }
    }
  }

  function buildFilaments() {
    filaments = [];
    var seen = {};
    for (var i = 0; i < nodes.length; i++) {
      var a = nodes[i];
      var near = nodes.map(function (n, idx) {
        return { n: n, d: dist(a.x, a.y, n.x, n.y), idx: idx };
      }).filter(function (o) { return o.idx !== i; })
        .sort(function (p, q) { return p.d - q.d; }).slice(0, 2);
      for (var j = 0; j < near.length; j++) {
        var keyi = Math.min(i, near[j].idx), keyj = Math.max(i, near[j].idx);
        var key = keyi + '_' + keyj;
        if (seen[key]) continue;
        seen[key] = true;
        filaments.push({ a: a, b: near[j].n, cp: linkCP(a, near[j].n) });
      }
    }
  }

  function buildMotes() {
    motes = [];
    for (var i = 0; i < 44; i++) {
      motes.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(0.6, 1.9),
        ph: rand(0, Math.PI * 2),
        vx: rand(-0.09, 0.09),
        vy: rand(-0.07, 0.07),
        pink: Math.random() < 0.3,
        swirl: rand(-0.006, 0.006)
      });
    }
  }

  function buildGlow() {
    W2 = Math.max(2, Math.round(W / 2));
    H2 = Math.max(2, Math.round(H / 2));
    if (!glowCanvas) glowCanvas = document.createElement('canvas');
    glowCanvas.width = W2;
    glowCanvas.height = H2;
    gctx = glowCanvas.getContext('2d');
  }

  function gauss() {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ----------------------------------------------------------- submit

  function detect(text) {
    var t = ' ' + text.toLowerCase() + ' ';
    for (var c = 0; c < CHAIN_KEYS.length; c++) {
      var kws = CHAINS[CHAIN_KEYS[c]].keywords;
      for (var j = 0; j < kws.length; j++) {
        if (t.indexOf(kws[j]) >= 0) return CHAIN_KEYS[c];
      }
    }
    return null;
  }

  function nodeByChain(chain, i) {
    var res = [];
    for (var j = 0; j < nodes.length; j++) {
      if (nodes[j].chain === chain) res.push(nodes[j]);
    }
    return res[i];
  }

  function mkPromptNode(text) {
    var n = { text: text, x: W / 2, y: H * 0.185, w: 0, h: 22, fired: true, flashT: 1, drain: 0, charge: 1.4, trem: 0, glowph: 0, sparkT: 0, sparkF: 0 };
    ctx.font = '700 13px "CMU Sans Serif", sans-serif';
    n.w = Math.min(520, ctx.measureText(text).width + 32);
    return n;
  }

  function runChain(chain, text) {
    var H1 = [0, 1, 2].map(function (i) { return nodeByChain(chain, i); });
    var hop2Pool = [3, 4, 5].slice().sort(function () { return Math.random() - 0.5; }).slice(0, 2);
    var H2 = hop2Pool.map(function (i) { return nodeByChain(chain, i); });
    var H3 = nodeByChain(chain, 6);
    var h1Order = [0, 1, 2].slice().sort(function () { return Math.random() - 0.5; });
    var srcFor = {};                        // hop2 node -> its hop1 source
    for (var k = 0; k < H2.length; k++) srcFor[H2[k].chain + ':' + H2[k].hop + ':' + H2[k].text] = H1[h1Order[k]];

    promptNode = mkPromptNode(text);
    edges = []; litEdges = [];

    for (var i = 0; i < 3; i++) {
      edges.push({ a: promptNode, b: H1[i], cp: linkCP(promptNode, H1[i]), start: t0 + 240 + i * 150, dur: PULSE_DUR, fire: true });
    }
    var t1 = t0 + 240 + 2 * 150 + PULSE_DUR + 500;
    var h2done = t1;
    for (var k2 = 0; k2 < H2.length; k2++) {
      var src = srcFor[H2[k2].chain + ':' + H2[k2].hop + ':' + H2[k2].text];
      edges.push({ a: src, b: H2[k2], cp: linkCP(src, H2[k2]), start: t1 + k2 * 150, dur: PULSE_DUR, fire: true });
      h2done = t1 + k2 * 150 + PULSE_DUR;
    }
    var t2 = h2done + 500;
    for (var h = 0; h < H2.length; h++) {
      edges.push({ a: H2[h], b: H3, cp: linkCP(H2[h], H3), start: t2 + h * 120, dur: PULSE_DUR, fire: true });
    }
    var t3 = t2 + (H2.length - 1) * 120 + PULSE_DUR;

    replyEl.textContent = CHAINS[chain].responses[Math.floor(Math.random() * CHAINS[chain].responses.length)];
    setTimeout(function () {
      answerAt = performance.now();
      state = 'answered';
      setTimeout(function () { document.querySelector('.reply').classList.add('show'); }, 200);
    }, (t3 - t0));
  }

  function runFallback(text) {
    promptNode = mkPromptNode(text);
    promptNode.fired = false;
    promptNode.charge = 0.6;

    edges = []; litEdges = [];
    var fizz = [];
    for (var i = 0; i < 6; i++) {
      var n = nodes[Math.floor(Math.random() * nodes.length)];
      if (fizz.indexOf(n) < 0) fizz.push(n);
    }
    for (var j = 0; j < fizz.length; j++) {
      edges.push({ a: promptNode, b: fizz[j], cp: linkCP(promptNode, fizz[j]), start: t0 + 300 + j * 220, dur: PULSE_DUR * 0.9, fire: false });
    }
    var lastEnd = t0 + 300 + (fizz.length - 1) * 220 + PULSE_DUR * 0.9;
    replyEl.textContent = FALLBACK.responses[Math.floor(Math.random() * FALLBACK.responses.length)];
    setTimeout(function () {
      answerAt = performance.now();
      state = 'answered';
      setTimeout(function () { document.querySelector('.reply').classList.add('show'); }, 200);
    }, (lastEnd - t0));
  }

  function run() {
    if (state !== 'idle') return;
    var text = inputEl.value.trim();
    if (!text) return;
    setBox(true);
    document.querySelector('.reply').classList.remove('show');
    for (var i = 0; i < nodes.length; i++) { nodes[i].fired = false; nodes[i].flashT = 0; nodes[i].drain = 0; nodes[i].charge = 0; }
    for (var lc in lanes) lanes[lc].fired = false;
    var chain = detect(text);
    t0 = performance.now();
    if (chain) {
      runChain(chain, text);
      if (lanes[chain]) lanes[chain].fired = true;
    } else {
      runFallback(text);
    }
    inputEl.value = '';
    state = 'running';
  }

  // ----------------------------------------------------------- update

  function update() {
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      n.charge *= 0.972;
      if (n.sparkF > 0) n.sparkF -= 0.025;
      if (n.sparkT > 0) {
        n.sparkT -= 16.7;
        if (n.sparkT <= 0) {
          n.sparkT = rand(2600, 7200);
          if (n.sparkF <= 0) n.sparkF = 1;
        }
      }
    }
    if (promptNode) promptNode.charge *= 0.992;
    for (var e = 0; e < litEdges.length; e++) {
      litEdges[e].energy = Math.max((litEdges[e].energy || 1) - 0.0022, litEdges[e].fire ? 0.4 : 0.1);
    }

    if (state === 'running') updateEdges();
    else if (state === 'answered') {
      if (now - answerAt > 4000) {
        state = 'settling';
        settleStart = now;
        document.querySelector('.reply').classList.remove('show');
        for (var j = 0; j < nodes.length; j++) nodes[j].drain = 1;
        if (promptNode) promptNode.drain = 1;
        for (var l2 in lanes) lanes[l2].fired = false;
      }
    } else if (state === 'settling') {
      var done = true;
      var decay = (now - settleStart) / 900;
      for (var k = 0; k < nodes.length; k++) {
        if (nodes[k].drain > 0) {
          nodes[k].drain = Math.max(0, 1 - decay);
          if (nodes[k].drain !== 0) done = false;
        }
      }
      if (done) {
        state = 'idle';
        nodes.forEach(function (nd) { nd.fired = false; nd.drain = 0; nd.flashT = 0; nd.charge = 0; });
        promptNode = null; edges = []; litEdges = [];
        setBox(false);
      }
    }
  }

  function updateEdges() {
    for (var k = edges.length - 1; k >= 0; k--) {
      var e = edges[k];
      if (now >= e.start + e.dur) {
        if (e.fire) {
          if (!e.b.fired) { e.b.fired = true; e.b.flashT = 1; e.b.sparkF = 0; }
          e.b.charge = Math.min(2.4, e.b.charge + 1.5);
        }
        litEdges.push({ a: e.a, b: e.b, cp: e.cp, fire: e.fire, energy: 1 });
        edges.splice(k, 1);
      }
    }
  }

  // ----------------------------------------------------------- draw

  function roundRect(x, y, w, h, r) {
    r = r || h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var breath = now * 0.0012;

    for (var di = 0; di < nodes.length; di++) if (nodes[di].flashT > 0) nodes[di].flashT -= 0.035;
    if (promptNode && promptNode.flashT > 0) promptNode.flashT -= 0.035;

    // live positions
    firedList.length = 0;
    for (var qi = 0; qi < nodes.length; qi++) {
      var qn = nodes[qi];
      var ampv = qn.fired ? 1.5 : 0.6;
      qn.qx = qn.x + Math.sin(frame * 0.005 + qn.trem) * ampv;
      qn.qy = qn.y + Math.cos(frame * 0.006 + qn.trem * 1.7) * ampv;
      if (qn.fired) firedList.push(qn);
    }
    if (promptNode) { promptNode.qx = promptNode.x + Math.sin(breath * 1.3) * 3; promptNode.qy = promptNode.y + Math.cos(breath * 0.9) * 3; }

    var dmax = 0;
    for (var d = 0; d < nodes.length; d++) if (nodes[d].drain > dmax) dmax = nodes[d].drain;
    var drainAll = 1 - dmax * 0.92;

    // ---- background wash + breathing core
    var throb = 0.5 + 0.5 * Math.sin(breath);
    var bg = ctx.createRadialGradient(W / 2, H * 0.62, 0, W / 2, H * 0.62, H * 0.95);
    bg.addColorStop(0, lerpColor(0.011 + 0.016 * throb));
    bg.addColorStop(0.6, lerpColor(0.004 + 0.003 * throb));
    bg.addColorStop(1, 'rgba(255,166,201,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ---- drizzle: the vast faint field of everything it has absorbed
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var z = 0; z < drizzle.length; z++) {
      var dzz = drizzle[z];
      var dzx = dzz.x + Math.sin(frame * 0.003 + dzz.dp) * 2;
      var dzy = dzz.y + Math.cos(frame * 0.0025 + dzz.dp * 1.4) * 2;
      ctx.font = dzz.size + 'px "CMU Typewriter Text", monospace';
      ctx.fillStyle = 'rgba(228,228,234,' + (dzz.op * (0.7 + 0.3 * Math.sin(now * 0.001 + dzz.ph))).toFixed(3) + ')';
      ctx.fillText(dzz.t, dzx, dzy);
    }

    // ---- energy layer
    gctx.setTransform(W2 / W, 0, 0, H2 / H, 0, 0);
    gctx.clearRect(0, 0, W, H);
    gctx.lineCap = 'round';

    for (var le = 0; le < litEdges.length; le++) {
      var le2 = litEdges[le];
      var en = le2.energy * drainAll * (le2.b.fired ? 1 : 0.25);
      strokeLink(le2.a, le2.cp, le2.b, lerpColor(0.45 * en), 3 + 7 * en, gctx);
    }
    for (var pe = 0; pe < edges.length; pe++) {
      var e2 = edges[pe];
      if (now < e2.start) continue;
      var pr2 = Math.min(1.06, (now - e2.start) / e2.dur);
      var pos2 = bezierAt(e2.a, e2.cp, e2.b, pr2);
      var amp2 = e2.fire ? 1 : 0.3;
      var gg = gctx.createRadialGradient(pos2.x, pos2.y, 0, pos2.x, pos2.y, 13);
      gg.addColorStop(0, lerpColor(0.85 * amp2 * drainAll));
      gg.addColorStop(1, 'rgba(255,166,201,0)');
      gctx.fillStyle = gg;
      gctx.beginPath();
      gctx.arc(pos2.x, pos2.y, 13, 0, Math.PI * 2);
      gctx.fill();
    }
    for (var ne = 0; ne < nodes.length; ne++) {
      var nd = nodes[ne];
      if (!nd.fired) continue;
      var ch = Math.min(1, nd.charge) * ndrain(nd);
      if (ch > 0.03) {
        var rg = gctx.createRadialGradient(nd.qx, nd.qy, 0, nd.qx, nd.qy, 12 + 20 * ch);
        rg.addColorStop(0, lerpColor(0.4 * ch + Math.min(1, nd.flashT) * 0.3));
        rg.addColorStop(1, 'rgba(255,166,201,0)');
        gctx.fillStyle = rg;
        gctx.beginPath();
        gctx.arc(nd.qx, nd.qy, 12 + 20 * ch, 0, Math.PI * 2);
        gctx.fill();
      }
    }
    if (promptNode) {
      var pnp = promptNode;
      var ppd = pnp.drain > 0 ? (1 - pnp.drain) : 1;
      var pg = gctx.createRadialGradient(pnp.qx, pnp.qy, 0, pnp.qx, pnp.qy, 34);
      pg.addColorStop(0, lerpColor(0.4 * ppd));
      pg.addColorStop(1, 'rgba(255,166,201,0)');
      gctx.fillStyle = pg;
      gctx.beginPath();
      gctx.arc(pnp.qx, pnp.qy, 34, 0, Math.PI * 2);
      gctx.fill();
    }

    // bloom
    ctx.filter = 'blur(2.5px)';
    ctx.globalAlpha = 0.5;
    ctx.drawImage(glowCanvas, 0, 0, W, H);
    ctx.filter = 'blur(9px)';
    ctx.globalAlpha = 0.4;
    ctx.drawImage(glowCanvas, 0, 0, W, H);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;

    // ---- motes
    for (var m = 0; m < motes.length; m++) {
      var mo = motes[m];
      var sc = Math.cos(mo.swirl), ss = Math.sin(mo.swirl);
      var nvx = mo.vx * sc - mo.vy * ss;
      mo.vy = mo.vx * ss + mo.vy * sc;
      mo.vx = nvx;
      if (firedList.length) {
        var nrst = nearestOf(firedList, mo.x, mo.y);
        var pdx = nrst.qx - mo.x, pdy = nrst.qy - mo.y;
        var dl = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
        var pull = 2600 / (dl * dl + 5000);
        mo.vx += (pdx / dl) * pull * 0.5;
        mo.vy += (pdy / dl) * pull * 0.5;
      }
      mo.x += mo.vx; mo.y += mo.vy;
      if (mo.x < -4) mo.x = W + 4; else if (mo.x > W + 4) mo.x = -4;
      if (mo.y < -4) mo.y = H + 4; else if (mo.y > H + 4) mo.y = -4;
      var tw = 0.5 + 0.5 * Math.sin(now * 0.001 + mo.ph);
      ctx.globalAlpha = 0.035 + 0.05 * tw;
      ctx.fillStyle = mo.pink ? ACCENT : GREY;
      ctx.beginPath();
      ctx.arc(mo.x, mo.y, mo.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- filaments (fine, faint)
    for (var f = 0; f < filaments.length; f++) {
      var fi = filaments[f];
      var endFired = fi.a.fired || fi.b.fired;
      var base = endFired
        ? (0.09 + 0.05 * (0.5 + 0.5 * Math.sin(now * 0.004 + f))) * drainAll
        : (0.016 + 0.010 * (0.5 + 0.5 * Math.sin(breath * 2 + f * 0.8)));
      strokeLink(fi.a, fi.cp, fi.b, lerpColor(base), 0.7);
    }

    // ---- crisp core lines
    for (var l2 = 0; l2 < litEdges.length; l2++) {
      var le3 = litEdges[l2];
      var lp = le3.energy * 0.9 * drainAll * (le3.b.fired ? 1 : 0.25);
      strokeLink(le3.a, le3.cp, le3.b, lerpColor(lp), 1.0);
    }

    // crisp pulse heads
    for (var ph = 0; ph < edges.length; ph++) {
      var e3 = edges[ph];
      if (now < e3.start) continue;
      var pr3 = Math.min(1.06, (now - e3.start) / e3.dur);
      var pos3 = bezierAt(e3.a, e3.cp, e3.b, pr3);
      ctx.fillStyle = ACCENT;
      ctx.globalAlpha = (e3.fire ? 1 : 0.4) * drainAll;
      ctx.beginPath();
      ctx.arc(pos3.x, pos3.y, e3.fire ? 2.4 : 1.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ---- lane labels
    ctx.font = '500 8px "CMU Sans Serif", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var c2 = 0; c2 < CHAIN_KEYS.length; c2++) {
      var lk = CHAIN_KEYS[c2];
      var lc = lanes[lk];
      var la = lanes[lk].fired ? (0.5 + 0.2 * Math.sin(now * 0.005)) : 0.16;
      ctx.fillStyle = lerpColor(la);
      ctx.fillText(CHAINS[lk].label.toUpperCase(), lc.x, H * 0.255);
    }

    // ---- nodes
    ctx.font = '12px "CMU Sans Serif", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var n2 = 0; n2 < nodes.length; n2++) {
      var nd2 = nodes[n2];
      var ndr = ndrain(nd2);
      var ch2 = Math.min(1, nd2.charge);

      if (nd2.fired) {
        var ripple = nd2.flashT;
        if (ripple > 0) {
          ctx.strokeStyle = lerpColor(ripple * 0.55 * ndr);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(nd2.qx, nd2.qy, (1 - ripple) * 30, 0, Math.PI * 2);
          ctx.stroke();
        }
        var breathScale = 1 + 0.06 * ch2 * (0.5 + 0.5 * Math.sin(now * 0.005 + nd2.glowph));
        ctx.save();
        ctx.translate(nd2.qx, nd2.qy);
        ctx.scale(breathScale, breathScale);
        ctx.fillStyle = 'rgba(10,10,15,0.92)';
        roundRect(-nd2.w / 2, -nd2.h / 2, nd2.w, nd2.h, nd2.h / 2);
        ctx.fill();
        ctx.strokeStyle = lerpColor((0.5 + 0.35 * ch2) * ndr);
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.font = '12px "CMU Sans Serif", sans-serif';
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = ndr * (0.65 + 0.35 * ch2);
        ctx.fillText(nd2.text, 0, 0);
        ctx.restore();
        ctx.globalAlpha = 1;
      } else {
        var rest = 0.5 + 0.5 * Math.sin(now * 0.002 + nd2.glowph);
        var spark = nd2.sparkF > 0 ? nd2.sparkF : 0;
        ctx.fillStyle = 'rgba(10,10,15,0.9)';
        roundRect(nd2.qx - nd2.w / 2, nd2.qy - nd2.h / 2, nd2.w, nd2.h, nd2.h / 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(228,228,234,' + (0.07 + rest * 0.02 + spark * 0.12).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.font = '12px "CMU Sans Serif", sans-serif';
        ctx.fillStyle = 'rgba(228,228,234,' + (0.30 + rest * 0.06 + spark * 0.4).toFixed(3) + ')';
        ctx.fillText(nd2.text, nd2.qx, nd2.qy);
      }
    }

    // prompt pill
    if (promptNode) {
      var pn = promptNode;
      var pdd = pn.drain > 0 ? (1 - pn.drain) : 1;
      ctx.save();
      ctx.translate(pn.qx, pn.qy);
      ctx.fillStyle = 'rgba(10,10,15,0.94)';
      roundRect(-pn.w / 2, -pn.h / 2, pn.w, pn.h, pn.h / 2);
      ctx.fill();
      ctx.strokeStyle = lerpColor(0.8 * pdd);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.font = '700 13px "CMU Sans Serif", sans-serif';
      ctx.fillStyle = ACCENT;
      ctx.globalAlpha = pdd;
      ctx.fillText(pn.text, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function ndrain(n) {
    return n.drain > 0 ? (1 - n.drain) : 1;
  }

  function nearestOf(list, x, y) {
    var best = list[0], bd = Infinity;
    for (var i = 0; i < list.length; i++) {
      var d = dist(list[i].qx, list[i].qy, x, y);
      if (d < bd) { bd = d; best = list[i]; }
    }
    return best;
  }

  // ----------------------------------------------------------- boot

  function setBox(off) {
    inputEl.disabled = off;
    submitEl.disabled = off;
    if (off) inputEl.blur();
  }

  submitEl.addEventListener('click', function () { run(); inputEl.focus(); });
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { run(); inputEl.focus(); } });

  function tick(ts) {
    now = ts; frame = ts;
    update();
    draw();
    requestAnimationFrame(tick);
  }

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildGlow();
    buildNodes();
    buildMotes();
    state = 'idle'; edges = []; litEdges = []; promptNode = null; firedList = [];
    document.querySelector('.reply').classList.remove('show');
    setBox(false);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);

  // web fonts arrive async — rebuild layout once they're ready so
  // canvas measurements use the real metrics (important when deployed)
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { resize(); });
  }

  // helpers
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist(x1, y1, x2, y2) { var dx = x1 - x2, dy = y1 - y2; return Math.sqrt(dx * dx + dy * dy); }
})();
</script>
</body>
</html>
