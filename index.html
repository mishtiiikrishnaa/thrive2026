<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ask anything</title>
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.cdnfonts.com/css/cmu-serif" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/cmu-sans-serif" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/cmu-typewriter-text" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #e9e9ee;
    --dim: #40404a;
    --faint: #565662;
    --accent: #ffa6c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  body {
    font-family: "CMU Sans Serif", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }

  .scene { position: relative; height: 100vh; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* the single centred column: question, keywords, facts, connections */
  .col {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: 46%; width: min(92vw, 680px); text-align: center;
    transition: top 0.95s cubic-bezier(0.22, 0.9, 0.24, 1);
    z-index: 3;
  }
  .col.raised { top: 5.5%; }

  .askline { display: flex; justify-content: center; gap: 10px; }
  .askline input {
    flex: 0 1 480px;
    font-size: 17px; letter-spacing: 0.02em; color: var(--ink);
    background: rgba(18,18,28,0.72);
    border: 1px solid var(--dim); border-radius: 999px;
    padding: 15px 26px; outline: none;
    transition: border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
  }
  .askline input::placeholder { color: var(--faint); font-style: italic; }
  .askline input:focus {
    border-color: rgba(255,166,201,0.55);
    box-shadow: 0 0 0 1px rgba(255,166,201,0.22), 0 0 34px rgba(255,166,201,0.12);
  }
  .askline input:disabled { opacity: 0.5; }
  .askline button {
    font-size: 14px; letter-spacing: 0.06em; color: var(--ink);
    background: rgba(255,166,201,0.12);
    border: 1px solid rgba(255,166,201,0.4); border-radius: 999px;
    padding: 0 28px; cursor: pointer; outline: none;
    transition: background 0.3s ease, opacity 0.4s ease;
  }
  .askline button:hover:not([disabled]) { background: rgba(255,166,201,0.24); }
  .askline button[disabled] { opacity: 0.35; cursor: default; }

  .zone {
    opacity: 0; max-height: 0; overflow: hidden;
    transition: opacity 0.7s ease, max-height 0.8s ease, margin-top 0.8s ease;
  }
  .zone.on { opacity: 1; max-height: 600px; margin-top: 30px; }

  .ztag, .atag {
    display: block; font-family: "CMU Typewriter Text", monospace;
    font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 12px;
    transition: color 0.5s ease, text-shadow 0.5s ease;
  }
  .ztag.hot, .atag.hot { color: var(--accent); text-shadow: 0 0 14px rgba(255,166,201,0.4); }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chip {
    font-size: 12px; letter-spacing: 0.04em; color: var(--accent);
    background: rgba(255,166,201,0.07);
    border: 1px solid rgba(255,166,201,0.32); border-radius: 999px;
    padding: 6px 14px;
  }

  .flist { text-align: left; }
  .fkg {
    display: flex; align-items: baseline; gap: 12px; padding: 5px 2px;
    opacity: 0; transition: opacity 0.7s ease;
  }
  .fkg .fdot {
    flex: 0 0 auto;
    width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid rgba(255,166,201,0.7);
    color: var(--accent);
    font-family: "CMU Sans Serif", sans-serif;
    font-size: 8.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    transform: translateY(2px);
  }
  .fkg .fk {
    flex: 0 0 84px; text-align: right;
    font-family: "CMU Typewriter Text", monospace; font-size: 10px;
    letter-spacing: 0.08em; text-transform: lowercase; color: var(--accent);
    opacity: 0.9;
  }
  .fkg .fl {
    font-family: "CMU Serif", Georgia, serif; font-size: 14.5px;
    color: rgba(233,233,238,0.9); letter-spacing: 0.01em; line-height: 1.5;
  }
  .fkg .fl .hl { color: var(--accent); }

  .clist { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .clink {
    font-family: "CMU Typewriter Text", monospace; font-size: 11px;
    letter-spacing: 0.14em; color: var(--accent);
    background: rgba(255,166,201,0.06);
    border: 1px solid rgba(255,166,201,0.22); border-radius: 999px;
    padding: 7px 14px;
    opacity: 0; transform: translateY(4px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .clink.on { opacity: 1; transform: translateY(0); }

  /* the final block of text, in-flow under the prompt */
  .answer {
    margin-top: 34px;
    opacity: 0; transition: opacity 1.1s ease;
    pointer-events: none; user-select: none;
    text-align: left;
  }
  .answer.show { opacity: 1; }
  .answer .ans {
    font-family: "CMU Serif", Georgia, serif;
    font-size: 16.5px; line-height: 1.85;
    color: rgba(233,233,238,0.95);
    letter-spacing: 0.01em;
    text-shadow: 0 0 18px rgba(255,166,201,0.12);
    white-space: pre-wrap;
  }
</style>
</head>
<body>

  <div class="scene">
    <canvas id="stage"></canvas>

    <div class="col" id="col">
      <div class="askline">
        <input id="input" type="text" placeholder="ask anything…" autocomplete="off" spellcheck="false">
        <button id="submit">ask</button>
      </div>

      <div class="zone" id="kwzone">
        <span class="ztag" id="kwtag">keywords</span>
        <div class="chips" id="chips"></div>
      </div>

      <div class="zone" id="factzone">
        <span class="ztag" id="facttag">the facts each keyword holds</span>
        <div class="flist" id="flist"></div>
      </div>

      <div class="zone" id="connzone">
        <span class="ztag" id="conntag">connections</span>
        <div class="clist" id="clist"></div>
      </div>

      <div class="answer" id="answerzone">
        <p class="ans" id="ans"></p>
      </div>
    </div>
  </div>

  var STOP = {};

  // ------------------------------------------------------- state

  // ------------------------------------------------------- helpers

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist(x1, y1, x2, y2) { var dx = x1 - x2, dy = y1 - y2; return Math.sqrt(dx * dx + dy * dy); }
  function lerpColor(a) { return 'rgba(255,166,201,' + a.toFixed(3) + ')'; }

  function pathCum(path) {
    var cum = [0];
    for (var i = 1; i < path.length; i++) {
      cum.push(cum[i - 1] + dist(path[i][0], path[i][1], path[i - 1][0], path[i - 1][1]));
    }
    return cum;
  }

  function pointAt(path, cum, d) {
    var lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (cum[mid] <= d) lo = mid; else hi = mid;
    }
    var a = path[lo], b = path[Math.min(hi, path.length - 1)];
    var seg = cum[hi] - cum[lo] || 0.0001;
    var t = clamp((d - cum[lo]) / seg, 0, 1);
    return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t };
  }

  function catmull(p0, p1, p2, p3, t) {
    var t2 = t * t, t3 = t2 * t;
    return {
      x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
      y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
    };
  }

  function smooth(pts) {
    if (pts.length < 3) return pts;
    var out = [pts[0]];
    for (var i = 1; i < pts.length - 2; i++) {
      var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2];
      for (var s = 1; s <= 5; s++) {
        var p = catmull(p0, p1, p2, p3, s / 5);
        out.push([p.x, p.y]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  // ------------------------------------------------------- growth

  function addBouton(x, y, owner) {
    boutons.push({ x: x, y: y, owner: owner || null, ph: rand(0, Math.PI * 2), flare: 0 });
  }

  function growArbor(sx, sy) {
    var out = [];
    var n = 3;
    for (var b = 0; b < n; b++) {
      var ang = rand(0, Math.PI * 2);
      var ctrl = [[sx, sy]];
      var len = rand(46, 82);
      for (var i = 1; i <= 4; i++) {
        ang += rand(-0.35, 0.35);
        ctrl.push([sx + Math.cos(ang) * len * i / 4, sy + Math.sin(ang) * len * i / 4]);
      }
      var branch = smooth(ctrl);
      out.push(branch);
      var tip = branch[branch.length - 1];
      addBouton(tip[0], tip[1], null);
      if (Math.random() < 0.6) {
        var k0 = Math.max(1, branch.length - 4);
        var base = branch[k0];
        var twAng = Math.atan2(tip[1] - base[1], tip[0] - base[0]) + rand(-0.9, 0.9);
        var twig = [base];
        for (var t2 = 1; t2 <= 2; t2++) {
          twAng += rand(-0.4, 0.4);
          twig.push([base[0] + Math.cos(twAng) * 9 * t2, base[1] + Math.sin(twAng) * 9 * t2]);
        }
        var tpath = smooth(twig);
        out.push(tpath);
        var tt = tpath[tpath.length - 1];
        addBouton(tt[0], tt[1], null);
      }
    }
    return out;
  }

  function growCablePath(sx, sy, tx, ty) {
    var mx = (sx + tx) / 2, my = (sy + ty) / 2;
    var dx = tx - sx, dy = ty - sy;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var px = -dy / len, py = dx / len;
    var sag = Math.min(len * 0.13, 46) * rand(0.7, 1.3);
    var c1 = { x: mx - px * sag - dx * 0.15, y: my - py * sag - dy * 0.15 };
    var c2 = { x: mx + px * sag * 0.55 + dx * 0.12, y: my + py * sag * 0.55 + dy * 0.12 };
    return smooth([[sx, sy], [c1.x, c1.y], [c2.x, c2.y], [tx, ty]]);
  }

  function growArcPath() {
    var x0 = rand(W * 0.06, W * 0.5), y0 = rand(H * 0.24, H * 0.6);
    var x1 = rand(W * 0.55, W * 0.94), y1 = rand(H * 0.24, H * 0.66);
    var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var px = -dy / len, py = dx / len;
    var sag = len * rand(0.12, 0.2);
    var c = { x: mx + px * sag, y: my + py * sag };
    return smooth([[x0, y0], [c.x, c.y], [x1, y1]]);
  }

  // ------------------------------------------------------- layout

  function buildLayout() {
    cells = [];
    boutons = [];
    var zx0 = W * 0.10, zx1 = W * 0.90, zy0 = H * 0.22, zy1 = H * 0.72;

    for (var c = 0; c < CHAIN_KEYS.length; c++) {
      var key = CHAIN_KEYS[c];
      var def = CHAINS[key];
      var ax = (def.anchor[0] + rand(-0.012, 0.012)) * W;
      var ay = (def.anchor[1] + rand(-0.012, 0.012)) * H;
      var pts = [];

      for (var f = 0; f < def.facts.length; f++) {
        var fact = def.facts[f];
        var ring = fact[1] === 1 ? rand(42, 74) : fact[1] === 2 ? rand(70, 110) : rand(100, 140);
        var a2 = rand(0, Math.PI * 2);
        var n = {
          text: fact[0], ch: key, ho: fact[1], k: fact[2],
          fired: false, litIdx: 0, flashT: 0, drain: 0, charge: 0,
          trem: rand(0, Math.PI * 2), glowph: rand(0, Math.PI * 2),
          sparkT: rand(800, 7000), sparkF: 0,
          x: clamp(ax + Math.cos(a2) * ring, zx0 + 12, zx1 - 12),
          y: clamp(ay + Math.sin(a2) * ring, zy0, zy1)
        };
        n.w = 34; n.h = 22;
        n.qx = n.x; n.qy = n.y;
        pts.push(n);
      }

      for (var it = 0; it < 24; it++) {
        for (var i = 0; i < pts.length; i++) {
          for (var j = i + 1; j < pts.length; j++) {
            var a = pts[i], b = pts[j];
            var dx = b.x - a.x, dy = b.y - a.y;
            var d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
            if (d < 12) {
              var push = (12 - d) / 2;
              a.x -= (dx / d) * push; a.y -= (dy / d) * push;
              b.x += (dx / d) * push; b.y += (dy / d) * push;
              a.x = clamp(a.x, zx0 + 10, zx1 - 10);
              a.y = clamp(a.y, zy0, zy1);
              b.x = clamp(b.x, zx0 + 10, zx1 - 10);
              b.y = clamp(b.y, zy0, zy1);
            }
          }
        }
      }

      for (var k = 0; k < pts.length; k++) {
        pts[k].arbors = growArbor(pts[k].x, pts[k].y);
      }

      var cx = 0, cy = 0;
      for (var m = 0; m < pts.length; m++) { cx += pts[m].x; cy += pts[m].y; }
      chainMeta[key] = { x: cx / pts.length, y: cy / pts.length, r: 150 };
      cells = cells.concat(pts);
    }
  }

  function buildNerveNet() {
    cables = [];
    threads = [];
    assocEdges = [];
    edgesBuilt = [];

    for (var c = 0; c < CHAIN_KEYS.length; c++) {
      var key = CHAIN_KEYS[c];
      var h1 = chainCells(key, 1);
      var h2 = chainCells(key, 2);
      var h3 = chainCells(key, 3);
      if (h1.length && h2.length) cables.push(makeCable(h1[0], h2[0]));
      if (h2.length && h3.length) cables.push(makeCable(h2[0], h3[0]));
      if (h2.length > 1 && h3.length) cables.push(makeCable(h2[1 % h2.length], h3[0]));
    }

    var farPairs = 5;
    while (farPairs-- > 0) {
      var a = cells[Math.floor(Math.random() * cells.length)];
      var b = cells[Math.floor(Math.random() * cells.length)];
      if (a === b || a.ch === b.ch) { farPairs++; continue; }
      threads.push({ path: smooth([[a.x, a.y], [rand(minX(), maxX()), rand(minY(), maxY())], [b.x, b.y]]), t0: 0 });
    }

    for (var t = 0; t < 4; t++) {
      var arc = growArcPath();
      var mid = arc[Math.floor(arc.length / 2)];
      addBouton(mid[0], mid[1], null);
      var endp = arc[arc.length - 1];
      addBouton(endp[0], endp[1], null);
      threads.push({ path: arc, t0: 0 });
    }
  }

  function minX() { return W * 0.1; }
  function maxX() { return W * 0.9; }
  function minY() { return H * 0.22; }
  function maxY() { return H * 0.72; }

  function chainCells(key, ho) {
    var out = [];
    for (var i = 0; i < cells.length; i++) {
      if (cells[i].ch === key && cells[i].ho === ho) out.push(cells[i]);
    }
    return out;
  }

  function makeCable(a, b) {
    return { a: a, b: b, path: growCablePath(a.x, a.y, b.x, b.y) };
  }

  function buildDrizzle() {
    drizzle = [];
    var tries = 0;
    while (drizzle.length < 34 && tries < 800) {
      tries++;
      var x = rand(W * 0.06, W * 0.94), y = rand(H * 0.14, H * 0.84);
      var ok = true;
      for (var i = 0; i < cells.length; i++) {
        if (dist(x, y, cells[i].x, cells[i].y) < 30) { ok = false; break; }
      }
      if (!ok) continue;
      drizzle.push({ t: DRIZZLE[Math.floor(Math.random() * DRIZZLE.length)], x: x, y: y, size: rand(8.5, 11), op: rand(0.04, 0.09), ph: rand(0, Math.PI * 2), dp: rand(0, Math.PI * 2) });
    }
  }

  var DRIZZLE = [
    'wavelength', 'gravity', 'entropy', 'photon', 'orbital', 'vapour', 'erosion', 'sediment', 'fathom', 'brine',
    'synapse', 'dendrite', 'myelin', 'glutamate', 'cortex', 'resting', 'iamb', 'sestina', 'anaphora', 'couplet',
    'bhagavad', 'dharma', 'icarus', 'orpheus', 'odysseus', 'piston', 'compiler', 'pointer', 'kernel',
    'lambda', 'quadrant', 'axiom', 'cosine', 'lexicon', 'phoneme', 'syntax', 'guild', 'bazaar',
    'cadence', 'tempo', 'attack', 'decay', 'sustain', 'release', 'breath', 'pause'
  ];

  function buildMotes() {
    motes = [];
    for (var i = 0; i < 30; i++) {
      motes.push({ x: rand(0, W), y: rand(0, H), r: rand(0.6, 1.7), ph: rand(0, Math.PI * 2), vx: rand(-0.08, 0.08), vy: rand(-0.07, 0.07), pink: Math.random() < 0.3, swirl: rand(-0.005, 0.005) });
    }
  }

  function buildTissue() {
    TW = Math.max(2, Math.round(W / 2));
    TH = Math.max(2, Math.round(H / 2));

    tissue.width = TW;
    tissue.height = TH;

  // ------------------------------------------------------- matching

  function tokens(text) {
    var raw = text.toLowerCase().split(/[^a-z\u2019]+/);
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var w = raw[i];
      if (w.length > 4 && /ing$/.test(w)) w = w.slice(0, -3);
      if (w.length > 5 && /ed$/.test(w)) w = w.slice(0, -2);
      if (w.length > 4 && /s$/.test(w)) w = w.slice(0, -1);
      if (!w || w.length < 2 || STOP[w]) continue;
      if (out.indexOf(w) < 0) out.push(w);
    }
    return out;
  }

  function expand(tok) {
    var set = [tok];
    for (var k in SYN) {
      if (k === tok) { set = set.concat(SYN[k]); }
      else if (SYN[k].indexOf(tok) >= 0) { set.push(k); set = set.concat(SYN[k]); }
    }
    return set;
  }

  function scoreFacts(promptText) {
    var toks = tokens(promptText);
    var raw = ' ' + promptText.toLowerCase() + ' ';
    var scores = {};

    for (var c = 0; c < cells.length; c++) {
      var cell = cells[c];
      var s = 0;
      for (var kw = 0; kw < cell.k.length; kw++) {
        var keyword = cell.k[kw];
        if (raw.indexOf(keyword) >= 0) { s += 3; continue; }
        for (var ti = 0; ti < toks.length; ti++) {
          var pool = expand(toks[ti]);
          for (var pi = 0; pi < pool.length; pi++) {
            if (pool[pi] === keyword) { s += 1; break; }
            if (keyword.length >= 4 && pool[pi].indexOf(keyword) >= 0) { s += 0.5; break; }
          }
        }
      }
      if (s > 0) scores[cells.indexOf(cell)] = s;
    }
    return scores;
  }

  function pickChain(scores) {
    var best = null, bestS = 0;
    var byChain = {};
    for (var c = 0; c < CHAIN_KEYS.length; c++) byChain[CHAIN_KEYS[c]] = 0;
    for (var i in scores) {
      var cell = cells[i];
      if (byChain[cell.ch] === undefined) byChain[cell.ch] = 0;
      byChain[cell.ch] += scores[i];
    }
    for (var k = 0; k < CHAIN_KEYS.length; k++) {
      if (byChain[CHAIN_KEYS[k]] > bestS) { bestS = byChain[CHAIN_KEYS[k]]; best = CHAIN_KEYS[k]; }
    }
    return best;
  }

  // one sentence, folded from however many facts the nerves joined
  // (kept as a building block for the generator below)
  function composeSentence(group) {
    var parts = group.slice(0, 4).map(function (f, i) {
      var t = f.text.replace(/[.!?]+$/, '');
      if (i === 0) return t.charAt(0).toUpperCase() + t.slice(1);
      return t.charAt(0).toLowerCase() + t.slice(1);
    });
    if (parts.length === 1) return parts[0] + '.';
    if (parts.length === 2) return parts[0] + ', and ' + parts[1] + '.';
    return parts.slice(0, -1).join(', ') + ', and ' + parts[parts.length - 1] + '.';
  }

  // ------------------------------------------------------- the voice

  var COMBINERS = [
    ', because ',
    ', which is why ',
    '; in fact, ',
    '; that is, ',
    ', and so ',
    ', and in turn ',
    '; from there, ',
    ', after all, '
  ];
  var FOLLOW_UPS = [
    'that is the whole of it.',
    'and that is the shape of it.',
    'which is to say the graph already knew.',
    'and the nerves hold it together.',
    'so there it is, in one breath.',
    'and that, roughly, is the answer.'
  ];

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function rInt(n) { return Math.floor(Math.random() * n); }
  function lowerFirst(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

  function buildSentence(parts) {
    var cleaned = parts.map(function (p) { return p.replace(/[.!?]+$/, ''); });
    var s;
    if (cleaned.length === 1) {
      s = cleaned[0];
    } else {
      s = cleaned[0];
      for (var i = 1; i < cleaned.length; i++) {
        s += COMBINERS[rInt(COMBINERS.length)] + lowerFirst(cleaned[i]);
      }
    }
    return s.charAt(0).toUpperCase() + s.slice(1) + '.';
  }

  // the heart of it: same nerves, different voice every time — one
  // folded sentence, or a led paragraph, or a longer plain block.
  function generateBlock(group, chips) {
    var facts = group.slice(0, 6).map(function (f) { return f.text.replace(/[.!?]+$/, ''); });
    var chip = chips[rInt(chips.length)];
    var roll = Math.random();

    // units: each is one or two facts fused, order shuffled each run
    var order = shuffle(facts.slice());
    var units = [];
    var i = 0;
    while (i < order.length) {
      if (i + 1 < order.length && Math.random() < 0.5) {
        units.push(buildSentence([order[i], order[i + 1]]));
        i += 2;
      } else {
        units.push(buildSentence([order[i]]));
        i += 1;
      }
    }

    var text;
    if (roll < 0.2) {
      // sometimes: one folded sentence (2-3 of the facts, no run-ons)
      var one = shuffle(facts.slice()).slice(0, 2 + rInt(2));
      text = buildSentence(one);
    } else if (roll < 0.55) {
      // sometimes: a short 2-3 sentence paragraph
      while (units.length > 2 + rInt(2)) {
        var a = units.shift(), b = units.shift();
        units.unshift(buildSentence([a, b]));
      }
      text = units.join('\n');
    } else {
      // sometimes: the full block, whatever it came to
      text = units.join('\n');
    }

    if (Math.random() < 0.3) {
      var lead = [
        'here\u2019s how the graph answers: ',
        'the short version: ',
        'in plain terms, ',
        'so, about \u201c' + chip + '\u201d: ',
        'look, ',
        'honestly it comes down to this: '
      ][rInt(6)];
      text = lead + lowerFirst(text);
    }
    if (Math.random() < 0.4 && text.length > 80 && text.indexOf('\n') >= 0) {
      var fu = FOLLOW_UPS[rInt(FOLLOW_UPS.length)];
      text += '\n' + fu.charAt(0).toUpperCase() + fu.slice(1);
    }
    text = text.charAt(0).toUpperCase() + text.slice(1);
    return text;
  }

  // which keyword a fact belongs under, for the elaboration list
  function keywordFor(cell, chips) {
    for (var i = 0; i < chips.length; i++) {
      var pool = expand(chips[i]);
      for (var pi = 0; pi < pool.length; pi++) {
        if (cell.k.indexOf(pool[pi]) >= 0) return chips[i];
      }
    }
    return chips[0];
  }

  // ------------------------------------------------------- answering

  function resetZones() {
    chipsEl.textContent = '';
    flistEl.textContent = '';
    clistEl.textContent = '';
    kwzoneEl.classList.remove('on');
    factzoneEl.classList.remove('on');
    connzoneEl.classList.remove('on');
    kwtagEl.classList.remove('hot');
    facttagEl.classList.remove('hot');
    conntagEl.classList.remove('hot');
  }

  function clearAnswer() {
    ansEl.textContent = '';
    answerEl.classList.remove('show');
  }

  function resetDom() {
    resetZones();
    clearAnswer();
  }

  function run(text) {
    if (state === 'keywords' || state === 'facts' || state === 'connections' || state === 'forming') return;
    setBox(true);
    inputEl.placeholder = 'ask anything\u2026';
    t0 = performance.now();
    _deliveryCache = {};
    resetZones();
    clearAnswer();
    for (var i = 0; i < cells.length; i++) {
      cells[i].fired = false; cells[i].litIdx = 0; cells[i].flashT = 0; cells[i].drain = 0; cells[i].charge = 0;
    }
    for (var j = 0; j < boutons.length; j++) boutons[j].flare = 0;
    assocEdges = [];
    impulses = [];
    edgesBuilt = [];

    colEl.classList.add('raised');

    var chips = tokens(text).slice(0, 6);
    if (!chips.length) chips = ['answer'];

    var scores = scoreFacts(text);
    var chain = pickChain(scores);

    var scoredAll = cells.map(function (c, idx) { return { c: c, s: scores[idx] || 0 }; })
      .filter(function (x) { return x.s > 0; })
      .sort(function (a, b) { return b.s - a.s; });
    var chainBest = scoredAll.filter(function (x) { return x.c.ch === chain; });

    // selection is deliberately loose: anchor on the strongest hit, then let
    // the run wander among the near-misses so the same prompt lights a
    // different subgraph — and writes a different sentence — every time.
    var nTarget = 4 + Math.floor(Math.random() * 3);
    var sel = [];
    if (chainBest.length) sel.push(chainBest[0].c);
    var wander = shuffle(chainBest.slice(1, 8));
    for (var wi = 0; wi < wander.length && sel.length < nTarget; wi++) {
      if (sel.indexOf(wander[wi].c) < 0) sel.push(wander[wi].c);
    }
    if (sel.length < nTarget) {
      var cross = shuffle(scoredAll.filter(function (x) { return x.c.ch !== chain; }));
      for (var cs = 0; cs < cross.length && sel.length < nTarget; cs++) {
        if (sel.indexOf(cross[cs].c) < 0) sel.push(cross[cs].c);
      }
    }
    if (sel.length < nTarget && chain) {
      var rest = shuffle(chainCells(chain, 1).concat(chainCells(chain, 2), chainCells(chain, 3)));
      for (var r = 0; r < rest.length && sel.length < nTarget; r++) {
        if (sel.indexOf(rest[r]) < 0) sel.push(rest[r]);
      }
    }
    if (sel.length < nTarget) {
      var gt = shuffle(chainCells('everything', 1).concat(chainCells('everything', 2), chainCells('everything', 3)));
      for (var g = 0; g < gt.length && sel.length < nTarget; g++) {
        if (sel.indexOf(gt[g]) < 0) sel.push(gt[g]);
      }
    }
    sel = sel.slice(0, 6);

    var spine0 = chainCells(chain, 1)[0];
    var ordered = sel.slice().sort(function (a, b) { return a.ho - b.ho || (Math.random() < 0.5 ? -1 : 1); });
    if (spine0 && sel.indexOf(spine0) >= 0) {
      ordered = [spine0].concat(ordered.filter(function (x) { return x !== spine0; }));
    }
    for (var oi = 0; oi < ordered.length; oi++) ordered[oi].litIdx = oi + 1;

    // schedule of the movements
    var answerText = generateBlock(ordered, chips);
    var sentences = answerText.split('\n').length;
    var avgLen = Math.max(30, Math.round(answerText.length / (sentences || 1)));
    synthesis = {
      chain: chain,
      ordered: ordered,
      chips: chips,
      text: answerText,
      kwStart: t0 + 260,
      kwStagger: KW_STAGGER,
      kwEnd: 0,
      factStart: 0,
      factEach: 520,
      factEnd: 0,
      conStart: 0,
      conEach: 150,
      conEnd: 0,
      answerStart: 0,
      builtEdges: [],
      flowStart: 0,
      perFact: 620 + 16 * avgLen,
      typeHold: 0,
      typeIdx: 0,
      typeRate: 16,
      fade: 1,
      ground: H * 0.62,
      shownLinks: []
    };
    synthesis.kwEnd = synthesis.kwStart + chips.length * synthesis.kwStagger + 240;
    synthesis.factStart = synthesis.kwEnd + 420;
    synthesis.factEnd = synthesis.factStart + (ordered.length - 1) * synthesis.factEach + 520;
    synthesis.conStart = synthesis.factEnd + 360;
    synthesis.conEnd = synthesis.conStart + ordered.length * synthesis.conEach;
    var lateralT = synthesis.conEnd + 160;
    synthesis.answerStart = lateralT + 600;

    promptCell = mkPromptCell(text);

    // nerves to lay: question -> fact1 -> fact2 -> ... (+ one lateral)
    var from = promptCell;
    for (var o = 0; o < ordered.length; o++) {
      var to = ordered[o];
      var cbl = cableBetween(from, to);
      if (!cbl) cbl = { path: growCablePath(from.qx || from.x, from.qy || from.y, to.x, to.y), a: from, b: to };
      synthesis.builtEdges.push({
        a: from, b: to, path: cbl.path,
        cum: pathCum(cbl.path),
        buildT: synthesis.conStart + o * synthesis.conEach,
        launched: false, done: false
      });
      if (cableExists(from, to) === false) assocEdges.push({ a: from, b: to, path: cbl.path, t0: 0 });
      from = to;
    }
    if (ordered.length >= 3) {
      var la = ordered[0], lb = ordered[2];
      var lcbl = cableBetween(la, lb);
      if (!lcbl) lcbl = { path: growCablePath(la.qx, la.qy, lb.x, lb.y), a: la, b: lb };
      synthesis.builtEdges.push({
        a: la, b: lb, path: lcbl.path,
        cum: pathCum(lcbl.path),
        buildT: lateralT,
        launched: false, done: false
      });
      if (cableExists(la, lb) === false) assocEdges.push({ a: la, b: lb, path: lcbl.path, t0: 0 });
    }

    // facts list, grouped under the keyword each one answers
    var grouped = {};
    var order = [];
    for (var fx = 0; fx < ordered.length; fx++) {
      var keyw = keywordFor(ordered[fx], chips);
      if (!grouped[keyw]) { grouped[keyw] = []; order.push(keyw); }
      grouped[keyw].push(ordered[fx]);
    }
    flistEl.textContent = '';
    for (var gk = 0; gk < order.length; gk++) {
      var kw = order[gk];
      for (var fl = 0; fl < grouped[kw].length; fl++) {
        var cell = grouped[kw][fl];
        var row = document.createElement('div');
        row.className = 'fkg';
        row.dataset.lit = String(cell.litIdx);
        var dEl = document.createElement('span');
        dEl.className = 'fdot';
        dEl.textContent = String(cell.litIdx);
        var kEl = document.createElement('span');
        kEl.className = 'fk';
        kEl.textContent = kw;
        var tEl = document.createElement('span');
        tEl.className = 'fl';
        tEl.textContent = cell.text;
        row.appendChild(dEl);
        row.appendChild(kEl);
        row.appendChild(tEl);
        flistEl.appendChild(row);
      }
    }

    kwzoneEl.classList.add('on');
    kwtagEl.classList.add('hot');
    inputEl.value = '';
    state = 'keywords';
  }

  function cableExists(a, b) {
    for (var i = 0; i < cables.length; i++) {
      if (cables[i].a === a && cables[i].b === b) return true;
    }
    return false;
  }

  function cableBetween(a, b) {
    for (var i = 0; i < cables.length; i++) {
      if (cables[i].a === a && cables[i].b === b) return cables[i];
      if (cables[i].a === b && cables[i].b === a) return cables[i];
    }
    return null;
  }

  function mkPromptCell(text) {
    var n = {
      text: text, fired: true, litIdx: 0, flashT: 0.7, drain: 0, charge: 1.4,
      x: W / 2, y: H * 0.185, w: 0, h: 22, trem: 0, glowph: 0,
      qx: W / 2, qy: H * 0.185, arbors: []
    };
    return n;
  }

  function mkImpulse(cbl, started, onEnd) {
    var cum = pathCum(cbl.path);
    var len = cum[cum.length - 1];
    var dur = clamp(len * 1.15, 320, 720);
    return {
      cum: cum, path: cbl.path, len: len,
      d: 0, speed: len / dur,
      wake: new Array(14).fill(null), wi: 0,
      started: started, done: false, onEnd: onEnd
    };
  }

  function fireNode(node) {
    if (!node.fired) { node.fired = true; node.flashT = 1; node.sparkF = 0; }
    node.charge = Math.min(2.4, node.charge + 1.5);
    for (var i = 0; i < boutons.length; i++) {
      if (boutons[i].owner === node) boutons[i].flare = 1;
    }
  }

  // ------------------------------------------------------- update

  function renderChips() {
    if (!synthesis) return;
    var frags = [];
    for (var i = 0; i < synthesis.chips.length; i++) {
      var t0c = synthesis.kwStart + i * synthesis.kwStagger;
      if (now < t0c) break;
      var spent = now - t0c;
      var full = synthesis.chips[i];
      var shown = Math.min(full.length, Math.floor(spent / CHIP_MS));
      var s = document.createElement('span');
      s.className = 'chip';
      s.textContent = shown < full.length ? full.slice(0, shown) + '\u258b' : full;
      frags.push(s);
    }
    chipsEl.textContent = '';
    for (var fi = 0; fi < frags.length; fi++) chipsEl.appendChild(frags[fi]);
  }

  function revealFacts() {
    var rows = flistEl.querySelectorAll('.fkg');
    for (var i = 0; i < rows.length; i++) {
      var want = now >= synthesis.factStart + i * 430;
      if (want) rows[i].style.opacity = '1';
    }
  }

  function buildLinkList() {
    var skd = synthesis;
    for (var b = 0; b < skd.builtEdges.length; b++) {
      var eg = skd.builtEdges[b];
      if (eg.done && skd.shownLinks.indexOf(b) < 0) {
        skd.shownLinks.push(b);
        var t = document.createElement('span');
        t.className = 'clink';
        t.textContent = (eg.a.litIdx || 'q') + ' \u2192 ' + (eg.b.litIdx || '?');
        clistEl.appendChild(t);
        requestAnimationFrame(function (el) { return function () { el.classList.add('on'); }; }(t));
      }
    }
  }

  function update(dt) {
    for (var i = 0; i < cells.length; i++) {
      var n = cells[i];
      n.charge *= 0.972;
      if (n.sparkF > 0) n.sparkF -= 0.025;
      if (n.sparkT > 0) {
        n.sparkT -= dt;
        if (n.sparkT <= 0) {
          n.sparkT = rand(2400, 7600);
          if (n.sparkF <= 0) n.sparkF = 1;
        }
      }
    }
    if (promptCell) promptCell.charge *= 0.992;
    for (var b = 0; b < boutons.length; b++) boutons[b].flare = Math.max(0, boutons[b].flare - 0.006);

    for (var ae = assocEdges.length - 1; ae >= 0; ae--) {
      if (assocEdges[ae].t0 > 0 && now - assocEdges[ae].t0 > 4200) assocEdges.splice(ae, 1);
    }

    if (synthesis) {
      var skd = synthesis;

      if (state === 'keywords') {
        renderChips();
        if (now >= skd.factStart) {
          state = 'facts';
          kwtagEl.classList.remove('hot');
          factzoneEl.classList.add('on');
          facttagEl.classList.add('hot');
          for (var fr = 0; fr < flistEl.querySelectorAll('.fkg').length; fr++) flistEl.children[fr].style.opacity = '0';
        }
      }

      if (state === 'facts') {
        revealFacts();
        for (var fo = 0; fo < skd.ordered.length; fo++) {
          var ft = skd.factStart + fo * skd.factEach;
          if (now >= ft && !skd.ordered[fo].fired) fireNode(skd.ordered[fo]);
        }
        if (now >= skd.conStart) {
          state = 'connections';
          facttagEl.classList.remove('hot');
          connzoneEl.classList.add('on');
          conntagEl.classList.add('hot');
          skd.startedLinksAt = now;
        }
      }

      if (state === 'connections') {
        var allLaunched = true;
        for (var be = 0; be < skd.builtEdges.length; be++) {
          var edge = skd.builtEdges[be];
          if (!edge.launched) {
            if (now >= edge.buildT) {
              edge.launched = true;
              impulses.push(mkImpulse(edge, now, fireNode.bind(null, edge.b)));
            } else {
              allLaunched = false;
            }
          }
          if (edge.launched && now >= edge.buildT + 520) edge.done = true;
        }
        buildLinkList();
        if (allLaunched && now >= skd.answerStart && now - skd.startedLinksAt > 700) {
          state = 'forming';
          resetZones();
          colEl.classList.remove('raised');
          conntagEl.classList.remove('hot');
          answerEl.classList.add('show');
          skd.fade = 1;
          skd.typeRate = Math.max(6, Math.min(16, Math.round(3400 / skd.text.length)));
          skd.flowStart = now;
        }
      }

      if (state === 'forming') {
        skd.typeHold += dt;
        while (skd.typeIdx < skd.text.length && skd.typeHold >= skd.typeRate) {
          skd.typeHold -= skd.typeRate;
          skd.typeIdx++;
          ansEl.textContent = skd.text.slice(0, skd.typeIdx) + (skd.typeIdx < skd.text.length ? '\u2009\u258b' : '');
        }
        skd.fade = Math.max(0, skd.fade - dt / 1100);
      }
      if (state === 'forming' && skd.typeIdx >= skd.text.length) {
        ansEl.textContent = skd.text;
        state = 'answered';
        answerAt = now;
        setBox(false);
        inputEl.focus();
        inputEl.placeholder = 'ask anything else\u2026';
      } else if (state === 'answered') {
        skd.fade = Math.max(0, skd.fade - dt / 500);
        if (now - answerAt > 1400) {
          state = 'settling';
          settleStart = now;
          for (var z = 0; z < cells.length; z++) cells[z].drain = 1;
          if (promptCell) promptCell.drain = 1;
        }
      } else if (state === 'settling') {
        var dec = (now - settleStart) / 850;
        var done = true;
        for (var u = 0; u < cells.length; u++) {
          if (cells[u].drain > 0) {
            cells[u].drain = Math.max(0, 1 - dec);
            if (cells[u].drain !== 0) done = false;
          }
        }
        if (done) {
          state = 'idle';
          for (var v = 0; v < cells.length; v++) {
            cells[v].fired = false; cells[v].litIdx = 0; cells[v].drain = 0; cells[v].flashT = 0; cells[v].charge = 0;
          }
          promptCell = null; impulses = []; assocEdges = []; edgesBuilt = [];
          synthesis = null;
          resetZones();
          setBox(false);
        }
      }
    }

    for (var k = 0; k < impulses.length; k++) {
      var imp = impulses[k];
      if (imp.done) continue;
      if (now < imp.started) continue;
      imp.d += imp.speed * dt;
      if (imp.d >= imp.len) {
        if (imp.onEnd) imp.onEnd();
        imp.done = true;
        continue;
      }
      var pos = pointAt(imp.path, imp.cum, imp.d);
      imp.wake[imp.wi] = { x: pos.x, y: pos.y, a: 1 };
      imp.wi = (imp.wi + 1) % imp.wake.length;
      for (var bb = 0; bb < boutons.length; bb++) {
        var bo = boutons[bb];
        var d2 = (pos.x - bo.x) * (pos.x - bo.x) + (pos.y - bo.y) * (pos.y - bo.y);
        if (d2 < 30) bo.flare = Math.min(1, bo.flare + 0.5);
      }
    }
  }

  // ------------------------------------------------------- draw

  function drawPathT(c, path, cum, frac, alpha, width) {
    if (frac <= 0) return;
    var total = cum[cum.length - 1];
    var d = total * Math.min(1, frac);
    var lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (cum[mid] <= d) lo = mid; else hi = mid;
    }
    c.globalAlpha = alpha;
    c.strokeStyle = ACCENT;
    c.lineWidth = width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(path[0][0], path[0][1]);
    for (var i = 1; i <= lo; i++) c.lineTo(path[i][0], path[i][1]);
    if (lo < path.length - 1) {
      var p = pointAt(path, cum, d);
      c.lineTo(p.x, p.y);
    }
    c.stroke();
    c.globalAlpha = 1;
  }

  function drawFibre(c, path, alpha, width) {
    c.strokeStyle = ACCENT;
    c.lineWidth = width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.globalAlpha = alpha;
    c.beginPath();
    var p0 = path[0];
    c.moveTo(p0[0], p0[1]);
    for (var i = 1; i < path.length; i++) {
      var p = path[i];
      c.lineTo(p[0], p[1]);
    }
    c.stroke();
    c.globalAlpha = 1;
  }

  function drawFlow(c, path, alpha, width, off) {
    c.globalAlpha = alpha;
    c.strokeStyle = ACCENT;
    c.lineWidth = width;
    c.lineCap = 'round';
    c.setLineDash([2, 6]);
    c.lineDashOffset = off;
    c.beginPath();
    var p0 = path[0];
    c.moveTo(p0[0], p0[1]);
    for (var i = 1; i < path.length; i++) {
      var p = path[i];
      c.lineTo(p[0], p[1]);
    }
    c.stroke();
    c.setLineDash([]);
    c.globalAlpha = 1;
  }

  function deliveryPath(cell, ry) {
    var start = { x: cell.qx, y: cell.qy };
    var mx = (start.x + W / 2) / 2;
    var ctrl = { x: mx + rand(-30, 30), y: (start.y + ry) / 2 };
    return smooth([[start.x, start.y], [ctrl.x, ctrl.y], [W / 2 + rand(-30, 30), ry]]);
  }

  var _deliveryCache = {};

  function draw() {
    var breath = now * 0.0012;

    for (var di = 0; di < cells.length; di++) if (cells[di].flashT > 0) cells[di].flashT -= 0.035;
    if (promptCell && promptCell.flashT > 0) promptCell.flashT -= 0.035;

    var firedList = [];
    for (var qi = 0; qi < cells.length; qi++) {
      var qn = cells[qi];
      var ampv = qn.fired ? 1.3 : 0.5;
      qn.qx = qn.x + Math.sin(frame * 0.005 + qn.trem) * ampv;
      qn.qy = qn.y + Math.cos(frame * 0.006 + qn.trem * 1.7) * ampv;
      if (qn.fired) firedList.push(qn);
    }
    if (promptCell) {
      promptCell.qx = promptCell.x + Math.sin(breath * 1.3) * 3;
      promptCell.qy = promptCell.y + Math.cos(breath * 0.9) * 3;
    }

    var dmax = 0;
    for (var dd = 0; dd < cells.length; dd++) if (cells[dd].drain > dmax) dmax = cells[dd].drain;
    var plexusExtra = synthesis && (state === 'forming' || state === 'answered') ? synthesis.fade : 1;
    var drainAll = (1 - dmax * 0.92) * plexusExtra;
    var interact = state === 'keywords' || state === 'facts' || state === 'connections' || state === 'forming' || state === 'answered' ? 1 : 0;

    // ---- quiet wash
    var throb = 0.5 + 0.5 * Math.sin(breath);
    var bg = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, H * 0.95);
    bg.addColorStop(0, lerpColor(0.008 + 0.010 * throb));
    bg.addColorStop(0.6, lerpColor(0.003 + 0.002 * throb));
    bg.addColorStop(1, 'rgba(255,166,201,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ---- drizzle
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var dz = 0; dz < drizzle.length; dz++) {
      var dzz = drizzle[dz];
      ctx.font = dzz.size + 'px "CMU Typewriter Text", monospace';
      ctx.fillStyle = 'rgba(228,228,234,' + (dzz.op * (0.7 + 0.3 * Math.sin(now * 0.001 + dzz.ph))).toFixed(3) + ')';
      ctx.fillText(dzz.t, dzz.x + Math.sin(frame * 0.003 + dzz.dp) * 2, dzz.y + Math.cos(frame * 0.0025 + dzz.dp * 1.4) * 2);
    }

    // ---- tissue under-layer
    tctx.globalAlpha = 1;
    tctx.fillStyle = 'rgba(9,3,11,0.05)';
    tctx.fillRect(0, 0, TW, TH);
    tctx.setTransform(0.5, 0, 0, 0.5, 0, 0);

    for (var cn = 0; cn < cells.length; cn++) {
      var cell = cells[cn];
      var arbA = 0.008 + Math.min(0.06, cell.charge * 0.028) * drainAll;
      for (var ap = 0; ap < cell.arbors.length; ap++) {
        drawFibre(tctx, cell.arbors[ap], arbA, 1.2);
      }
    }
    for (var cb = 0; cb < cables.length; cb++) {
      drawFibre(tctx, cables[cb].path, 0.005, 1.0);
    }
    for (var th = 0; th < threads.length; th++) {
      drawFibre(tctx, threads[th].path, 0.004, 0.9);
    }

    // freshly laid nerves, hot while growing, then cooling into the web
    if (synthesis) {
      for (var be = 0; be < synthesis.builtEdges.length; be++) {
        var eg = synthesis.builtEdges[be];
        if (!eg.launched) continue;
        var frac = clamp((now - eg.buildT) / 520, 0, 1);
        if (frac < 1) drawPathT(tctx, eg.path, eg.cum, frac, 0.03, 1.1);
      }
    }
    for (var as2 = 0; as2 < assocEdges.length; as2++) {
      var eA = Math.min(0.05, (1 - (now - assocEdges[as2].t0) / 4200) * 0.05);
      if (eA > 0.001) drawFibre(tctx, assocEdges[as2].path, eA, 1.1);
    }

    // impulse wakes
    for (var im = 0; im < impulses.length; im++) {
      var imp = impulses[im];
      if (imp.done || now < imp.started) continue;
      var wak = imp.wake;
      var nw = wak.length;
      for (var wq = 0; wq < nw; wq++) {
        var e = wak[(imp.wi + nw - 1 - wq) % nw];
        if (!e) continue;
        var fade = 0.5 * Math.pow(1 - wq / nw, 2);
        if (fade <= 0.012) continue;
        tctx.globalAlpha = 1;
        tctx.strokeStyle = ACCENT;
        tctx.lineWidth = 1.8;
        tctx.lineCap = 'round';
        var nxp = wak[(imp.wi + nw - 2 - wq) % nw];
        if (nxp) {
          tctx.beginPath();
          tctx.moveTo(nxp.x, nxp.y);
          tctx.lineTo(e.x, e.y);
          tctx.stroke();
        }
      }
    }

    // boutons
    for (var bt = 0; bt < boutons.length; bt++) {
      var bo = boutons[bt];
      var a = 0.04 + bo.flare * 0.7;
      if (bo.owner && bo.owner.charge > 0.05) a = Math.max(a, Math.min(0.5, bo.owner.charge * 0.22));
      if (a < 0.02) continue;
      tctx.globalAlpha = 1;
      tctx.fillStyle = ACCENT;
      tctx.beginPath();
      tctx.arc(bo.x, bo.y, 1.4, 0, Math.PI * 2);
      tctx.fill();
    }
    tctx.globalAlpha = 1;

    // delivery threads -> answer
    if (synthesis && (state === 'forming' || state === 'answered')) {
      var base = synthesis.flowStart;
      for (var fI = 0; fI < synthesis.ordered.length; fI++) {
        var t0f = base + fI * synthesis.perFact;
        var t1f = t0f + 900;
        if (now < t0f - 400 || now > t1f) continue;
        var phased = clamp((now - t0f) / 700, 0, 1);
        var dpth = _deliveryCache.hasOwnProperty(fI) ? _deliveryCache[fI] : (_deliveryCache[fI] = deliveryPath(synthesis.ordered[fI], synthesis.ground));
        drawFlow(tctx, dpth, (0.05 + 0.05 * phased) * drainAll, 1.1, -now * 0.03);
      }
    }

    // bloom
    ctx.filter = 'blur(2.5px)';
    ctx.globalAlpha = 0.5;
    ctx.drawImage(tissue, 0, 0, W, H);
    ctx.filter = 'blur(9px)';
    ctx.globalAlpha = 0.4;
    ctx.drawImage(tissue, 0, 0, W, H);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;

    // ---- motes
    var motA = 0.02 + interact * 0.01;
    for (var mo = 0; mo < motes.length; mo++) {
      var mm = motes[mo];
      var sc = Math.cos(mm.swirl), ss = Math.sin(mm.swirl);
      var nvx = mm.vx * sc - mm.vy * ss;
      mm.vy = mm.vx * ss + mm.vy * sc;
      mm.vx = nvx;
      if (firedList.length) {
        var nrst = nearestOf(firedList, mm.x, mm.y);
        var pdx = nrst.qx - mm.x, pdy = nrst.qy - mm.y;
        var dl = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
        var pull = 2200 / (dl * dl + 5200);
        mm.vx += (pdx / dl) * pull * 0.4;
        mm.vy += (pdy / dl) * pull * 0.4;
      }
      mm.x += mm.vx; mm.y += mm.vy;
      if (mm.x < -4) mm.x = W + 4; else if (mm.x > W + 4) mm.x = -4;
      if (mm.y < -4) mm.y = H + 4; else if (mm.y > H + 4) mm.y = -4;
      var tw = 0.5 + 0.5 * Math.sin(now * 0.001 + mm.ph);
      ctx.globalAlpha = motA * (0.5 + tw);
      ctx.fillStyle = mm.pink ? ACCENT : GREY;
      ctx.beginPath();
      ctx.arc(mm.x, mm.y, mm.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- crisp nerves being laid
    if (synthesis && state === 'connections') {
      for (var gb = 0; gb < synthesis.builtEdges.length; gb++) {
        var gEdge = synthesis.builtEdges[gb];
        if (!gEdge.launched || gEdge.done) continue;
        var gT = clamp((now - gEdge.buildT) / 520, 0, 1);
        if (gT <= 0) continue;
        if (gT < 1) drawPathT(ctx, gEdge.path, gEdge.cum, gT, 0.3 * drainAll, 1.1);
        var tHead = pointAt(gEdge.path, gEdge.cum, gEdge.cum[gEdge.cum.length - 1] * Math.min(1, gT));
        var hg = ctx.createRadialGradient(tHead.x, tHead.y, 0, tHead.x, tHead.y, 10);
        hg.addColorStop(0, lerpColor(0.65 * drainAll));
        hg.addColorStop(1, 'rgba(255,166,201,0)');
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.arc(tHead.x, tHead.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = 0.9 * drainAll;
        ctx.beginPath();
        ctx.arc(tHead.x, tHead.y, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // crisp pulse heads
    for (var ph = 0; ph < impulses.length; ph++) {
      var imp2 = impulses[ph];
      if (imp2.done || now < imp2.started) continue;
      var pos = pointAt(imp2.path, imp2.cum, imp2.d);
      var hg2 = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 9);
      hg2.addColorStop(0, lerpColor(0.55 * drainAll));
      hg2.addColorStop(1, 'rgba(255,166,201,0)');
      ctx.fillStyle = hg2;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = ACCENT;
      ctx.globalAlpha = 0.85 * drainAll;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ---- neurons: just light, no text — the words live in the column
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var n2 = 0; n2 < cells.length; n2++) {
      var nd2 = cells[n2];
      var ndr = ndrain(nd2);
      var ch2 = Math.min(1, nd2.charge);
      if (nd2.fired) {
        var g = Math.min(34, 6 + ch2 * 22);
        var rad = ctx.createRadialGradient(nd2.qx, nd2.qy, 0, nd2.qx, nd2.qy, g);
        rad.addColorStop(0, lerpColor((0.35 * ndr + ch2 * 0.25) * ndr));
        rad.addColorStop(1, 'rgba(255,166,201,0)');
        ctx.fillStyle = rad;
        ctx.beginPath();
        ctx.arc(nd2.qx, nd2.qy, g, 0, Math.PI * 2);
        ctx.fill();
        if (nd2.flashT > 0) {
          ctx.strokeStyle = lerpColor(nd2.flashT * 0.5 * ndr);
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(nd2.qx, nd2.qy, (1 - nd2.flashT) * 30 + 8, 0, Math.PI * 2);
          ctx.stroke();
        }
        if (nd2.litIdx > 0) {
          var bx = nd2.qx + 12, by = nd2.qy - 6;
          ctx.fillStyle = 'rgba(10,10,15,0.9)';
          ctx.beginPath();
          ctx.arc(bx, by, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = lerpColor(0.8 * ndr);
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = ACCENT;
          ctx.font = '700 9px "CMU Sans Serif", sans-serif';
          ctx.fillText(String(nd2.litIdx), bx, by);
        }
      } else {
        var rst = 0.5 + 0.5 * Math.sin(now * 0.002 + nd2.glowph);
        var sp2 = nd2.sparkF > 0 ? nd2.sparkF : 0;
        ctx.globalAlpha = ndr * (0.12 + rst * 0.06 + sp2 * 0.25);
        ctx.fillStyle = GREY;
        ctx.beginPath();
        ctx.arc(nd2.qx, nd2.qy, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // faint chain names
    ctx.font = '500 8px "CMU Sans Serif", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var lk = 0; lk < CHAIN_KEYS.length; lk++) {
      var ck = CHAIN_KEYS[lk];
      var meta = chainMeta[ck];
      if (!meta) continue;
      var hot = synthesis && synthesis.chain === ck && (state === 'facts' || state === 'connections' || state === 'forming' || state === 'answered');
      var la = hot ? 0.5 + 0.2 * Math.sin(now * 0.005) : 0.08;
      ctx.fillStyle = lerpColor(la * drainAll);
      ctx.fillText(CHAINS[ck].label.toUpperCase(), meta.x, clamp(meta.y - meta.r - 20, 28, H - 10));
    }

    // the question's root, just above the field
    if (promptCell) {
      var pn = promptCell;
      var pdd = pn.drain > 0 ? (1 - pn.drain) : 1;
      var hg3 = ctx.createRadialGradient(pn.qx, pn.qy, 0, pn.qx, pn.qy, 14);
      hg3.addColorStop(0, lerpColor(0.55 * pdd));
      hg3.addColorStop(1, 'rgba(255,166,201,0)');
      ctx.fillStyle = hg3;
      ctx.beginPath();
      ctx.arc(pn.qx, pn.qy, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = ACCENT;
      ctx.globalAlpha = pdd;
      ctx.beginPath();
      ctx.arc(pn.qx, pn.qy, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function ndrain(n) {
    return n.drain > 0 ? (1 - n.drain) : 1;
  }

  function nearestOf(list, x, y) {
    var best = list[0], bd = Infinity;
    for (var i = 0; i < list.length; i++) {
      var d = dist(list[i].qx, list[i].qy, x, y);
      if (d < bd) { bd = d; best = list[i]; }
    }
    return best;
  }

  // ------------------------------------------------------- boot

  function setBox(off) {
    inputEl.disabled = off;
    submitEl.disabled = off;
    if (off) inputEl.blur();
  }

  submitEl.addEventListener('click', function () { run(inputEl.value); inputEl.focus(); });
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { run(inputEl.value); inputEl.focus(); } });

  function tick(ts) {
    var dt = lastT ? Math.min(ts - lastT, 50) : 16;
    lastT = ts;
    now = ts; frame = ts;
    update(dt);
    draw();
    requestAnimationFrame(tick);
  }

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildTissue();
    buildLayout();
    buildNerveNet();
    buildDrizzle();
    buildMotes();
    state = 'idle'; impulses = []; promptCell = null; synthesis = null; assocEdges = []; edgesBuilt = [];
    _deliveryCache = {};
    resetDom();
    colEl.classList.remove('raised');
    setBox(false);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { resize(); });
  }
})();
</script>
</body>
</html>
