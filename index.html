<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>not a lookup. a lighting-up.</title>
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #e9e9ee;
    --grey: #8e8e98;
    --dim: #40404a;
    --accent: #ffa6c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }

  .scene { position: relative; height: 100vh; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .title {
    position: absolute; top: 6%; left: 0; right: 0;
    text-align: center; pointer-events: none; user-select: none;
  }
  .title h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400; font-size: clamp(22px, 3.4vw, 40px);
    letter-spacing: 0.02em; line-height: 1.3; color: var(--ink);
  }
  .hint {
    margin-top: 14px; font-size: 12px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--dim);
  }

  .ui {
    position: absolute; bottom: 6%; left: 0; right: 0;
    text-align: center; user-select: none;
  }
  .chips { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .chip {
    font-size: 13.5px; letter-spacing: 0.03em; color: var(--grey);
    background: transparent; border: 1px solid var(--dim);
    border-radius: 999px; padding: 10px 22px; cursor: pointer; outline: none;
    transition: color 0.35s ease, border-color 0.35s ease, opacity 0.35s ease;
  }
  .chip:hover:not(.off) { color: var(--accent); border-color: rgba(255,166,201,0.5); }
  .chip.off { opacity: 0.3; cursor: default; pointer-events: none; }

  .again {
    display: inline-block; margin-top: 20px; font-size: 12px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--grey); opacity: 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--dim);
    transition: opacity 0.8s ease, color 0.3s ease;
  }
  .again:hover { color: var(--accent); }
  .again.show { opacity: 1; }

  .reply {
    position: absolute; left: 0; right: 0; top: 63%;
    text-align: center; pointer-events: none; user-select: none;
    opacity: 0; transform: translateY(8px);
    transition: opacity 1.3s ease, transform 1.3s ease;
  }
  .reply.show { opacity: 1; transform: translateY(0); }
  .reply p {
    display: inline-block; max-width: 620px; margin: 0 auto; padding: 14px 26px;
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
    font-size: 17px; line-height: 1.7; color: var(--ink);
    background: rgba(10,10,15,0.72);
    box-shadow: 0 0 0 1px rgba(255,166,201,0.08), 0 0 60px rgba(255,166,201,0.05);
    border-radius: 6px;
  }
</style>
</head>
<body>

  <div class="scene">
    <canvas id="stage"></canvas>

    <div class="title">
      <h1>not a lookup. a lighting-up.</h1>
      <div class="hint">choose a thought to feed it</div>
    </div>

    <div class="reply"><p id="replytext"></p></div>

    <div class="ui">
      <div class="chips" id="chips"></div>
      <div class="again" id="again">run again</div>
    </div>
  </div>

<script>
(function () {
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var chipsEl = document.getElementById('chips');
  var replyEl = document.getElementById('replytext');
  var againEl = document.getElementById('again');

  var ACCENT = '#ffa6c9';

  // ------------------------------------------------------------- the field

  var WORDS_ALL = [
    // science pocket
    { t: 'rayleigh' },  { t: 'wavelength' }, { t: 'photon' },    { t: 'scatter' },
    { t: 'atmosphere' },{ t: 'entropy' },    { t: 'gravity' },   { t: 'velocity' },
    // craft pocket
    { t: 'meter' },     { t: 'cadence' },    { t: 'stanza' },    { t: 'metaphor' },
    { t: 'imagery' },   { t: 'rhyme' },      { t: 'silence' },   { t: 'ink' },
    // appetite pocket
    { t: 'hunger' },    { t: 'spice' },      { t: 'comfort' },   { t: 'craving' },
    { t: 'warmth' },    { t: 'ritual' },     { t: 'coffee' },    { t: 'salt' },
    // noise — no cluster
    { t: 'arjuna' },    { t: 'dharma' },     { t: 'indigo' },    { t: 'static' },
    { t: 'thunder' },   { t: 'lotus' },      { t: 'recursion' }, { t: 'horizon' },
    { t: 'quartz' },    { t: 'mirror' },     { t: 'pulse' },     { t: 'tide' },
    { t: 'fracture' },  { t: 'orbit' },      { t: 'whisper' },   { t: 'carnatic' },
    { t: 'velvet' },    { t: 'echo' }
  ];

  var PROMPTS = [
    {
      text: 'why is the sky blue', words: ['why','is','the','sky','blue'],
      edges: {
        why:  ['rayleigh'],
        is:   [],
        the:  [],
        sky:  ['rayleigh','wavelength','atmosphere'],
        blue: ['scatter','wavelength','photon','atmosphere']
      },
      reply: 'blue light scatters more than any other wavelength when it hits the atmosphere.'
    },
    {
      text: 'write me a poem', words: ['write','me','a','poem'],
      edges: {
        write: ['meter','cadence'],
        me:    [],
        a:     [],
        poem:  ['cadence','stanza','metaphor','rhyme','silence']
      },
      reply: 'something with cadence, and one line that means more than it says.'
    },
    {
      text: 'what should i eat', words: ['what','should','i','eat'],
      edges: {
        what:   [],
        should: [],
        i:      ['hunger'],
        eat:    ['hunger','comfort','spice','warmth','craving']
      },
      reply: 'something warm. something that isn\u2019t just calories.'
    }
  ];

  // per-word state: matchBy = prompt-word indices that lit it
  var words = [];
  var wordIndex = {};   // text -> index

  var W, H, DPR;
  var now = 0, frame = 0;
  var state = 'idle';        // idle | sequence | answered
  var seeds = [];
  var started = 0;

  // ------------------------------------------------------------ field build

  function makeWordObjects() {
    words = [];
    wordIndex = {};
    var base = [
      { t: 'rayleigh', cl: 0 },  { t: 'wavelength', cl: 0 }, { t: 'photon', cl: 0 },   { t: 'scatter', cl: 0 },
      { t: 'atmosphere', cl: 0 },{ t: 'entropy', cl: 0 },    { t: 'gravity', cl: 0 },  { t: 'velocity', cl: 0 },
      { t: 'meter', cl: 1 },     { t: 'cadence', cl: 1 },    { t: 'stanza', cl: 1 },   { t: 'metaphor', cl: 1 },
      { t: 'imagery', cl: 1 },   { t: 'rhyme', cl: 1 },      { t: 'silence', cl: 1 },  { t: 'ink', cl: 1 },
      { t: 'hunger', cl: 2 },    { t: 'spice', cl: 2 },      { t: 'comfort', cl: 2 },  { t: 'craving', cl: 2 },
      { t: 'warmth', cl: 2 },    { t: 'ritual', cl: 2 },     { t: 'coffee', cl: 2 },   { t: 'salt', cl: 2 }
    ];
    for (var j = 0; j < 18; j++) base.push({ t: WORDS_ALL[24 + j].t, cl: -1 });

    for (var i = 0; i < base.length; i++) {
      var w = {
        text: base[i].t,
        size: rand(10, 22),
        idleOp: rand(0.2, 0.5),
        cl: base[i].cl,
        x: 0, y: 0,
        dp: rand(0, Math.PI * 2),
        ph: rand(0, Math.PI * 2),
        drift: rand(1.5, 6),
        matchBy: [],
        flashT: 0,
        dims: null
      };
      words.push(w);
      wordIndex[w.text] = i;
    }
    placeWords();
  }

  function placeWords() {
    // pockets for themed clusters
    var pockets = [
      { x: W * 0.26, y: H * 0.42, r: 150 },   // science
      { x: W * 0.72, y: H * 0.52, r: 150 },   // craft
      { x: W * 0.5,  y: H * 0.76, r: 150 }    // appetite
    ];

    var idxs = [], order = [];
    for (var i = 0; i < words.length; i++) idxs.push(i);
    // shuffle slightly so placement isn't predictable
    order = idxs.slice();
    for (var k = order.length - 1; k > 0; k--) {
      var r = Math.floor(Math.random() * (k + 1));
      var tmp = order[k]; order[k] = order[r]; order[r] = tmp;
    }

    var rects = [];
    ctx.save();
    for (var n = 0; n < order.length; n++) {
      var wi = order[n];
      var w = words[wi];
      ctx.font = w.size + 'px "Helvetica Neue", sans-serif';
      var twid = ctx.measureText(w.text).width + 14;
      var theight = w.size * 1.6;
      var cx, cy, ok = false;
      for (var att = 0; att < 500 && !ok; att++) {
        if (w.cl >= 0) {
          var pc = pockets[w.cl];
          cx = pc.x + (gauss() * pc.r) * 0.55;
          cy = pc.y + (gauss() * pc.r) * 0.55;
        } else {
          cx = rand(0.03, 0.97) * W;
          cy = rand(0.13, 0.94) * H;
        }
        cx = clamp(cx, 30, W - 30);
        cy = clamp(cy, 40, H - 34);
        ok = true;
        for (var q = 0; q < rects.length; q++) {
          var rr = rects[q];
          if (cx + twid / 2 > rr.x - rr.w / 2 - 8 &&
              cx - twid / 2 < rr.x + rr.w / 2 + 8 &&
              cy + theight / 2 > rr.y - rr.h / 2 - 8 &&
              cy - theight / 2 < rr.y + rr.h / 2 + 8) {
            ok = false; break;
          }
        }
      }
      w.x = cx; w.y = cy; w.dims = { w: twid, h: theight, x: cx, y: cy };
      rects.push(w.dims);
    }
    ctx.restore();
  }

  function gauss() {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ---------------------------------------------------------------- seeds

  function spawnWords(prompt, t0) {
    seeds = [];
    var n = prompt.words.length;
    for (var i = 0; i < n; i++) {
      var targets = prompt.edges[prompt.words[i]] || [];
      seeds.push({
        idx: i,
        text: prompt.words[i],
        x: W * (0.2 + i * (0.6 / (n > 1 ? n - 1 : 1))) + rand(-20, 20),
        y: -30,
        ty: H * (0.2 + (i % 2) * 0.06),
        spawned: t0 + 150 * i,
        state: 'pending',
        stateAt: 0,
        testDelay: 300 + 120 * (i % 3),
        testStart: 0,
        probes: [],
        resolvedP: null
      });
    }

    // assign probes after words exist (wordIndex map ready)
    for (var s = 0; s < seeds.length; s++) {
      var sd = seeds[s];
      sd.targets = (prompt.edges[sd.text] || []).map(function (t) { return wordIndex[t]; });
      sd.decoys = [];
      // a few nearby words that won't match — near-misses
      var n2 = 4 + Math.floor(Math.random() * 3);
      var tries = 0;
      while (sd.decoys.length < n2 && tries < 60) {
        tries++;
        var wi = Math.floor(Math.random() * words.length);
        if (sd.targets.indexOf(wi) >= 0 || sd.decoys.indexOf(wi) >= 0) continue;
        if (Math.abs(words[wi].x - sd.x) > W * 0.55) continue; // keep rays plausible
        sd.decoys.push(wi);
      }
      sd._targets = sd.targets.slice();
      sd._decoys = sd.decoys.slice();
    }
  }

  // -------------------------------------------------------------- lifetime

  function update() {
    if (state === 'idle') return;
    if (state === 'sequence') updateSequence();
  }

  function updateSequence() {
    var allDone = true;

    for (var i = 0; i < seeds.length; i++) {
      var s = seeds[i];

      if (s.state === 'pending' && now >= s.spawned) { s.state = 'falling'; s.vy = rand(0.5, 0.7); }
      if (s.state === 'falling') {
        s.vy += 0.004;
        s.y += s.vy;
        if (s.y >= s.ty) { s.y = s.ty; s.state = 'landed'; s.stateAt = now; }
      }
      if (s.state === 'landed' && now >= s.stateAt + s.testDelay) {
        s.state = 'testing';
        s.testStart = now;
        // build probes: targets first (all catch), then decoys (all miss)
        var probes = [];
        for (var t = 0; t < s._targets.length; t++) {
          probes.push({ wi: s._targets[t], catch: true, p: 0, resolved: false });
        }
        for (var d = 0; d < s._decoys.length; d++) {
          probes.push({ wi: s._decoys[d], catch: false, p: 0, resolved: false });
        }
        s.probes = probes;
      }
      if (s.state === 'testing') {
        var done = 0;
        for (var j = 0; j < s.probes.length; j++) {
          var pr = s.probes[j];
          var wp = words[pr.wi];
          var rp = clamp((now - s.testStart - j * 80) / 300, 0, 1);
          pr.p = rp;
          if (rp >= 0.9) {
            if (!pr.resolved) {
              pr.resolved = true;
              wp.flashT = 1;
              if (pr.catch && wp.matchBy.indexOf(s.idx) < 0) {
                wp.matchBy.push(s.idx);
              }
            }
            done++;
            pr.doneDist = dist(s.x, s.y, wp.x, wp.y);
          } else {
            pr.doneDist = null;
          }
        }
        if (done === s.probes.length) { s.state = 'done'; s.doneAt = now; }
      }
      if (s.state !== 'done') allDone = false;
    }

    if (allDone) {
      var last = 0;
      for (var m = 0; m < seeds.length; m++) last = Math.max(last, seeds[m].doneAt);
      if (now - last > 900) {
        state = 'answered';
        showReply();
      }
    }
  }

  function showReply() {
    setTimeout(function () {
      document.querySelector('.reply').classList.add('show');
      againEl.classList.add('show');
    }, 200);
  }

  // ---------------------------------------------------------------- draw

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // decay flashes
    for (var w = 0; w < words.length; w++) {
      if (words[w].flashT > 0) words[w].flashT -= 0.02;
    }

    // connecting lines
    if (state !== 'idle') {
      for (var s = 0; s < seeds.length; s++) {
        var sd = seeds[s];
        if (sd.state !== 'testing' && sd.state !== 'done') continue;
        for (var j = 0; j < sd.probes.length; j++) {
          var pr = sd.probes[j];
          if (!pr.resolved || !pr.catch) continue;
          var wp = words[pr.wi];
          var bright = wp.matchBy.length >= 2;
          var x1 = sd.x, y1 = sd.y, x2 = wp.x, y2 = wp.y;
          ctx.strokeStyle = bright ? 'rgba(255,166,201,0.95)' : 'rgba(255,166,201,0.4)';
          ctx.lineWidth = bright ? 2.2 : 1.1;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }
      // sweep rays not yet resolved
      for (var s2 = 0; s2 < seeds.length; s2++) {
        var sd2 = seeds[s2];
        if (sd2.state !== 'testing') continue;
        for (var j2 = 0; j2 < sd2.probes.length; j2++) {
          var pr2 = sd2.probes[j2];
          if (pr2.resolved) continue;
          var wp2 = words[pr2.wi];
          var ang = Math.atan2(wp2.y - sd2.y, wp2.x - sd2.x);
          var len = pr2.p * dist(sd2.x, sd2.y, wp2.x, wp2.y);
          ctx.strokeStyle = 'rgba(255,166,201,' + (0.3 * Math.sin(pr2.p * Math.PI) + 0.05) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(sd2.x, sd2.y);
          ctx.lineTo(sd2.x + Math.cos(ang) * len, sd2.y + Math.sin(ang) * len);
          ctx.stroke();
        }
      }
    }

    // field words
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var k = 0; k < words.length; k++) {
      var wd = words[k];
      var dx = wd.x + Math.sin(frame * 0.005 + wd.dp) * wd.drift;
      var dy = wd.y + Math.cos(frame * 0.004 + wd.dp * 1.3) * wd.drift;

      var lit = wd.matchBy.length > 0;
      var bright = wd.matchBy.length >= 2;

      if (lit) {
        var scale = bright ? 1.3 : 1.2;
        var size = wd.size * scale;
        var op = 0.55 + Math.min(1, wd.flashT) * 0.45;
        ctx.font = size + 'px "Helvetica Neue", sans-serif';
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = op;
        ctx.shadowColor = ACCENT;
        ctx.shadowBlur = bright ? 18 : 10;
      } else if (wd.flashT > 0) {
        ctx.font = wd.size + 'px "Helvetica Neue", sans-serif';
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = wd.flashT * 0.6;
        ctx.shadowColor = ACCENT;
        ctx.shadowBlur = 8;
      } else {
        var tw = 0.8 + 0.2 * Math.sin(now * 0.002 + wd.ph);
        ctx.font = wd.size + 'px "Helvetica Neue", sans-serif';
        ctx.fillStyle = '#e4e4ea';
        ctx.globalAlpha = wd.idleOp * tw;
        ctx.shadowBlur = 0;
      }
      ctx.fillText(wd.text, dx, dy);
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    // prompt words on top
    if (state !== 'idle') {
      for (var p = 0; p < seeds.length; p++) {
        var sd3 = seeds[p];
        if (sd3.state === 'pending') continue;
        ctx.font = '700 24px "Helvetica Neue", sans-serif';
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = 1;
        ctx.shadowColor = ACCENT;
        ctx.shadowBlur = 16;
        ctx.fillText(sd3.text, sd3.x, sd3.y);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------------------------------------------------------------- boot

  function run(idx) {
    if (state !== 'idle') return;
    setChips(true);
    replyEl.closest('.reply').classList.remove('show');
    againEl.classList.remove('show');
    resetWordStates();
    started = performance.now();
    spawnWords(PROMPTS[idx], started);
    replyEl.textContent = PROMPTS[idx].reply;
    state = 'sequence';
  }

  function resetWordStates() {
    for (var i = 0; i < words.length; i++) {
      words[i].matchBy = [];
      words[i].flashT = 0;
    }
  }

  function reset() {
    state = 'idle';
    seeds = [];
    for (var i = 0; i < words.length; i++) { words[i].matchBy = []; words[i].flashT = 0; }
    document.querySelector('.reply').classList.remove('show');
    againEl.classList.remove('show');
    placeWords();                       // fresh scatter
    setChips(false);
  }

  function setChips(off) {
    var cs = document.querySelectorAll('.chip');
    for (var i = 0; i < cs.length; i++) {
      if (off) cs[i].classList.add('off'); else cs[i].classList.remove('off');
    }
  }

  function tick(ts) {
    now = ts; frame = ts;
    update();
    draw();
    requestAnimationFrame(tick);
  }

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeWordObjects();
    state = 'idle'; seeds = [];
    setChips(false);
  }

  for (var i = 0; i < PROMPTS.length; i++) {
    (function (idx) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.textContent = PROMPTS[idx].text;
      b.addEventListener('click', function () { run(idx); });
      chipsEl.appendChild(b);
    })(i);
  }
  againEl.addEventListener('click', reset);

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);

  // helpers
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist(x1, y1, x2, y2) { var dx = x1 - x2, dy = y1 - y2; return Math.sqrt(dx * dx + dy * dy); }
})();
</script>
</body>
</html>
