<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>not a lookup. a lighting-up.</title>
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #e9e9ee;
    --grey: #8e8e98;
    --dim: #40404a;
    --accent: #ffa6c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }

  .scene { position: relative; height: 100vh; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .title {
    position: absolute; top: 5.5%; left: 0; right: 0;
    text-align: center; pointer-events: none; user-select: none;
  }
  .title h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400; font-size: clamp(22px, 3.4vw, 40px);
    letter-spacing: 0.02em; line-height: 1.3; color: var(--ink);
  }
  .hint {
    margin-top: 14px; font-size: 12px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--dim);
  }

  .promptbox {
    position: absolute; bottom: 7%; left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px; padding: 0 20px;
    user-select: none;
  }
  .promptbox input {
    flex: 0 1 420px;
    font-size: 15px; letter-spacing: 0.02em; color: var(--ink);
    background: rgba(20,20,30,0.6);
    border: 1px solid var(--dim); border-radius: 999px;
    padding: 13px 22px; outline: none;
    transition: border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
  }
  .promptbox input::placeholder { color: #565662; }
  .promptbox input:focus {
    border-color: rgba(255,166,201,0.6);
    box-shadow: 0 0 0 1px rgba(255,166,201,0.25), 0 0 26px rgba(255,166,201,0.12);
  }
  .promptbox input:disabled { opacity: 0.4; }
  .promptbox button {
    font-size: 14px; letter-spacing: 0.05em; color: var(--ink);
    background: rgba(255,166,201,0.12);
    border: 1px solid rgba(255,166,201,0.4); border-radius: 999px;
    padding: 0 24px; cursor: pointer; outline: none;
    transition: background 0.3s ease, opacity 0.4s ease;
  }
  .promptbox button:hover:not([disabled]) { background: rgba(255,166,201,0.24); }
  .promptbox button:disabled, .promptbox button[disabled] { opacity: 0.35; cursor: default; }

  .reply {
    position: absolute; left: 0; right: 0; top: 62%;
    text-align: center; pointer-events: none; user-select: none;
    opacity: 0; transform: translateY(8px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .reply.show { opacity: 1; transform: translateY(0); }
  .reply p {
    display: inline-block; max-width: 640px; margin: 0 auto; padding: 16px 30px;
    font-family: Georgia, "Times New Roman", serif; font-style: italic;
    font-size: 18px; line-height: 1.7; color: var(--ink);
    background: rgba(10,10,15,0.78);
    box-shadow: 0 0 0 1px rgba(255,166,201,0.08), 0 0 60px rgba(255,166,201,0.05);
    border-radius: 6px;
  }
</style>
</head>
<body>

  <div class="scene">
    <canvas id="stage"></canvas>

    <div class="title">
      <h1>not a lookup. a lighting-up.</h1>
      <div class="hint">type a thought. watch what it finds.</div>
    </div>

    <div class="reply"><p id="replytext"></p></div>

    <div class="promptbox">
      <input id="input" type="text" placeholder="ask something..." autocomplete="off" spellcheck="false">
      <button id="submit">ask</button>
    </div>
  </div>

<script>
(function () {
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var inputEl = document.getElementById('input');
  var submitEl = document.getElementById('submit');
  var replyEl = document.getElementById('replytext');

  var ACCENT = '#ffa6c9';

  // ---------------------------------------------------------- bucket data

  var BUCKETS = {
    science: {
      keywords: ['sky', 'blue', 'light', 'colour', 'color', 'why is'],
      pool: ['rayleigh','wavelength','photon','scatter','atmosphere','spectrum','refraction','entropy','velocity'],
      responses: [
        "blue scatters more than the rest \u2014 that's the whole trick of it.",
        "shorter wavelengths bend easiest. blue just bends the most, is all.",
        "the sky isn't blue. it's just scattering blue at you loudest."
      ]
    },
    craft: {
      keywords: ['poem', 'verse', 'longing', 'write me', 'love', 'line'],
      pool: ['meter','cadence','stanza','metaphor','imagery','rhyme','silence','ink','verse'],
      responses: [
        "something with a line that means more than it says.",
        "start with an image, not a feeling. the feeling follows.",
        "one line about waiting long enough to forget what for."
      ]
    },
    myth: {
      keywords: ['arjuna', 'dharma', 'hesitate', 'krishna', 'duty', 'why did'],
      pool: ['arjuna','dharma','hesitate','duty','krishna','battlefield','conscience','karma','doubt'],
      responses: [
        "not fear. just the weight of knowing both paths are real.",
        "duty doesn't ask if you're ready. it just arrives.",
        "even certainty pauses before it becomes action."
      ]
    }
  };

  var FALLBACK = {
    responses: [
      "still forming an answer to that one.",
      "that one hasn't lit up anything yet.",
      "not every prompt finds its shape immediately."
    ]
  };

  // ---------------------------------------------------------- the field

  var FIELD = [
    { t: 'rayleigh', cl: 0 },  { t: 'wavelength', cl: 0 }, { t: 'photon', cl: 0 },
    { t: 'scatter', cl: 0 },   { t: 'atmosphere', cl: 0 }, { t: 'spectrum', cl: 0 },
    { t: 'refraction', cl: 0 },{ t: 'entropy', cl: 0 },    { t: 'velocity', cl: 0 },
    { t: 'meter', cl: 1 },     { t: 'cadence', cl: 1 },    { t: 'stanza', cl: 1 },
    { t: 'metaphor', cl: 1 },  { t: 'imagery', cl: 1 },    { t: 'rhyme', cl: 1 },
    { t: 'silence', cl: 1 },   { t: 'ink', cl: 1 },        { t: 'verse', cl: 1 },
    { t: 'arjuna', cl: 2 },    { t: 'dharma', cl: 2 },     { t: 'hesitate', cl: 2 },
    { t: 'duty', cl: 2 },      { t: 'krishna', cl: 2 },    { t: 'battlefield', cl: 2 },
    { t: 'conscience', cl: 2 },{ t: 'karma', cl: 2 },      { t: 'doubt', cl: 2 },
    { t: 'indigo', cl: -1 },   { t: 'static', cl: -1 },    { t: 'thunder', cl: -1 },
    { t: 'lotus', cl: -1 },    { t: 'recursion', cl: -1 }, { t: 'horizon', cl: -1 },
    { t: 'quartz', cl: -1 },   { t: 'mirror', cl: -1 },    { t: 'pulse', cl: -1 },
    { t: 'tide', cl: -1 },     { t: 'fracture', cl: -1 },  { t: 'orbit', cl: -1 },
    { t: 'whisper', cl: -1 },  { t: 'carnatic', cl: -1 },  { t: 'velvet', cl: -1 },
    { t: 'echo', cl: -1 }
  ];

  var words = [];
  var wordIndex = {};
  var W, H, DPR;
  var now = 0, frame = 0;
  var state = 'idle';       // idle | sequence | answered | settling
  var seeds = [];
  var started = 0;
  var fallback = false;

  // ------------------------------------------------------------ build

  function makeWordObjects() {
    words = [];
    wordIndex = {};
    for (var i = 0; i < FIELD.length; i++) {
      var w = {
        text: FIELD[i].t,
        size: rand(10, 22),
        idleOp: rand(0.2, 0.5),
        cl: FIELD[i].cl,
        x: 0, y: 0,
        dp: rand(0, Math.PI * 2),
        ph: rand(0, Math.PI * 2),
        drift: rand(1.5, 6),
        matchBy: [],
        flashT: 0,
        drain: 0,
        dims: null
      };
      words.push(w);
      wordIndex[w.text] = i;
    }
    placeWords();
  }

  function placeWords() {
    var pockets = [
      { x: W * 0.27, y: H * 0.42, r: 150 },  // science
      { x: W * 0.72, y: H * 0.52, r: 150 },  // craft
      { x: W * 0.5,  y: H * 0.76, r: 150 }   // myth
    ];
    var rects = [];
    ctx.save();
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      ctx.font = w.size + 'px "Helvetica Neue", sans-serif';
      var twid = ctx.measureText(w.text).width + 14;
      var thgt = w.size * 1.6;
      var cx, cy, ok = false;
      for (var att = 0; att < 600 && !ok; att++) {
        if (w.cl >= 0) {
          var pc = pockets[w.cl];
          cx = pc.x + (gauss() * pc.r) * 0.55;
          cy = pc.y + (gauss() * pc.r) * 0.55;
        } else {
          cx = rand(0.03, 0.97) * W;
          cy = rand(0.13, 0.95) * H;
        }
        cx = clamp(cx, 30, W - 30);
        cy = clamp(cy, 40, H - 34);
        ok = true;
        for (var q = 0; q < rects.length; q++) {
          var rr = rects[q];
          if (cx + twid / 2 > rr.x - rr.w / 2 - 8 &&
              cx - twid / 2 < rr.x + rr.w / 2 + 8 &&
              cy + thgt / 2 > rr.y - rr.h / 2 - 8 &&
              cy - thgt / 2 < rr.y + rr.h / 2 + 8) { ok = false; break; }
        }
      }
      w.x = cx; w.y = cy;
      w.dims = { x: cx, y: cy, w: twid, h: thgt };
      rects.push(w.dims);
    }
    ctx.restore();
  }

  function gauss() {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ------------------------------------------------------- matching

  function detect(text) {
    var t = text.toLowerCase();
    var keys = ['science', 'craft', 'myth'];
    for (var i = 0; i < keys.length; i++) {
      var kws = BUCKETS[keys[i]].keywords;
      for (var j = 0; j < kws.length; j++) {
        if (t.indexOf(kws[j]) >= 0) return keys[i];
      }
    }
    return null;
  }

  function sample(arr, min, max) {
    var n = min + Math.floor(Math.random() * (max - min + 1));
    var pool = arr.slice();
    var out = [];
    while (out.length < n && pool.length) {
      var i = Math.floor(Math.random() * pool.length);
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  }

  // ----------------------------------------------------------- submit

  function run() {
    if (state !== 'idle') return;
    var text = inputEl.value.trim();
    if (!text) return;

    setBox(true);
    replyEl.closest('.reply').classList.remove('show');

    var bucket = detect(text);
    fallback = bucket === null;
    var replyLines = fallback ? FALLBACK.responses : BUCKETS[bucket].responses;
    var reply = replyLines[Math.floor(Math.random() * replyLines.length)];

    // matched words: random 5-6 from that bucket pool, or none
    var matched = [];
    if (!fallback) {
      matched = sample(BUCKETS[bucket].pool, 5, 6).map(function (t) { return wordIndex[t]; });
    }

    // prompt words from the typed text (up to 6)
    var promptWords = text.toLowerCase().split(/\s+/).filter(function (s) { return s.length; }).slice(0, 6);
    if (!promptWords.length) promptWords = [bucket || 'hmm'];

    var t0 = performance.now();
    spawnWords(promptWords, matched, t0);
    replyEl.textContent = reply;
    inputEl.value = '';

    state = 'sequence';
  }

  function spawnWords(promptWords, matched, t0) {
    seeds = [];
    var n = promptWords.length;

    // assign each matched word to a prompt word (mostly one, sometimes two)
    var seedTargets = [];
    for (var s = 0; s < n; s++) seedTargets.push([]);
    for (var m = 0; m < matched.length; m++) {
      var prim = Math.floor(Math.random() * n);
      seedTargets[prim].push(matched[m]);
      if (Math.random() < 0.5) {
        var sec = Math.floor(Math.random() * n);
        if (sec !== prim) seedTargets[sec].push(matched[m]);
      }
    }

    for (var i = 0; i < n; i++) {
      var targets = seedTargets[i];
      // decoys: words near the seed's x that aren't targets — near-misses
      var decoys = [];
      var nt = 4 + Math.floor(Math.random() * 3);
      var tries = 0;
      while (decoys.length < nt && tries < 80) {
        tries++;
        var wi = Math.floor(Math.random() * words.length);
        if (targets.indexOf(wi) >= 0 || decoys.indexOf(wi) >= 0) continue;
        if (Math.abs(words[wi].x - W * (0.2 + i * (0.6 / (n > 1 ? n - 1 : 1)))) > W * 0.5) continue;
        decoys.push(wi);
      }
      seeds.push({
        idx: i,
        text: promptWords[i],
        x: W * (0.2 + i * (0.6 / (n > 1 ? n - 1 : 1))) + rand(-20, 20),
        y: -30,
        ty: H * (0.2 + (i % 2) * 0.06),
        spawned: t0 + 150 * i,
        state: 'pending',
        stateAt: 0,
        testDelay: 300 + 120 * (i % 3),
        testStart: 0,
        targets: targets,
        decoys: decoys,
        probes: [],
        doneAt: 0
      });
    }
  }

  // ----------------------------------------------------------- updates

  function update() {
    if (state === 'sequence') updateSequence();
    else if (state === 'answered') {
      if (now - answeredAt > 4000) {
        state = 'settling';
        settleStart = now;
        document.querySelector('.reply').classList.remove('show');
        for (var i = 0; i < words.length; i++) words[i].drain = 1;
      }
    } else if (state === 'settling') {
      var done = true;
      for (var j = 0; j < words.length; j++) {
        if (words[j].drain > 0) {
          words[j].drain -= 0.016;
          done = false;
        }
      }
      if (done) {
        state = 'idle';
        seeds = [];
        for (var k = 0; k < words.length; k++) { words[k].matchBy = []; words[k].drain = 0; }
        setBox(false);
      }
    }
  }

  var answeredAt = 0;
  var settleStart = 0;

  function updateSequence() {
    var allDone = true;
    for (var i = 0; i < seeds.length; i++) {
      var s = seeds[i];
      if (s.state === 'pending' && now >= s.spawned) { s.state = 'falling'; s.vy = rand(0.5, 0.7); }
      if (s.state === 'falling') {
        s.vy += 0.004;
        s.y += s.vy;
        if (s.y >= s.ty) { s.y = s.ty; s.state = 'landed'; s.stateAt = now; }
      }
      if (s.state === 'landed' && now >= s.stateAt + s.testDelay) {
        s.state = 'testing';
        s.testStart = now;
        var probes = [];
        for (var t = 0; t < s.targets.length; t++) {
          probes.push({ wi: s.targets[t], catch: true, p: 0, resolved: false });
        }
        for (var d = 0; d < s.decoys.length; d++) {
          probes.push({ wi: s.decoys[d], catch: false, p: 0, resolved: false });
        }
        s.probes = probes;
      }
      if (s.state === 'testing') {
        var done = 0;
        for (var j = 0; j < s.probes.length; j++) {
          var pr = s.probes[j];
          var wp = words[pr.wi];
          pr.p = clamp((now - s.testStart - j * 70) / 280, 0, 1);
          if (pr.p >= 0.9 && !pr.resolved) {
            pr.resolved = true;
            wp.flashT = 1;
            if (pr.catch && wp.matchBy.indexOf(s.idx) < 0) wp.matchBy.push(s.idx);
          }
          if (pr.resolved) done++;
        }
        if (done === s.probes.length) { s.state = 'done'; s.doneAt = now; }
      }
      if (s.state !== 'done') allDone = false;
    }

    if (allDone) {
      var last = 0;
      for (var m = 0; m < seeds.length; m++) last = Math.max(last, seeds[m].doneAt);
      if (now - last > 900) {
        state = 'answered';
        answeredAt = now;
        setTimeout(function () {
          document.querySelector('.reply').classList.add('show');
        }, 150);
      }
    }
  }

  // ------------------------------------------------------------- draw

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (var w = 0; w < words.length; w++) {
      if (words[w].flashT > 0) words[w].flashT -= 0.02;
    }

    var updateDim = function () {
      var m = 0;
      for (var di = 0; di < words.length; di++) {
        if (words[di].drain > m) m = words[di].drain;
      }
      return 1 - m * 0.85;
    };
    for (var s = 0; s < seeds.length; s++) {
      var sd = seeds[s];
      if (sd.state !== 'testing' && sd.state !== 'done') continue;
      for (var j = 0; j < sd.probes.length; j++) {
        var pr = sd.probes[j];
        if (!pr.resolved || !pr.catch) continue;
        var wp = words[pr.wi];
        var bright = wp.matchBy.length >= 2;
        ctx.strokeStyle = bright ? 'rgba(255,166,201,' + (0.95 * updateDim()) + ')' : 'rgba(255,166,201,' + (0.4 * updateDim()) + ')';
        ctx.lineWidth = bright ? 2.2 : 1.1;
        ctx.beginPath();
        ctx.moveTo(sd.x, sd.y);
        ctx.lineTo(wp.x, wp.y);
        ctx.stroke();
      }
    }

    // un-resolved sweep rays
    for (var s2 = 0; s2 < seeds.length; s2++) {
      var sd2 = seeds[s2];
      if (sd2.state !== 'testing') continue;
      for (var j2 = 0; j2 < sd2.probes.length; j2++) {
        var pr2 = sd2.probes[j2];
        if (pr2.resolved) continue;
        var wp2 = words[pr2.wi];
        var ang = Math.atan2(wp2.y - sd2.y, wp2.x - sd2.x);
        var len = pr2.p * dist(sd2.x, sd2.y, wp2.x, wp2.y);
        ctx.strokeStyle = 'rgba(255,166,201,' + (0.3 * Math.sin(pr2.p * Math.PI) + 0.05) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sd2.x, sd2.y);
        ctx.lineTo(sd2.x + Math.cos(ang) * len, sd2.y + Math.sin(ang) * len);
        ctx.stroke();
      }
    }

    // field words
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var k = 0; k < words.length; k++) {
      var wd = words[k];
      var dx = wd.x + Math.sin(frame * 0.005 + wd.dp) * wd.drift;
      var dy = wd.y + Math.cos(frame * 0.004 + wd.dp * 1.3) * wd.drift;

      var lit = wd.matchBy.length > 0;
      var bright = wd.matchBy.length >= 2;
      var drainDim = wd.drain > 0 ? (1 - wd.drain) : 1;

      if (lit || wd.drain > 0) {
        var scale = bright ? 1.3 : 1.2;
        var op = (0.55 + Math.min(1, wd.flashT) * 0.45) * drainDim;
        ctx.font = (wd.size * scale) + 'px "Helvetica Neue", sans-serif';
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = clamp(op, 0.05, 1);
        ctx.shadowColor = ACCENT;
        ctx.shadowBlur = bright ? 18 : 10;
      } else if (wd.flashT > 0) {
        ctx.font = wd.size + 'px "Helvetica Neue", sans-serif';
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = wd.flashT * 0.6;
        ctx.shadowColor = ACCENT;
        ctx.shadowBlur = 8;
      } else {
        var tw = 0.8 + 0.2 * Math.sin(now * 0.002 + wd.ph);
        ctx.font = wd.size + 'px "Helvetica Neue", sans-serif';
        ctx.fillStyle = '#e4e4ea';
        ctx.globalAlpha = wd.idleOp * tw;
        ctx.shadowBlur = 0;
      }
      ctx.fillText(wd.text, dx, dy);
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    // prompt words
    if (state !== 'idle') {
      for (var p = 0; p < seeds.length; p++) {
        var pd = seeds[p];
        if (pd.state === 'pending') continue;
        ctx.font = '700 24px "Helvetica Neue", sans-serif';
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = 1;
        ctx.shadowColor = ACCENT;
        ctx.shadowBlur = 16;
        ctx.fillText(pd.text, pd.x, pd.y);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }
  }

  // ------------------------------------------------------------- boot

  function setBox(off) {
    inputEl.disabled = off ? true : false;
    submitEl.disabled = off ? true : false;
    if (off) inputEl.blur();
  }

  function submit() {
    run();
    inputEl.focus();
  }

  submitEl.addEventListener('click', submit);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submit();
  });

  function tick(ts) {
    now = ts; frame = ts;
    update();
    draw();
    requestAnimationFrame(tick);
  }

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeWordObjects();
    state = 'idle'; seeds = [];
    document.querySelector('.reply').classList.remove('show');
    setBox(false);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);

  // helpers
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist(x1, y1, x2, y2) { var dx = x1 - x2, dy = y1 - y2; return Math.sqrt(dx * dx + dy * dy); }
})();
</script>
</body>
</html>
