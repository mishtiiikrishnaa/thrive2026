<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>type something and watch what connects</title>
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #e9e9ee;
    --grey: #8e8e98;
    --dim: #40404a;
    --accent: #ffa6c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }

  .scene { position: relative; height: 100vh; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .title {
    position: absolute; top: 6%; left: 0; right: 0;
    text-align: center; pointer-events: none; user-select: none;
  }
  .title h1 {
    font-weight: 500; font-size: clamp(18px, 2.6vw, 30px);
    letter-spacing: 0.04em; line-height: 1.4; color: var(--ink);
  }
  .hint {
    margin-top: 12px; font-size: 11px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--dim);
  }

  .promptbox {
    position: absolute; bottom: 6%; left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px; padding: 0 20px;
    user-select: none;
  }
  .promptbox input {
    flex: 0 1 420px;
    font-size: 15px; letter-spacing: 0.02em; color: var(--ink);
    background: rgba(20,20,30,0.6);
    border: 1px solid var(--dim); border-radius: 999px;
    padding: 13px 22px; outline: none;
    transition: border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
  }
  .promptbox input::placeholder { color: #565662; }
  .promptbox input:focus {
    border-color: rgba(255,166,201,0.6);
    box-shadow: 0 0 0 1px rgba(255,166,201,0.25), 0 0 26px rgba(255,166,201,0.12);
  }
  .promptbox input:disabled { opacity: 0.4; }
  .promptbox button {
    font-size: 14px; letter-spacing: 0.05em; color: var(--ink);
    background: rgba(255,166,201,0.12);
    border: 1px solid rgba(255,166,201,0.4); border-radius: 999px;
    padding: 0 24px; cursor: pointer; outline: none;
    transition: background 0.3s ease, opacity 0.4s ease;
  }
  .promptbox button:hover:not([disabled]) { background: rgba(255,166,201,0.24); }
  .promptbox button[disabled] { opacity: 0.35; cursor: default; }

  .reply {
    position: absolute; left: 0; right: 0; bottom: 19%;
    text-align: center; pointer-events: none; user-select: none;
    opacity: 0; transform: translateY(8px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .reply.show { opacity: 1; transform: translateY(0); }
  .reply p {
    display: inline-block; max-width: 660px; margin: 0 auto;
    padding: 14px 26px; font-size: 15px; line-height: 1.75; color: var(--ink);
    background: rgba(10,10,15,0.82);
    box-shadow: 0 0 0 1px rgba(255,166,201,0.08), 0 0 60px rgba(255,166,201,0.05);
    border-radius: 6px;
  }
</style>
</head>
<body>

  <div class="scene">
    <canvas id="stage"></canvas>

    <div class="title">
      <h1>type something and watch what connects.</h1>
      <div class="hint">a prompt fires a fact, the fact fires the next</div>
    </div>

    <div class="reply"><p id="replytext"></p></div>

    <div class="promptbox">
      <input id="input" type="text" placeholder="ask something..." autocomplete="off" spellcheck="false">
      <button id="submit">ask</button>
    </div>
  </div>

<script>
(function () {
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var inputEl = document.getElementById('input');
  var submitEl = document.getElementById('submit');
  var replyEl = document.getElementById('replytext');

  var ACCENT = '#ffa6c9';
  var GREY = '#e4e4ea';
  var PULSE_DUR = 430;

  // ----------------------------------------------------------- chains

  var CHAINS = {
    science: {
      keywords: ['sky', 'blue', 'light', 'colour', 'color'],
      facts: [
        ['the sky looks blue during the day.', 1],
        ['sunlight is made of many colors mixed together.', 1],
        ['each color of light travels at a different wavelength.', 1],
        ['blue light has a shorter wavelength than red light.', 2],
        ['short wavelengths scatter more off small particles.', 2],
        ['the atmosphere is full of tiny gas molecules.', 2],
        ['this scattering effect is called rayleigh scattering.', 3]
      ],
      responses: [
        "blue light has the shortest wavelength, so it scatters the most off gas molecules in the atmosphere — that's called rayleigh scattering, and it's why the sky looks blue.",
        "the sky looks blue because short wavelengths of light scatter more than the rest when they hit the atmosphere — this is rayleigh scattering."
      ]
    },
    craft: {
      keywords: ['poem', 'verse', 'haiku', 'rhyme', 'line', 'write me'],
      facts: [
        ['a poem is writing arranged in lines.', 1],
        ['many poems use rhythm or rhyme to shape their lines.', 1],
        ['a haiku is a short poem with a fixed structure.', 1],
        ['a haiku has three lines.', 2],
        ['the first line of a haiku usually has five syllables.', 2],
        ["free verse doesn't follow a fixed rhyme or rhythm.", 2],
        ['line breaks control how a reader pauses while reading.', 3]
      ],
      responses: [
        'a poem is shaped by its line breaks — a haiku fixes that into three lines, free verse uses it more loosely to control pacing instead of rhyme.',
        'poems are built from lines, not just words — some forms like haiku fix the structure tightly, others let it stay loose.'
      ]
    },
    myth: {
      keywords: ['arjuna', 'dharma', 'krishna', 'duty', 'hesitate'],
      facts: [
        ['arjuna is a warrior in the mahabharata.', 1],
        ['arjuna hesitates before the battle of kurukshetra.', 1],
        ['he sees his own relatives on the enemy side.', 1],
        ["krishna is arjuna's charioteer and guide.", 2],
        ['krishna tells arjuna that fighting is his duty as a warrior.', 2],
        ['this idea of duty is called dharma.', 2],
        ['avoiding a duty can cause more harm than doing it.', 3]
      ],
      responses: [
        "arjuna hesitates to fight his own relatives, so krishna tells him fighting is his dharma as a warrior, and avoiding it would cause more harm than doing it.",
        'before the battle, arjuna doubts fighting his own family — krishna\'s answer is that skipping his duty would do more harm than fulfilling it.'
      ]
    }
  };

  var FALLBACK = {
    responses: [
      'no chain fired for that one yet.',
      'that prompt doesn\u2019t connect to anything here.'
    ]
  };

  // ----------------------------------------------------------- nodes

  var nodes = [];
  var W, H, DPR;
  var W2, H2, glowCanvas, gctx;
  var now = 0, frame = 0;
  var state = 'idle';
  var promptNode = null;
  var edges = [];
  var litEdges = [];
  var t0 = 0;
  var answerAt = 0;
  var settleStart = 0;

  var motes = [];
  var filaments = [];
  var firedList = [];

  function linkCP(a, b) {
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var amt = Math.min(len * 0.14, 40);
    var side = (a.x + b.y > W / 2) ? 1 : -1;
    return { x: mx + (-dy / len) * amt * side, y: my + (dx / len) * amt * side };
  }

  function bezierAt(a, cp, b, t) {
    var it = 1 - t;
    return {
      x: it * it * a.x + 2 * it * t * cp.x + t * t * b.x,
      y: it * it * a.y + 2 * it * t * cp.y + t * t * b.y
    };
  }

  function strokeLink(a, cp, b, color, width, c) {
    c = c || ctx;
    c.beginPath();
    c.moveTo(a.x, a.y);
    c.quadraticCurveTo(cp.x, cp.y, b.x, b.y);
    c.lineWidth = width;
    c.strokeStyle = color;
    c.stroke();
  }

  function lerpColor(alpha) {
    return 'rgba(255,166,201,' + alpha.toFixed(3) + ')';
  }

  // ----------------------------------------------------------- build

  function buildNodes() {
    nodes = [];
    var keys = Object.keys(CHAINS);
    var pocket = { science: [W * 0.27, H * 0.44], craft: [W * 0.72, H * 0.52], myth: [W * 0.5, H * 0.78] };
    var rects = [];
    for (var c = 0; c < keys.length; c++) {
      var chain = keys[c];
      var facts = CHAINS[chain].facts;
      for (var f = 0; f < facts.length; f++) {
        var text = facts[f][0];
        var hop = facts[f][1];
        var node = {
          text: text, chain: chain, hop: hop,
          x: 0, y: 0, w: 0, h: 0,
          fired: false, flashT: 0, drain: 0,
          charge: 0,
          trem: rand(0, Math.PI * 2),
          glowph: rand(0, Math.PI * 2),
          sparkT: rand(800, 6000),
          sparkF: 0
        };
        ctx.font = '12px "Helvetica Neue", sans-serif';
        node.w = ctx.measureText(text).width + 24;
        node.h = 24;
        var px = pocket[chain][0] + (gauss() * 170) * 0.6;
        var py = pocket[chain][1] + (gauss() * 150) * (hop === 3 ? 1.1 : 0.5);
        var ok = false;
        for (var att = 0; att < 700 && !ok; att++) {
          if (att > 0) {
            px = pocket[chain][0] + (gauss() * 170) * 0.6;
            py = pocket[chain][1] + (gauss() * 150) * (hop === 3 ? 1.1 : 0.5);
          }
          px = clamp(px, node.w / 2 + 14, W - node.w / 2 - 14);
          py = clamp(py, node.h / 2 + 52, H - node.h / 2 - 40);
          ok = true;
          for (var q = 0; q < rects.length; q++) {
            var rr = rects[q];
            if (px + node.w / 2 > rr.x - rr.w / 2 - 10 &&
                px - node.w / 2 < rr.x + rr.w / 2 + 10 &&
                py + node.h / 2 > rr.y - rr.h / 2 - 10 &&
                py - node.h / 2 < rr.y + rr.h / 2 + 10) { ok = false; break; }
          }
        }
        node.x = px; node.y = py;
        rects.push({ x: px, y: py, w: node.w, h: node.h });
        nodes.push(node);
      }
    }
    buildFilaments();
  }

  function buildFilaments() {
    filaments = [];
    var seen = {};
    for (var i = 0; i < nodes.length; i++) {
      var a = nodes[i];
      var near = nodes.map(function (n, idx) {
        return { n: n, d: dist(a.x, a.y, n.x, n.y), idx: idx };
      }).filter(function (o) { return o.idx !== i; })
        .sort(function (p, q) { return p.d - q.d; }).slice(0, 3);
      for (var j = 0; j < near.length; j++) {
        var keyi = Math.min(i, near[j].idx), keyj = Math.max(i, near[j].idx);
        var key = keyi + '_' + keyj;
        if (seen[key]) continue;
        seen[key] = true;
        filaments.push({ a: a, b: near[j].n, cp: linkCP(a, near[j].n) });
      }
    }
  }

  function buildMotes() {
    motes = [];
    for (var i = 0; i < 60; i++) {
      motes.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(0.6, 2.0),
        ph: rand(0, Math.PI * 2),
        vx: rand(-0.1, 0.1),
        vy: rand(-0.08, 0.08),
        pink: Math.random() < 0.3,
        swirl: rand(-0.006, 0.006)
      });
    }
  }

  function buildGlow() {
    W2 = Math.max(2, Math.round(W / 2));
    H2 = Math.max(2, Math.round(H / 2));
    if (!glowCanvas) glowCanvas = document.createElement('canvas');
    glowCanvas.width = W2;
    glowCanvas.height = H2;
    gctx = glowCanvas.getContext('2d');
  }

  function gauss() {
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ----------------------------------------------------------- submit

  function detect(text) {
    var t = text.toLowerCase();
    var keys = ['science', 'craft', 'myth'];
    for (var i = 0; i < keys.length; i++) {
      for (var j = 0; j < CHAINS[keys[i]].keywords.length; j++) {
        if (t.indexOf(CHAINS[keys[i]].keywords[j]) >= 0) return keys[i];
      }
    }
    return null;
  }

  function nodeByChain(chain, i) {
    var res = [];
    for (var j = 0; j < nodes.length; j++) {
      var n = nodes[j];
      if (n.chain === chain) res.push(n);
    }
    return res[i];
  }

  function mkPromptNode(text) {
    var n = { text: text, x: W / 2, y: H * 0.16, w: 0, h: 22, fired: true, flashT: 1, drain: 0, charge: 1.4, trem: 0, glowph: 0, sparkT: 0, sparkF: 0 };
    ctx.font = '700 13px "Helvetica Neue", sans-serif';
    n.w = ctx.measureText(text).width + 30;
    return n;
  }

  function runChain(chain, text) {
    var H1 = [0, 1, 2].map(function (i) { return nodeByChain(chain, i); });
    var hop2Pool = [3, 4, 5].slice().sort(function () { return Math.random() - 0.5; }).slice(0, 2);
    var H2 = hop2Pool.map(function (i) { return nodeByChain(chain, i); });
    var H3 = nodeByChain(chain, 6);

    promptNode = mkPromptNode(text);
    edges = []; litEdges = [];

    for (var i = 0; i < 3; i++) {
      edges.push({ a: promptNode, b: H1[i], cp: linkCP(promptNode, H1[i]), start: t0 + 260 + i * 150, dur: PULSE_DUR, fire: true });
    }
    var t1 = t0 + 260 + 2 * 150 + PULSE_DUR + 600;
    for (var k = 0; k < H2.length; k++) {
      for (var j = 0; j < 3; j++) {
        edges.push({ a: H1[j], b: H2[k], cp: linkCP(H1[j], H2[k]), start: t1 + k * 160, dur: PULSE_DUR, fire: true });
      }
    }
    var t2 = t1 + (H2.length - 1) * 160 + PULSE_DUR + 600;
    for (var h = 0; h < H2.length; h++) {
      edges.push({ a: H2[h], b: H3, cp: linkCP(H2[h], H3), start: t2 + h * 120, dur: PULSE_DUR, fire: true });
    }
    var t3 = t2 + (H2.length - 1) * 120 + PULSE_DUR;
    replyEl.textContent = CHAINS[chain].responses[Math.floor(Math.random() * CHAINS[chain].responses.length)];
    setTimeout(function () {
      answerAt = performance.now();
      state = 'answered';
      setTimeout(function () { document.querySelector('.reply').classList.add('show'); }, 200);
    }, (t3 - t0));
  }

  function runFallback(text) {
    promptNode = mkPromptNode(text);
    promptNode.fired = false;
    promptNode.charge = 0.6;

    edges = []; litEdges = [];
    var fizz = [];
    for (var i = 0; i < 7; i++) {
      var n = nodes[Math.floor(Math.random() * nodes.length)];
      if (fizz.indexOf(n) < 0) fizz.push(n);
    }
    for (var j = 0; j < fizz.length; j++) {
      edges.push({ a: promptNode, b: fizz[j], cp: linkCP(promptNode, fizz[j]), start: t0 + 300 + j * 240, dur: PULSE_DUR * 0.9, fire: false });
    }
    var lastEnd = t0 + 300 + (fizz.length - 1) * 240 + PULSE_DUR * 0.9;
    replyEl.textContent = FALLBACK.responses[Math.floor(Math.random() * FALLBACK.responses.length)];
    setTimeout(function () {
      answerAt = performance.now();
      state = 'answered';
      setTimeout(function () { document.querySelector('.reply').classList.add('show'); }, 200);
    }, (lastEnd - t0));
  }

  function run() {
    if (state !== 'idle') return;
    var text = inputEl.value.trim();
    if (!text) return;
    setBox(true);
    document.querySelector('.reply').classList.remove('show');
    for (var i = 0; i < nodes.length; i++) { nodes[i].fired = false; nodes[i].flashT = 0; nodes[i].drain = 0; nodes[i].charge = 0; }
    var chain = detect(text);
    t0 = performance.now();
    if (chain) runChain(chain, text);
    else runFallback(text);
    inputEl.value = '';
    state = 'running';
  }

  // ----------------------------------------------------------- update

  function update() {
    // the organism is always alive: charge leaks away, sparks fire
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      n.charge *= 0.972;
      if (n.sparkF > 0) n.sparkF -= 0.025;
      if (n.sparkT > 0) {
        n.sparkT -= 16.7;
        if (n.sparkT <= 0) {
          n.sparkT = rand(2600, 7200);
          if (n.sparkF <= 0) n.sparkF = 1;
        }
      }
    }
    if (promptNode) promptNode.charge *= 0.992;
    // lit energy cools toward a resting hum
    for (var e = 0; e < litEdges.length; e++) {
      litEdges[e].energy = Math.max((litEdges[e].energy || 1) - 0.0022, litEdges[e].fire ? 0.4 : 0.1);
    }

    if (state === 'running') updateEdges();
    else if (state === 'answered') {
      if (now - answerAt > 4000) {
        state = 'settling';
        settleStart = now;
        document.querySelector('.reply').classList.remove('show');
        for (var j = 0; j < nodes.length; j++) nodes[j].drain = 1;
        if (promptNode) promptNode.drain = 1;
      }
    } else if (state === 'settling') {
      var done = true;
      var decay = (now - settleStart) / 950;
      for (var k = 0; k < nodes.length; k++) {
        if (nodes[k].drain > 0) {
          nodes[k].drain = Math.max(0, 1 - decay);
          if (nodes[k].drain !== 0) done = false;
        }
      }
      if (done) {
        state = 'idle';
        nodes.forEach(function (nd) { nd.fired = false; nd.drain = 0; nd.flashT = 0; nd.charge = 0; });
        promptNode = null; edges = []; litEdges = [];
        setBox(false);
      }
    }
  }

  function updateEdges() {
    for (var k = edges.length - 1; k >= 0; k--) {
      var e = edges[k];
      if (now >= e.start + e.dur) {
        if (e.fire) {
          if (!e.b.fired) { e.b.fired = true; e.b.flashT = 1; e.b.sparkF = 0; }
          e.b.charge = Math.min(2.4, e.b.charge + 1.5);
        }
        litEdges.push({ a: e.a, b: e.b, cp: e.cp, fire: e.fire, energy: 1 });
        edges.splice(k, 1);
      }
    }
  }

  // ----------------------------------------------------------- draw

  function roundRect(x, y, w, h, r) {
    r = r || h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var breath = now * 0.0012;

    // decay flashes
    for (var di = 0; di < nodes.length; di++) if (nodes[di].flashT > 0) nodes[di].flashT -= 0.03;
    if (promptNode && promptNode.flashT > 0) promptNode.flashT -= 0.03;

    // update live positions: quiver
    for (var qi = 0; qi < nodes.length; qi++) {
      var qn = nodes[qi];
      var ampv = qn.fired ? 2.8 : 1.2;
      qn.qx = qn.x + Math.sin(frame * 0.005 + qn.trem) * ampv;
      qn.qy = qn.y + Math.cos(frame * 0.006 + qn.trem * 1.7) * ampv;
      if (qn.fired) firedList.push(qn);
    }

    var dmax = 0;
    for (var d = 0; d < nodes.length; d++) if (nodes[d].drain > dmax) dmax = nodes[d].drain;
    var drainAll = 1 - dmax * 0.92;

    // breathing ambient glow
    var throb = 0.5 + 0.5 * Math.sin(breath);
    var bg = ctx.createRadialGradient(W / 2, H * 0.6, 0, W / 2, H * 0.6, H * 0.9);
    bg.addColorStop(0, lerpColor(0.012 + 0.018 * throb));
    bg.addColorStop(0.55, lerpColor(0.004 + 0.004 * throb));
    bg.addColorStop(1, 'rgba(255,166,201,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ---- energy layer: all pink light goes here, bloomed back
    gctx.setTransform(W2 / W, 0, 0, H2 / H, 0, 0);
    gctx.clearRect(0, 0, W, H);
    gctx.lineCap = 'round';

    // lit axon energy
    for (var le = 0; le < litEdges.length; le++) {
      var le2 = litEdges[le];
      var en = le2.energy * drainAll;
      strokeLink(le2.a, le2.cp, le2.b, lerpColor(0.5 * en), 3 + 7 * en, gctx);
    }
    // travelling impulses
    for (var pe = 0; pe < edges.length; pe++) {
      var e2 = edges[pe];
      if (now < e2.start) continue;
      var pr2 = Math.min(1.08, (now - e2.start) / e2.dur);
      var pos2 = bezierAt(e2.a, e2.cp, e2.b, pr2);
      var amp2 = e2.fire ? 1 : 0.3;
      var gg = gctx.createRadialGradient(pos2.x, pos2.y, 0, pos2.x, pos2.y, 14);
      gg.addColorStop(0, lerpColor(0.8 * amp2 * drainAll));
      gg.addColorStop(1, 'rgba(255,166,201,0)');
      gctx.fillStyle = gg;
      gctx.beginPath();
      gctx.arc(pos2.x, pos2.y, 14, 0, Math.PI * 2);
      gctx.fill();
    }
    // node energy
    for (var ne = 0; ne < nodes.length; ne++) {
      var nd = nodes[ne];
      var ch = Math.min(1, nd.charge) * ndrain(nd) * (nd.fired ? 1 : 0);
      if (ch > 0.02) {
        var rg = gctx.createRadialGradient(nd.qx, nd.qy, 0, nd.qx, nd.qy, 14 + 22 * ch);
        rg.addColorStop(0, lerpColor(0.42 * ch + Math.min(1, nd.flashT) * 0.3));
        rg.addColorStop(1, 'rgba(255,166,201,0)');
        gctx.fillStyle = rg;
        gctx.beginPath();
        gctx.arc(nd.qx, nd.qy, 14 + 22 * ch, 0, Math.PI * 2);
        gctx.fill();
      } else if (nd.sparkF > 0) {
        var sgg = gctx.createRadialGradient(nd.qx, nd.qy, 0, nd.qx, nd.qy, 16);
        sgg.addColorStop(0, lerpColor(0.18 * nd.sparkF));
        sgg.addColorStop(1, 'rgba(255,166,201,0)');
        gctx.fillStyle = sgg;
        gctx.beginPath();
        gctx.arc(nd.qx, nd.qy, 16, 0, Math.PI * 2);
        gctx.fill();
      }
    }
    // prompt energy
    if (promptNode) {
      var pnp = promptNode;
      var ppd = pnp.drain > 0 ? (1 - pnp.drain) : 1;
      var pg = gctx.createRadialGradient(pnp.x, pnp.y, 0, pnp.x, pnp.y, 36);
      pg.addColorStop(0, lerpColor(0.4 * ppd));
      pg.addColorStop(1, 'rgba(255,166,201,0)');
      gctx.fillStyle = pg;
      gctx.beginPath();
      gctx.arc(pnp.x, pnp.y, 36, 0, Math.PI * 2);
      gctx.fill();
    }

    // bloom composite — the mish soft-glow pass
    ctx.filter = 'blur(2.5px)';
    ctx.globalAlpha = 0.5;
    ctx.drawImage(glowCanvas, 0, 0, W, H);
    ctx.filter = 'blur(9px)';
    ctx.globalAlpha = 0.4;
    ctx.drawImage(glowCanvas, 0, 0, W, H);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;

    // ---- drifting motes: they curl with the field and lean toward lit cells
    var cx = W / 2, cy = H * 0.6;
    for (var m = 0; m < motes.length; m++) {
      var mo = motes[m];
      // gentle swirl around the field's core
      var sc = Math.cos(mo.swirl), ss = Math.sin(mo.swirl);
      var nvx = mo.vx * sc - mo.vy * ss;
      mo.vy = mo.vx * ss + mo.vy * sc;
      mo.vx = nvx;
      // weak pull toward whatever is currently firing
      if (firedList.length) {
        var near = nearestOf(firedList, mo.x, mo.y);
        var pdx = near.qx - mo.x, pdy = near.qy - mo.y;
        var dl = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
        var pull = 3400 / (dl * dl + 4000);
        mo.vx += (pdx / dl) * pull * 0.5;
        mo.vy += (pdy / dl) * pull * 0.5;
      }
      mo.x += mo.vx; mo.y += mo.vy;
      if (mo.x < -4) mo.x = W + 4; else if (mo.x > W + 4) mo.x = -4;
      if (mo.y < -4) mo.y = H + 4; else if (mo.y > H + 4) mo.y = -4;
      var tw = 0.5 + 0.5 * Math.sin(now * 0.001 + mo.ph);
      ctx.globalAlpha = 0.04 + 0.07 * tw;
      ctx.fillStyle = mo.pink ? ACCENT : GREY;
      ctx.beginPath();
      ctx.arc(mo.x, mo.y, mo.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- dendritic filaments, faint rest-state wiring
    for (var f = 0; f < filaments.length; f++) {
      var fi = filaments[f];
      var endFired = fi.a.fired || fi.b.fired;
      var base = endFired
        ? (0.09 + 0.05 * (0.5 + 0.5 * Math.sin(now * 0.004 + f))) * drainAll
        : (0.022 + 0.012 * (0.5 + 0.5 * Math.sin(breath * 2 + f * 0.8)));
      strokeLink(fi.a, fi.cp, fi.b, lerpColor(base), 0.8);
    }

    // ---- crisp core of the lit paths
    for (var l2 = 0; l2 < litEdges.length; l2++) {
      var le3 = litEdges[l2];
      var lp = le3.energy * 0.9 * drainAll;
      strokeLink(le3.a, le3.cp, le3.b, lerpColor(lp), 1.1);
    }

    // crisp pulse heads
    for (var ph = 0; ph < edges.length; ph++) {
      var e3 = edges[ph];
      if (now < e3.start) continue;
      var pr3 = Math.min(1.08, (now - e3.start) / e3.dur);
      var pos3 = bezierAt(e3.a, e3.cp, e3.b, pr3);
      ctx.fillStyle = ACCENT;
      ctx.globalAlpha = (e3.fire ? 1 : 0.4) * drainAll;
      ctx.beginPath();
      ctx.arc(pos3.x, pos3.y, e3.fire ? 2.6 : 1.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ---- nodes (crisp text on top of the light)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var n2 = 0; n2 < nodes.length; n2++) {
      var nd2 = nodes[n2];
      var ndr = ndrain(nd2);
      var ch2 = Math.min(1, nd2.charge);

      if (nd2.fired) {
        var ripple = nd2.flashT;
        if (ripple > 0) {
          ctx.strokeStyle = lerpColor(ripple * 0.6 * ndr);
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(nd2.qx, nd2.qy, (1 - ripple) * 32, 0, Math.PI * 2);
          ctx.stroke();
        }
        var scale = 1 + 0.08 * ch2 * (0.5 + 0.5 * Math.sin(now * 0.005 + nd2.glowph));
        ctx.save();
        ctx.translate(nd2.qx, nd2.qy);
        ctx.scale(scale, scale);
        ctx.strokeStyle = lerpColor((0.55 + 0.3 * ch2) * ndr);
        ctx.lineWidth = 1.2;
        ctx.fillStyle = 'rgba(255,166,201,0.08)';
        roundRect(-nd2.w / 2, -nd2.h / 2, nd2.w, nd2.h, nd2.h / 2);
        ctx.fill();
        ctx.stroke();
        ctx.font = '12px "Helvetica Neue", sans-serif';
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = ndr * (0.6 + 0.4 * ch2);
        ctx.fillText(nd2.text, 0, 0);
        ctx.restore();
        ctx.globalAlpha = 1;
      } else {
        var rest = 0.5 + 0.5 * Math.sin(now * 0.002 + nd2.glowph);
        var spark = nd2.sparkF > 0 ? nd2.sparkF : 0;
        ctx.strokeStyle = 'rgba(230,230,236,' + (0.06 + rest * 0.02 + spark * 0.12).toFixed(3) + ')';
        ctx.lineWidth = 1;
        roundRect(nd2.qx - nd2.w / 2, nd2.qy - nd2.h / 2, nd2.w, nd2.h, nd2.h / 2);
        ctx.stroke();
        ctx.font = '12px "Helvetica Neue", sans-serif';
        ctx.fillStyle = 'rgba(230,230,236,' + (0.28 + rest * 0.06 + spark * 0.5).toFixed(3) + ')';
        ctx.fillText(nd2.text, nd2.qx, nd2.qy);
      }
    }

    // prompt pill
    if (promptNode) {
      var pn = promptNode;
      var pdd = pn.drain > 0 ? (1 - pn.drain) : 1;
      var pxx = pn.x + Math.sin(breath * 1.3) * 3;
      var pyy = pn.y + Math.cos(breath * 0.9) * 3;
      ctx.save();
      ctx.translate(pxx, pyy);
      ctx.strokeStyle = lerpColor(0.85 * pdd);
      ctx.lineWidth = 1.6;
      ctx.fillStyle = 'rgba(255,166,201,0.1)';
      roundRect(-pn.w / 2, -pn.h / 2, pn.w, pn.h, pn.h / 2);
      ctx.fill();
      ctx.stroke();
      ctx.font = '700 13px "Helvetica Neue", sans-serif';
      ctx.fillStyle = ACCENT;
      ctx.globalAlpha = pdd;
      ctx.fillText(pn.text, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    firedList.length = 0;
  }

  function ndrain(n) {
    return n.drain > 0 ? (1 - n.drain) : 1;
  }

  function nearestOf(list, x, y) {
    var best = list[0], bd = Infinity;
    for (var i = 0; i < list.length; i++) {
      var d = dist(list[i].qy, list[i].qx, y, x);
      if (d < bd) { bd = d; best = list[i]; }
    }
    return best;
  }

  // ----------------------------------------------------------- boot

  function setBox(off) {
    inputEl.disabled = off;
    submitEl.disabled = off;
    if (off) inputEl.blur();
  }

  submitEl.addEventListener('click', function () { run(); inputEl.focus(); });
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { run(); inputEl.focus(); } });

  function tick(ts) {
    now = ts; frame = ts;
    update();
    draw();
    requestAnimationFrame(tick);
  }

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildGlow();
    buildNodes();
    buildMotes();
    state = 'idle'; edges = []; litEdges = []; promptNode = null; firedList = [];
    document.querySelector('.reply').classList.remove('show');
    setBox(false);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);

  // helpers
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist(x1, y1, x2, y2) { var dx = x1 - x2, dy = y1 - y2; return Math.sqrt(dx * dx + dy * dy); }
})();
</script>
</body>
</html>
