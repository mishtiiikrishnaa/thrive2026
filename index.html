<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ask the web a question</title>
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<link href="https://fonts.cdnfonts.com/css/cmu-serif" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/cmu-sans-serif" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/cmu-typewriter-text" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #e9e9ee;
    --grey: #8e8e98;
    --dim: #40404a;
    --accent: #ffa6c9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  body {
    font-family: "CMU Sans Serif", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }

  .scene { position: relative; height: 100vh; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .title {
    position: absolute; top: 3.2%; left: 0; right: 0;
    text-align: center; pointer-events: none; user-select: none;
  }
  .title h1 {
    font-family: "CMU Serif", Georgia, "Times New Roman", serif;
    font-weight: 500; font-size: clamp(18px, 2.4vw, 28px);
    letter-spacing: 0.02em; line-height: 1.4; color: var(--ink);
  }
  .hint {
    margin-top: 6px; font-size: 10px; letter-spacing: 0.26em;
    text-transform: uppercase; color: var(--dim);
    font-family: "CMU Typewriter Text", monospace;
  }

  .askline {
    position: absolute; top: 9.5%; left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px; padding: 0 20px;
    user-select: none; z-index: 3;
  }
  .askline input {
    flex: 0 1 520px;
    font-size: 16px; letter-spacing: 0.02em; color: var(--ink);
    background: rgba(18,18,28,0.78);
    border: 1px solid var(--dim); border-radius: 999px;
    padding: 14px 24px; outline: none;
    transition: border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
  }
  .askline input::placeholder { color: #5c5c68; font-style: italic; }
  .askline input:focus {
    border-color: rgba(255,166,201,0.6);
    box-shadow: 0 0 0 1px rgba(255,166,201,0.25), 0 0 30px rgba(255,166,201,0.12);
  }
  .askline input:disabled { opacity: 0.35; }
  .askline button {
    font-size: 14px; letter-spacing: 0.05em; color: var(--ink);
    background: rgba(255,166,201,0.12);
    border: 1px solid rgba(255,166,201,0.4); border-radius: 999px;
    padding: 0 26px; cursor: pointer; outline: none;
    transition: background 0.3s ease, opacity 0.4s ease;
  }
  .askline button:hover:not([disabled]) { background: rgba(255,166,201,0.24); }
  .askline button[disabled] { opacity: 0.35; cursor: default; }

  /* keywords chosen */
  .kwstrip {
    position: absolute; top: 16.6%; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 8px;
    padding: 0 20px; opacity: 0; transform: translateY(-6px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none; user-select: none; z-index: 2;
  }
  .kwstrip.show { opacity: 1; transform: translateY(0); }
  .kwstrip.fade { opacity: 0; transform: translateY(-6px); }
  .kwstrip .stagekw {
    font-size: 9px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--dim); font-family: "CMU Typewriter Text", monospace;
  }
  .kwstrip .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
  .kwstrip .chip {
    font-size: 12px; letter-spacing: 0.03em; color: var(--accent);
    background: rgba(255,166,201,0.08);
    border: 1px solid rgba(255,166,201,0.35); border-radius: 999px;
    padding: 5px 13px; font-family: "CMU Sans Serif", sans-serif;
  }

  /* phases of a question */
  .stages {
    position: absolute; bottom: 16%; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 0;
    font-family: "CMU Typewriter Text", monospace;
    font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
    pointer-events: none; user-select: none; z-index: 2;
    transition: opacity 0.6s ease;
  }
  .stages.off { opacity: 0; }
  .stages .stage-label { color: var(--dim); transition: color 0.5s ease, text-shadow 0.5s ease; }
  .stages .stage-label.on { color: var(--accent); text-shadow: 0 0 12px rgba(255,166,201,0.45); }
  .stages .sep { margin: 0 10px; color: #2c2c34; font-size: 8px; }
  .stages .sep.on { color: rgba(255,166,201,0.4); }

  .reply {
    position: absolute; left: 0; right: 0; bottom: 5%;
    text-align: center; pointer-events: none; user-select: none;
    opacity: 0; transform: translateY(8px);
    transition: opacity 1.2s ease, transform 1.2s ease; z-index: 2;
  }
  .reply.show { opacity: 1; transform: translateY(0); }
  .reply p {
    display: inline-block; max-width: 700px; margin: 0 auto;
    padding: 13px 26px; font-family: "CMU Serif", Georgia, serif;
    font-size: 14.5px; line-height: 1.62; color: var(--ink);
    background: rgba(10,10,15,0.88);
    border: 1px solid rgba(255,166,201,0.12);
    box-shadow: 0 0 60px rgba(255,166,201,0.06);
    border-radius: 10px;
    white-space: pre-wrap;
    text-align: left;
  }
</style>
</head>
<body>

  <div class="scene">
    <canvas id="stage"></canvas>

    <div class="title">
      <h1>ask the web a question.</h1>
      <div class="hint">keywords &middot; facts &middot; connections &middot; answer</div>
    </div>

    <div class="askline">
      <input id="input" type="text" placeholder="any question…" autocomplete="off" spellcheck="false">
      <button id="submit">ask</button>
    </div>

    <div class="kwstrip" id="kwstrip">
      <span class="stagekw">keywords</span><span class="chips" id="chips"></span>
    </div>

    <div class="stages off" id="stages">
      <span class="stage-label" data-s="0">keywords</span><span class="sep">·</span>
      <span class="stage-label" data-s="1">facts</span><span class="sep">·</span>
      <span class="stage-label" data-s="2">connections</span><span class="sep">·</span>
      <span class="stage-label" data-s="3">answer</span>
    </div>

    <div class="reply"><p id="replytext"></p></div>
  </div>

    eat: ['food', 'hunger', 'taste', 'meal', 'cook'],
    feel: ['love', 'fear', 'anger', 'sad', 'happy', 'emotion', 'lonely'],
    fast: ['speed', 'quick', 'quickly', 'velocity', 'hurry'],
    money: ['buy', 'sell', 'trade', 'work', 'price', 'market'],
    love: ['heart', 'feeling', 'loss', 'care', 'want'],
    sad: ['loss', 'cry', 'pain', 'alone', 'sorry'],
    music: ['song', 'sound', 'pitch', 'melody', 'sing', 'listen', 'beats'],
    language: ['word', 'speak', 'say', 'meaning', 'talk', 'voice'],
    memory: ['remember', 'forget', 'past', 'recall'],
    death: ['die', 'gone', 'loss', 'end', 'grave'],
    beginning: ['start', 'born', 'origin', 'first', 'new'],
    inside: ['inner', 'within', 'core', 'heart', 'secret'],
    together: ['connect', 'link', 'join', 'bond', 'union'],
    apart: ['separate', 'alone', 'distance', 'divide', 'split'],
    choice: ['choose', 'decision', 'duty', 'path', 'pick'],
    grow: ['growth', 'growing', 'plant', 'tall', 'life', 'increase'],

  var STOP = {};
  ['what','is','why','how','do','does','did','the','a','an','of','to','me','my','your','can','i','you','it','that','this','and','or','but','for','about','will','would','could','should','please','tell','give','make','want','need','like','let','there','its','it','when','where','who','are','were','was','be','has','have','too','so','very','really','just','on','in','at','with','from','by','up','down','out','over','under','again','then','than','all','any','some','much','more','most','nothing','list','explain','describe'].forEach(function (w) { STOP[w] = true; });

  // ------------------------------------------------------- state

  var W = 0, H = 0, DPR = 1;
  var cells = [];           // one per fact
  var cables = [];          // spine + decorative, smooth curves
  var assocEdges = [];      // freshly discovered paths that then cool
  var boutons = [];
  var threads = [];         // long gentle arcs
  var drizzle = [];
  var motes = [];
  var chainMeta = {};       // key -> {x, y, r}

  var tissue = null, tctx = null, TW = 0, TH = 0;

  var promptCell = null;
  var impulses = [];
  var edgesBuilt = [];      // the answer's new connections, drawn as they grow
  var synthesis = null;     // current answering run

  var now = 0, frame = 0, lastT = 0, t0 = 0;
  var state = 'idle';       // idle | keywords | facts | connections | forming | answered | settling
  var answerAt = 0, settleStart = 0;

  var stageLabels = [];
  for (var sl = 0; sl < stagesEl.children.length; sl++) stageLabels.push(stagesEl.children[sl]);

  function setStage(n) {
    for (var i = 0; i < stageLabels.length; i++) {
      var label = stageLabels[i];
      if (label.classList.contains('stage-label')) {
        var idx = +label.getAttribute('data-s');
        label.classList.toggle('on', idx <= n);
      } else {
        label.classList.toggle('on', n > 0);
      }
    }

  // ------------------------------------------------------- helpers

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dist(x1, y1, x2, y2) { var dx = x1 - x2, dy = y1 - y2; return Math.sqrt(dx * dx + dy * dy); }
  function lerpColor(a) { return 'rgba(255,166,201,' + a.toFixed(3) + ')'; }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function pathCum(path) {
    var cum = [0];
    for (var i = 1; i < path.length; i++) {
      cum.push(cum[i - 1] + dist(path[i][0], path[i][1], path[i - 1][0], path[i - 1][1]));
    }
    return cum;
  }

  function pointAt(path, cum, d) {
    var lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (cum[mid] <= d) lo = mid; else hi = mid;
    }
    var a = path[lo], b = path[Math.min(hi, path.length - 1)];
    var seg = cum[hi] - cum[lo] || 0.0001;
    var t = clamp((d - cum[lo]) / seg, 0, 1);
    return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t };
  }

  function catmull(p0, p1, p2, p3, t) {
    var t2 = t * t, t3 = t2 * t;
    return {
      x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
      y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
    };
  }

  function smooth(pts) {
    if (pts.length < 3) return pts;
    var out = [pts[0]];
    for (var i = 1; i < pts.length - 2; i++) {
      var p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2];
      for (var s = 1; s <= 5; s++) {
        var p = catmull(p0, p1, p2, p3, s / 5);
        out.push([p.x, p.y]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  // ------------------------------------------------------- growth

  function addBouton(x, y, owner) {
    boutons.push({ x: x, y: y, owner: owner || null, ph: rand(0, Math.PI * 2), flare: 0 });
  }

  // a neuron's dendrites: smooth tapered branches with twigs and beads
  function growArbor(sx, sy) {
    var out = [];
    var n = 3;
    for (var b = 0; b < n; b++) {
      var ang = rand(0, Math.PI * 2);
      var ctrl = [[sx, sy]];
      var len = rand(46, 82);
      for (var i = 1; i <= 4; i++) {
        ang += rand(-0.35, 0.35);
        ctrl.push([sx + Math.cos(ang) * len * i / 4, sy + Math.sin(ang) * len * i / 4]);
      }
      var branch = smooth(ctrl);
      out.push(branch);
      var tip = branch[branch.length - 1];
      addBouton(tip[0], tip[1], null);
      if (Math.random() < 0.6) {
        var k0 = Math.max(1, branch.length - 4);
        var base = branch[k0];
        var twAng = Math.atan2(tip[1] - base[1], tip[0] - base[0]) + rand(-0.9, 0.9);
        var twig = [base];
        for (var t2 = 1; t2 <= 2; t2++) {
          twAng += rand(-0.4, 0.4);
          twig.push([base[0] + Math.cos(twAng) * 9 * t2, base[1] + Math.sin(twAng) * 9 * t2]);
        }
        var tpath = smooth(twig);
        out.push(tpath);
        var tt = tpath[tpath.length - 1];
        addBouton(tt[0], tt[1], null);
      }
    }
    return out;
  }

  // a cable between two cells: a gentle sagging curve
  function growCablePath(sx, sy, tx, ty) {
    var mx = (sx + tx) / 2, my = (sy + ty) / 2;
    var dx = tx - sx, dy = ty - sy;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var px = -dy / len, py = dx / len;
    var sag = Math.min(len * 0.13, 46) * rand(0.7, 1.3);
    var c1 = { x: mx - px * sag - dx * 0.15, y: my - py * sag - dy * 0.15 };
    var c2 = { x: mx + px * sag * 0.55 + dx * 0.12, y: my + py * sag * 0.55 + dy * 0.12 };
    return smooth([[sx, sy], [c1.x, c1.y], [c2.x, c2.y], [tx, ty]]);
  }

  // a long shallow arc across the field
  function growArcPath() {
    var x0 = rand(W * 0.06, W * 0.5), y0 = rand(H * 0.26, H * 0.6);
    var x1 = rand(W * 0.55, W * 0.94), y1 = rand(H * 0.26, H * 0.7);
    var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var px = -dy / len, py = dx / len;
    var sag = len * rand(0.12, 0.2);
    var c = { x: mx + px * sag, y: my + py * sag };
    return smooth([[x0, y0], [c.x, c.y], [x1, y1]]);
  }

  // ------------------------------------------------------- layout

  function measureW(text) {
    ctx.font = '12px "CMU Sans Serif", sans-serif';
    return Math.min(320, ctx.measureText(text).width + 22);
  }

  function buildLayout() {
    cells = [];
    boutons = [];
    var zx0 = W * 0.07, zx1 = W * 0.93, zy0 = H * 0.24, zy1 = H * 0.74;

    for (var c = 0; c < CHAIN_KEYS.length; c++) {
      var key = CHAIN_KEYS[c];
      var def = CHAINS[key];
      var ax = (def.anchor[0] + rand(-0.012, 0.012)) * W;
      var ay = (def.anchor[1] + rand(-0.012, 0.012)) * H;
      var pts = [];

      for (var f = 0; f < def.facts.length; f++) {
        var fact = def.facts[f];
        var ring = fact[1] === 1 ? rand(42, 74) : fact[1] === 2 ? rand(70, 110) : rand(100, 140);
        var a2 = rand(0, Math.PI * 2);
        var n = {
          text: fact[0], ch: key, ho: fact[1], k: fact[2],
          fired: false, litIdx: 0, flashT: 0, drain: 0, charge: 0,
          trem: rand(0, Math.PI * 2), glowph: rand(0, Math.PI * 2),
          sparkT: rand(800, 7000), sparkF: 0,
          x: clamp(ax + Math.cos(a2) * ring, zx0 + 16, zx1 - 16),
          y: clamp(ay + Math.sin(a2) * ring, zy0, zy1)
        };
        n.w = measureW(n.text);
        n.h = 24;
        n.qx = n.x; n.qy = n.y;
        pts.push(n);
      }

      for (var it = 0; it < 40; it++) {
        for (var i = 0; i < pts.length; i++) {
          for (var j = i + 1; j < pts.length; j++) {
            var a = pts[i], b = pts[j];
            var dx = b.x - a.x, dy = b.y - a.y;
            var d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
            var minD = (a.w + b.w) / 2 * 0.55 + 12;
            if (d < minD) {
              var push = (minD - d) / 2;
              a.x -= (dx / d) * push; a.y -= (dy / d) * push;
              b.x += (dx / d) * push; b.y += (dy / d) * push;
              a.x = clamp(a.x, zx0 + 14, zx1 - 14);
              a.y = clamp(a.y, zy0, zy1);
              b.x = clamp(b.x, zx0 + 14, zx1 - 14);
              b.y = clamp(b.y, zy0, zy1);
            }
          }
        }
      }

      for (var k = 0; k < pts.length; k++) {
        pts[k].arbors = growArbor(pts[k].x, pts[k].y);
      }

      var cx = 0, cy = 0;
      for (var m = 0; m < pts.length; m++) { cx += pts[m].x; cy += pts[m].y; }
      chainMeta[key] = { x: cx / pts.length, y: cy / pts.length, r: 150 };
      cells = cells.concat(pts);
    }
  }

  function buildNerveNet() {
    cables = [];
    threads = [];
    assocEdges = [];
    edgesBuilt = [];

    for (var c = 0; c < CHAIN_KEYS.length; c++) {
      var key = CHAIN_KEYS[c];
      var h1 = chainCells(key, 1);
      var h2 = chainCells(key, 2);
      var h3 = chainCells(key, 3);
      if (h1.length && h2.length) cables.push(makeCable(h1[0], h2[0]));
      if (h2.length && h3.length) cables.push(makeCable(h2[0], h3[0]));
      if (h2.length > 1 && h3.length) cables.push(makeCable(h2[1 % h2.length], h3[0]));
    }

    // long gentle arcs between distant chains
    var farPairs = 5;
    while (farPairs-- > 0) {
      var a = cells[Math.floor(Math.random() * cells.length)];
      var b = cells[Math.floor(Math.random() * cells.length)];
      if (a === b || a.ch === b.ch) { farPairs++; continue; }
      threads.push({ path: smooth([[a.x, a.y], [rand(minX(), maxX()), rand(minY(), maxY())], [b.x, b.y]]), t0: 0 });
    }

    for (var t = 0; t < 4; t++) {
      var arc = growArcPath();
      var mid = arc[Math.floor(arc.length / 2)];
      addBouton(mid[0], mid[1], null);
      var endp = arc[arc.length - 1];
      addBouton(endp[0], endp[1], null);
      threads.push({ path: arc, t0: 0 });
    }
  }

  function minX() { return W * 0.07; }
  function maxX() { return W * 0.93; }
  function minY() { return H * 0.24; }
  function maxY() { return H * 0.74; }

  function chainCells(key, ho) {
    var out = [];
    for (var i = 0; i < cells.length; i++) {
      if (cells[i].ch === key && cells[i].ho === ho) out.push(cells[i]);
    }
    return out;
  }

  function makeCable(a, b) {
    return { a: a, b: b, path: growCablePath(a.x, a.y, b.x, b.y) };
  }

  function buildDrizzle() {
    drizzle = [];
    var tries = 0;
    while (drizzle.length < 36 && tries < 800) {
      tries++;
      var x = rand(W * 0.06, W * 0.94), y = rand(H * 0.16, H * 0.82);
      var ok = true;
      for (var i = 0; i < cells.length; i++) {
        if (dist(x, y, cells[i].x, cells[i].y) < cells[i].w / 2 + 42) { ok = false; break; }
      }
      if (!ok) continue;
      drizzle.push({ t: DRIZZLE[Math.floor(Math.random() * DRIZZLE.length)], x: x, y: y, size: rand(8.5, 11), op: rand(0.04, 0.09), ph: rand(0, Math.PI * 2), dp: rand(0, Math.PI * 2) });
    }
  }

  var DRIZZLE = [
    'wavelength', 'gravity', 'entropy', 'photon', 'orbital', 'vapour', 'erosion', 'sediment', 'fathom', 'brine',
    'synapse', 'dendrite', 'myelin', 'glutamate', 'cortex', 'resting', 'iamb', 'sestina', 'anaphora', 'couplet',
    'bhagavad', 'dharma', 'icarus', 'orpheus', 'odysseus', 'piston', 'compiler', 'pointer', 'kernel',
    'lambda', 'quadrant', 'axiom', 'cosine', 'lexicon', 'phoneme', 'syntax', 'guild', 'bazaar',
    'cadence', 'tempo', 'attack', 'decay', 'sustain', 'release', 'breath', 'pause'
  ];

  function buildMotes() {
    motes = [];
    for (var i = 0; i < 30; i++) {
      motes.push({ x: rand(0, W), y: rand(0, H), r: rand(0.6, 1.7), ph: rand(0, Math.PI * 2), vx: rand(-0.08, 0.08), vy: rand(-0.07, 0.07), pink: Math.random() < 0.3, swirl: rand(-0.005, 0.005) });
    }
  }

  function buildTissue() {
    TW = Math.max(2, Math.round(W / 2));
    TH = Math.max(2, Math.round(H / 2));
    if (!tissue) tissue = document.createElement('canvas');
    tissue.width = TW;
    tissue.height = TH;
    tctx = tissue.getContext('2d');
    tctx.fillStyle = '#0a040c';
    tctx.fillRect(0, 0, TW, TH);
  }

  // ------------------------------------------------------- matching

  function tokens(text) {
    var raw = text.toLowerCase().split(/[^a-z\u2019]+/);
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var w = raw[i];
      if (w.length > 4 && /ing$/.test(w)) w = w.slice(0, -3);
      if (w.length > 5 && /ed$/.test(w)) w = w.slice(0, -2);
      if (w.length > 4 && /s$/.test(w)) w = w.slice(0, -1);
      if (!w || w.length < 2 || STOP[w]) continue;
      if (out.indexOf(w) < 0) out.push(w);
    }
    return out;
  }

  function expand(tok) {
    var set = [tok];
    for (var k in SYN) {
      if (k === tok) { set = set.concat(SYN[k]); }
      else if (SYN[k].indexOf(tok) >= 0) { set.push(k); set = set.concat(SYN[k]); }
    }
    return set;
  }

  function scoreFacts(promptText) {
    var toks = tokens(promptText);
    var raw = ' ' + promptText.toLowerCase() + ' ';
    var scores = {};

    for (var c = 0; c < cells.length; c++) {
      var cell = cells[c];
      var s = 0;
      for (var kw = 0; kw < cell.k.length; kw++) {
        var keyword = cell.k[kw];
        if (raw.indexOf(keyword) >= 0) { s += 3; continue; }
        for (var ti = 0; ti < toks.length; ti++) {
          var pool = expand(toks[ti]);
          for (var pi = 0; pi < pool.length; pi++) {
            if (pool[pi] === keyword) { s += 1; break; }
            if (keyword.length >= 4 && pool[pi].indexOf(keyword) >= 0) { s += 0.5; break; }
          }
        }
      }
      if (s > 0) scores[cells.indexOf(cell)] = s;
    }
    return scores;
  }

  function pickChain(scores) {
    var best = null, bestS = 0;
    var byChain = {};
    for (var c = 0; c < CHAIN_KEYS.length; c++) byChain[CHAIN_KEYS[c]] = 0;
    for (var i in scores) {
      var cell = cells[i];
      if (byChain[cell.ch] === undefined) byChain[cell.ch] = 0;
      byChain[cell.ch] += scores[i];
    }
    for (var k = 0; k < CHAIN_KEYS.length; k++) {
      if (byChain[CHAIN_KEYS[k]] > bestS) { bestS = byChain[CHAIN_KEYS[k]]; best = CHAIN_KEYS[k]; }
    }
    return best;
  }

  function compose(selected) {
    var parts = [];
    for (var i = 0; i < selected.length; i++) {
      var t = selected[i].text.trim();
      t = t.charAt(0).toUpperCase() + t.slice(1);
      if (!t.match(/[.!?]$/)) t += '.';
      parts.push(t);
    }
    return parts.join('  ');
  }

  // ------------------------------------------------------- answering

  function run(text) {
    if (state !== 'idle') return;
    setBox(true);
    t0 = performance.now();
    _deliveryCache = {};
    document.querySelector('.reply').classList.remove('show');
    replyEl.textContent = '';
    chipsEl.textContent = '';
    kwstripEl.classList.remove('show');
    stagesEl.classList.remove('off');
    setStage(-1);
    for (var i = 0; i < cells.length; i++) {
      cells[i].fired = false; cells[i].litIdx = 0; cells[i].flashT = 0; cells[i].drain = 0; cells[i].charge = 0;
    }
    for (var j = 0; j < boutons.length; j++) boutons[j].flare = 0;
    assocEdges = [];
    impulses = [];
    edgesBuilt = [];

    var chips = tokens(text).slice(0, 6);
    if (!chips.length) chips = ['answer'];

    var scores = scoreFacts(text);
    var chain = pickChain(scores);

    // everything that scored, best first — then keep the winning
    // chain's facts for the group, and let other chains' hits join the
    // group too (a web, not a filing cabinet)
    var scoredAll = cells.map(function (c, idx) { return { c: c, s: scores[idx] || 0 }; })
      .filter(function (x) { return x.s > 0; })
      .sort(function (a, b) { return b.s - a.s; });
    var chainBest = scoredAll.filter(function (x) { return x.c.ch === chain; });
    var sel = chainBest.slice(0, 6).map(function (x) { return x.c; });

    if (sel.length < 4) {
      var cross = scoredAll.filter(function (x) { return x.c.ch !== chain; });
      for (var cs = 0; cs < cross.length && sel.length < 4; cs++) {
        if (sel.indexOf(cross[cs].c) < 0) sel.push(cross[cs].c);
      }
    }

    if (sel.length < 4 && chain) {
      var rest = chainCells(chain, 1).concat(chainCells(chain, 2), chainCells(chain, 3));
      for (var r = 0; r < rest.length && sel.length < 4; r++) {
        if (sel.indexOf(rest[r]) < 0) sel.push(rest[r]);
      }
    }

    if (sel.length < 4) {
      var gt = chainCells('everything', 1).concat(chainCells('everything', 2), chainCells('everything', 3));
      for (var g = 0; g < gt.length && sel.length < 4; g++) {
        if (sel.indexOf(gt[g]) < 0) sel.push(gt[g]);
      }
    }

    var spine0 = chainCells(chain, 1)[0];
    var ordered = sel.slice().sort(function (a, b) { return a.ho - b.ho || (scores[cells.indexOf(b)] || 0) - (scores[cells.indexOf(a)] || 0); });
    if (spine0 && sel.indexOf(spine0) >= 0) {
      ordered = [spine0].concat(ordered.filter(function (x) { return x !== spine0; }));
    }
    for (var oi = 0; oi < ordered.length; oi++) ordered[oi].litIdx = oi + 1;

    var answerText = compose(ordered);

    // schedule of the four movements
    t0 = performance.now();
    var avgLen = Math.max(30, Math.round(answerText.length / Math.max(1, ordered.length)));
    synthesis = {
      chain: chain,
      ordered: ordered,
      chips: chips,
      text: answerText,
      kwStart: t0 + 300,
      kwStagger: KW_STAGGER,
      kwEnd: 0,
      factStart: 0,
      factEach: 430,
      factEnd: 0,
      conStart: 0,
      conEach: 130,
      conEnd: 0,
      answerStart: 0,
      builtEdges: [],
      flowStart: 0,
      perFact: 620 + 16 * avgLen,
      typeHold: 0,
      typeIdx: 0
    };
    synthesis.kwEnd = synthesis.kwStart + chips.length * synthesis.kwStagger + 240;
    synthesis.factStart = synthesis.kwEnd + 360;
    synthesis.factEnd = synthesis.factStart + (ordered.length - 1) * synthesis.factEach + 460;
    synthesis.conStart = synthesis.factEnd + 320;
    synthesis.conEnd = synthesis.conStart + ordered.length * synthesis.conEach;
    // one lateral skip-nerve between the first two group members, like the
    // brain's own redundant routes — drawn but not part of the sentences
    var lateralT = synthesis.conEnd + 140;
    synthesis.answerStart = lateralT + 560;

    promptCell = mkPromptCell(text);

    // edges the answer will draw: question -> fact1 -> fact2 -> ...
    var from = promptCell;
    for (var o = 0; o < ordered.length; o++) {
      var to = ordered[o];
      var cbl = cableBetween(from, to);
      if (!cbl) cbl = { path: growCablePath(from.qx || from.x, from.qy || from.y, to.x, to.y), a: from, b: to };
      synthesis.builtEdges.push({
        a: from, b: to, path: cbl.path,
        cum: pathCum(cbl.path),
        buildT: synthesis.conStart + o * synthesis.conEach,
        launched: false
      });
      if (o === 0 ? !cableExists(promptCell, to) : !cableExists(from, to)) {
        assocEdges.push({ a: from, b: to, path: cbl.path, t0: 0 });
      }
      from = to;
    }
    if (ordered.length >= 3) {
      var la = ordered[0], lb = ordered[2];
      var lcbl = cableBetween(la, lb);
      if (!lcbl) lcbl = { path: growCablePath(la.qx, la.qy, lb.x, lb.y), a: la, b: lb };
      synthesis.builtEdges.push({
        a: la, b: lb, path: lcbl.path,
        cum: pathCum(lcbl.path),
        buildT: lateralT,
        launched: false
      });
      if (!cableExists(la, lb)) assocEdges.push({ a: la, b: lb, path: lcbl.path, t0: 0 });
    }

    setStage(0);
    kwstripEl.classList.add('show');
    inputEl.value = '';
    state = 'keywords';
    inputEl.focus();
  }

  function cableExists(a, b) {
    for (var i = 0; i < cables.length; i++) {
      if (cables[i].a === a && cables[i].b === b) return true;
    }
    return false;
  }

  function cableBetween(a, b) {
    for (var i = 0; i < cables.length; i++) {
      if (cables[i].a === a && cables[i].b === b) return cables[i];
      if (cables[i].a === b && cables[i].b === a) return cables[i];
    }
    return null;
  }

  function mkPromptCell(text) {
    var n = {
      text: text, fired: true, litIdx: 0, flashT: 1, drain: 0, charge: 1.4,
      x: W / 2, y: H * 0.135, w: 0, h: 22, trem: 0, glowph: 0,
      qx: W / 2, qy: H * 0.135, arbors: []
    };
    ctx.font = '700 13px "CMU Sans Serif", sans-serif';
    n.w = Math.min(560, ctx.measureText(text).width + 30);
    return n;
  }

  function mkImpulse(cbl, started, onEnd) {
    var cum = pathCum(cbl.path);
    var len = cum[cum.length - 1];
    var dur = clamp(len * 1.15, 320, 720);
    return {
      cum: cum, path: cbl.path, len: len,
      d: 0, speed: len / dur,
      wake: new Array(14).fill(null), wi: 0,
      started: started, done: false, onEnd: onEnd
    };
  }

  function fireNode(node) {
    if (!node.fired) { node.fired = true; node.flashT = 1; node.sparkF = 0; }
    node.charge = Math.min(2.4, node.charge + 1.5);
    for (var i = 0; i < boutons.length; i++) {
      if (boutons[i].owner === node) boutons[i].flare = 1;
    }
  }

  // ------------------------------------------------------- update

  function renderChips() {
    if (!synthesis) return;
    var fragments = [];
    for (var i = 0; i < synthesis.chips.length; i++) {
      var t0c = synthesis.kwStart + i * synthesis.kwStagger;
      if (now < t0c) break;
      var spent = now - t0c;
      var full = synthesis.chips[i];
      var shown = Math.min(full.length, Math.floor(spent / CHIP_MS));
      var s = document.createElement('span');
      s.className = 'chip';
      s.textContent = shown < full.length ? full.slice(0, shown) + '\u258b' : full;
      fragments.push(s);
    }
    chipsEl.textContent = '';
    for (var fi = 0; fi < fragments.length; fi++) chipsEl.appendChild(fragments[fi]);
  }

  function update(dt) {
    for (var i = 0; i < cells.length; i++) {
      var n = cells[i];
      n.charge *= 0.972;
      if (n.sparkF > 0) n.sparkF -= 0.025;
      if (n.sparkT > 0) {
        n.sparkT -= dt;
        if (n.sparkT <= 0) {
          n.sparkT = rand(2400, 7600);
          if (n.sparkF <= 0) n.sparkF = 1;
        }
      }
    }
    if (promptCell) promptCell.charge *= 0.992;
    for (var b = 0; b < boutons.length; b++) boutons[b].flare = Math.max(0, boutons[b].flare - 0.006);

    for (var ae = assocEdges.length - 1; ae >= 0; ae--) {
      if (assocEdges[ae].t0 > 0 && now - assocEdges[ae].t0 > 4200) assocEdges.splice(ae, 1);
    }

    if (synthesis) {
      var skd = synthesis;

      // movement one: keywords chosen
      if (state === 'keywords') {
        renderChips();
        if (now >= skd.factStart) { state = 'facts'; setStage(1); }
      }

      // movement two: the facts for those keywords are shown
      if (state === 'facts') {
        for (var fo = 0; fo < skd.ordered.length; fo++) {
          var ft = skd.factStart + fo * skd.factEach;
          if (now >= ft && !skd.ordered[fo].fired) fireNode(skd.ordered[fo]);
        }
        if (now >= skd.conStart) { state = 'connections'; setStage(2); }
      }

      // movement three: the connections are made
      if (state === 'connections') {
        var allLaunched = true;
        for (var be = 0; be < skd.builtEdges.length; be++) {
          var edge = skd.builtEdges[be];
          if (!edge.launched) {
            if (now >= edge.buildT) {
              edge.launched = true;
              impulses.push(mkImpulse(edge, now, fireNode.bind(null, edge.b)));
            } else {
              allLaunched = false;
            }
          }
        }
        if (allLaunched) {
          for (var ce = 0; ce < skd.builtEdges.length; ce++) {
            var edge2 = skd.builtEdges[ce];
            if (edge2.buildT + 520 > now) { allLaunched = false; break; }
          }
        }
        if (allLaunched && now >= skd.answerStart) {
          state = 'forming';
          setStage(3);
          skd.flowStart = now;
          document.querySelector('.reply').classList.add('show');
        }
      }

      // movement four: the answer — a full paragraph of sentences,
      // each one given straight from the facts the connections lit
      while (state === 'forming' && skd.typeIdx < skd.text.length) {
        skd.typeHold += dt;
        if (skd.typeHold < 16) break;
        skd.typeHold -= 16;
        skd.typeIdx++;
        if (skd.text[skd.typeIdx - 1] === '.') skd.typeHold -= 300; // breathe at the end of a sentence
        replyEl.textContent = skd.text.slice(0, skd.typeIdx) + (skd.typeIdx < skd.text.length ? '\u2009\u258b' : '');
      }
      if (state === 'forming' && skd.typeIdx >= skd.text.length) {
        replyEl.textContent = skd.text;
        state = 'answered';
        answerAt = now;
      } else if (state === 'answered') {
        if (now - answerAt > 4300) {
          state = 'settling';
          settleStart = now;
          var aek = kwstripEl.classList;
          aek.add('fade');
          for (var z = 0; z < cells.length; z++) cells[z].drain = 1;
          if (promptCell) promptCell.drain = 1;
        }
      } else if (state === 'settling') {
        var dec = (now - settleStart) / 850;
        var done = true;
        for (var u = 0; u < cells.length; u++) {
          if (cells[u].drain > 0) {
            cells[u].drain = Math.max(0, 1 - dec);
            if (cells[u].drain !== 0) done = false;
          }
        }
        if (done) {
          state = 'idle';
          for (var v = 0; v < cells.length; v++) {
            cells[v].fired = false; cells[v].litIdx = 0; cells[v].drain = 0; cells[v].flashT = 0; cells[v].charge = 0;
          }
          promptCell = null; impulses = []; assocEdges = []; edgesBuilt = [];
          synthesis = null;
          kwstripEl.classList.remove('show');
          stagesEl.classList.add('off');
          setBox(false);
        }
      }
    }

    // pulses (mostly decorative now; the sequence is schedule-driven)
    for (var k = 0; k < impulses.length; k++) {
      var imp = impulses[k];
      if (imp.done) continue;
      if (now < imp.started) continue;
      imp.d += imp.speed * dt;
      if (imp.d >= imp.len) {
        if (imp.onEnd) imp.onEnd();
        imp.done = true;
        continue;
      }
      var pos = pointAt(imp.path, imp.cum, imp.d);
      imp.wake[imp.wi] = { x: pos.x, y: pos.y, a: 1 };
      imp.wi = (imp.wi + 1) % imp.wake.length;
      for (var bb = 0; bb < boutons.length; bb++) {
        var bo = boutons[bb];
        var d2 = (pos.x - bo.x) * (pos.x - bo.x) + (pos.y - bo.y) * (pos.y - bo.y);
        if (d2 < 30) bo.flare = Math.min(1, bo.flare + 0.5);
      }
    }
  }

  // ------------------------------------------------------- draw

  function drawPathT(c, path, cum, frac, alpha, width) {
    if (frac <= 0) return;
    var total = cum[cum.length - 1];
    var d = total * Math.min(1, frac);
    var lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (cum[mid] <= d) lo = mid; else hi = mid;
    }
    c.globalAlpha = alpha;
    c.strokeStyle = ACCENT;
    c.lineWidth = width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(path[0][0], path[0][1]);
    for (var i = 1; i <= lo; i++) c.lineTo(path[i][0], path[i][1]);
    if (lo < path.length - 1) {
      var p = pointAt(path, cum, d);
      c.lineTo(p.x, p.y);
    }
    c.stroke();
    c.globalAlpha = 1;
  }

  function drawFibre(c, path, alpha, width) {
    c.strokeStyle = ACCENT;
    c.lineWidth = width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.globalAlpha = alpha;
    c.beginPath();
    var p0 = path[0];
    c.moveTo(p0[0], p0[1]);
    for (var i = 1; i < path.length; i++) {
      var p = path[i];
      c.lineTo(p[0], p[1]);
    }
    c.stroke();
    c.globalAlpha = 1;
  }

  function drawFlow(c, path, alpha, width, off) {
    c.globalAlpha = alpha;
    c.strokeStyle = ACCENT;
    c.lineWidth = width;
    c.lineCap = 'round';
    c.setLineDash([2, 6]);
    c.lineDashOffset = off;
    c.beginPath();
    var p0 = path[0];
    c.moveTo(p0[0], p0[1]);
    for (var i = 1; i < path.length; i++) {
      var p = path[i];
      c.lineTo(p[0], p[1]);
    }
    c.stroke();
    c.setLineDash([]);
    c.globalAlpha = 1;
  }

  function deliveryPath(cell, ry) {
    var start = { x: cell.qx, y: cell.qy };
    var mx = (start.x + W / 2) / 2;
    var ctrl = { x: mx + rand(-30, 30), y: (start.y + ry) / 2 };
    return smooth([[start.x, start.y], [ctrl.x, ctrl.y], [W / 2 + rand(-30, 30), ry]]);
  }

  var _deliveryCache = {};

  function draw() {
    var breath = now * 0.0012;

    for (var di = 0; di < cells.length; di++) if (cells[di].flashT > 0) cells[di].flashT -= 0.035;
    if (promptCell && promptCell.flashT > 0) promptCell.flashT -= 0.035;

    var firedList = [];
    for (var qi = 0; qi < cells.length; qi++) {
      var qn = cells[qi];
      var ampv = qn.fired ? 1.3 : 0.5;
      qn.qx = qn.x + Math.sin(frame * 0.005 + qn.trem) * ampv;
      qn.qy = qn.y + Math.cos(frame * 0.006 + qn.trem * 1.7) * ampv;
      if (qn.fired) firedList.push(qn);
    }
    if (promptCell) {
      promptCell.qx = promptCell.x + Math.sin(breath * 1.3) * 3;
      promptCell.qy = promptCell.y + Math.cos(breath * 0.9) * 3;
    }

    var dmax = 0;
    for (var dd = 0; dd < cells.length; dd++) if (cells[dd].drain > dmax) dmax = cells[dd].drain;
    var drainAll = 1 - dmax * 0.92;
    var interact = state === 'running' || state === 'keywords' || state === 'facts' || state === 'connections' || state === 'forming' || state === 'answered' ? 1 : 0;

    // ---- background wash + faint breathing core
    var throb = 0.5 + 0.5 * Math.sin(breath);
    var bg = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, H * 0.95);
    bg.addColorStop(0, lerpColor(0.008 + 0.010 * throb));
    bg.addColorStop(0.6, lerpColor(0.003 + 0.002 * throb));
    bg.addColorStop(1, 'rgba(255,166,201,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ---- drizzle
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var dz = 0; dz < drizzle.length; dz++) {
      var dzz = drizzle[dz];
      ctx.font = dzz.size + 'px "CMU Typewriter Text", monospace';
      ctx.fillStyle = 'rgba(228,228,234,' + (dzz.op * (0.7 + 0.3 * Math.sin(now * 0.001 + dzz.ph))).toFixed(3) + ')';
      ctx.fillText(dzz.t, dzz.x + Math.sin(frame * 0.003 + dzz.dp) * 2, dzz.y + Math.cos(frame * 0.0025 + dzz.dp * 1.4) * 2);
    }

    // ---- tissue: stable under-layer, decays toward equilibrium
    tctx.globalAlpha = 1;
    tctx.fillStyle = 'rgba(9,3,11,0.05)';
    tctx.fillRect(0, 0, TW, TH);
    tctx.setTransform(0.5, 0, 0, 0.5, 0, 0);

    for (var cn = 0; cn < cells.length; cn++) {
      var cell = cells[cn];
      var arbA = 0.009 + Math.min(0.06, cell.charge * 0.028) * drainAll;
      for (var ap = 0; ap < cell.arbors.length; ap++) {
        drawFibre(tctx, cell.arbors[ap], arbA, 1.2);
      }
    }
    for (var cb = 0; cb < cables.length; cb++) {
      drawFibre(tctx, cables[cb].path, 0.006, 1.0);
    }
    for (var th = 0; th < threads.length; th++) {
      drawFibre(tctx, threads[th].path, 0.005, 0.9);
    }

    // connections that were made this run (hot while building, then cooling)
    if (synthesis) {
      for (var be = 0; be < synthesis.builtEdges.length; be++) {
        var eg = synthesis.builtEdges[be];
        if (!eg.launched) continue;
        var frac = clamp((now - eg.buildT) / 520, 0, 1);
        var coolA = state === 'connections' && frac < 1 ? 0 : Math.max(0, 1 - (now - eg.buildT - 520) / 4200) * 0.05;
        if (frac < 1) drawPathT(tctx, eg.path, eg.cum, frac, 0.028, 1.1);
        else if (coolA > 0.001) drawFibre(tctx, eg.path, coolA, 1.1);
      }
    }

    // impulse wakes — soft comet trails
    for (var im = 0; im < impulses.length; im++) {
      var imp = impulses[im];
      if (imp.done || now < imp.started) continue;
      var wak = imp.wake;
      var nw = wak.length;
      for (var wq = 0; wq < nw; wq++) {
        var e = wak[(imp.wi + nw - 1 - wq) % nw];
        if (!e) continue;
        var fade = 0.5 * Math.pow(1 - wq / nw, 2);
        if (fade <= 0.012) continue;
        tctx.globalAlpha = 1;
        tctx.strokeStyle = ACCENT;
        tctx.lineWidth = 1.8;
        tctx.lineCap = 'round';
        var nxp = wak[(imp.wi + nw - 2 - wq) % nw];
        if (nxp) {
          tctx.beginPath();
          tctx.moveTo(nxp.x, nxp.y);
          tctx.lineTo(e.x, e.y);
          tctx.stroke();
        }
      }
    }

    // boutons
    for (var bt = 0; bt < boutons.length; bt++) {
      var bo = boutons[bt];
      var a = 0.05 + bo.flare * 0.7;
      if (bo.owner && bo.owner.charge > 0.05) a = Math.max(a, Math.min(0.5, bo.owner.charge * 0.22));
      if (a < 0.02) continue;
      tctx.globalAlpha = 1;
      tctx.fillStyle = ACCENT;
      tctx.beginPath();
      tctx.arc(bo.x, bo.y, 1.4, 0, Math.PI * 2);
      tctx.fill();
    }
    tctx.globalAlpha = 1;

    // delivery threads — facts streaming their meaning down to the forming sentence
    if (synthesis && (state === 'forming' || state === 'answered')) {
      var base = synthesis.flowStart;
      for (var fI = 0; fI < synthesis.ordered.length; fI++) {
        var t0f = base + fI * synthesis.perFact;
        var t1f = t0f + 900;
        if (now < t0f - 400) continue;
        if (now > t1f) continue;
        var phased = clamp((now - t0f) / 700, 0, 1);
        var dpth = _deliveryCache.hasOwnProperty(fI) ? _deliveryCache[fI] : (_deliveryCache[fI] = deliveryPath(synthesis.ordered[fI], H * 0.82));
        drawFlow(tctx, dpth, (0.05 + 0.05 * phased) * drainAll, 1.1, -now * 0.03);
      }
    }

    // bloom
    ctx.filter = 'blur(2.5px)';
    ctx.globalAlpha = 0.5;
    ctx.drawImage(tissue, 0, 0, W, H);
    ctx.filter = 'blur(9px)';
    ctx.globalAlpha = 0.4;
    ctx.drawImage(tissue, 0, 0, W, H);
    ctx.filter = 'none';
    ctx.globalAlpha = 1;

    // ---- motes
    var motA = 0.02 + interact * 0.01;
    for (var mo = 0; mo < motes.length; mo++) {
      var mm = motes[mo];
      var sc = Math.cos(mm.swirl), ss = Math.sin(mm.swirl);
      var nvx = mm.vx * sc - mm.vy * ss;
      mm.vy = mm.vx * ss + mm.vy * sc;
      mm.vx = nvx;
      if (firedList.length) {
        var nrst = nearestOf(firedList, mm.x, mm.y);
        var pdx = nrst.qx - mm.x, pdy = nrst.qy - mm.y;
        var dl = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
        var pull = 2200 / (dl * dl + 5200);
        mm.vx += (pdx / dl) * pull * 0.4;
        mm.vy += (pdy / dl) * pull * 0.4;
      }
      mm.x += mm.vx; mm.y += mm.vy;
      if (mm.x < -4) mm.x = W + 4; else if (mm.x > W + 4) mm.x = -4;
      if (mm.y < -4) mm.y = H + 4; else if (mm.y > H + 4) mm.y = -4;
      var tw = 0.5 + 0.5 * Math.sin(now * 0.001 + mm.ph);
      ctx.globalAlpha = motA * (0.5 + tw);
      ctx.fillStyle = mm.pink ? ACCENT : GREY;
      ctx.beginPath();
      ctx.arc(mm.x, mm.y, mm.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- crisp definition: cables + arcs, thin and calm
    for (var c2 = 0; c2 < cables.length; c2++) {
      drawFibre(ctx, cables[c2].path, 0.016 * drainAll, 0.6);
    }
    for (var c3 = 0; c3 < threads.length; c3++) {
      drawFibre(ctx, threads[c3].path, 0.012 * drainAll, 0.5);
    }

    // growing connection tips, drawn crisp
    if (synthesis && state === 'connections') {
      for (var gb = 0; gb < synthesis.builtEdges.length; gb++) {
        var gEdge = synthesis.builtEdges[gb];
        if (!gEdge.launched) continue;
        var gT = clamp((now - gEdge.buildT) / 520, 0, 1);
        if (gT <= 0) continue;
        // the nerve itself, visibly being laid
        if (gT < 1) drawPathT(ctx, gEdge.path, gEdge.cum, gT, 0.22 * drainAll, 1.0);
        var tHead = pointAt(gEdge.path, gEdge.cum, gEdge.cum[gEdge.cum.length - 1] * Math.min(1, gT));
        var hg = ctx.createRadialGradient(tHead.x, tHead.y, 0, tHead.x, tHead.y, 9);
        hg.addColorStop(0, lerpColor(0.6 * drainAll));
        hg.addColorStop(1, 'rgba(255,166,201,0)');
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.arc(tHead.x, tHead.y, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = 0.9 * drainAll;
        ctx.beginPath();
        ctx.arc(tHead.x, tHead.y, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // crisp pulse heads
    for (var ph = 0; ph < impulses.length; ph++) {
      var imp2 = impulses[ph];
      if (imp2.done || now < imp2.started) continue;
      var pos = pointAt(imp2.path, imp2.cum, imp2.d);
      var hg2 = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 8);
      hg2.addColorStop(0, lerpColor(0.55 * drainAll));
      hg2.addColorStop(1, 'rgba(255,166,201,0)');
      ctx.fillStyle = hg2;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = ACCENT;
      ctx.globalAlpha = 0.9 * drainAll;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 1.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // crisp bouton beads
    ctx.fillStyle = ACCENT;
    for (var bt2 = 0; bt2 < boutons.length; bt2++) {
      var bo2 = boutons[bt2];
      var a2 = 0.05 + bo2.flare * 0.55;
      if (bo2.owner && bo2.owner.charge > 0.05) a2 = Math.max(a2, Math.min(0.8, bo2.owner.charge * 0.3));
      if (a2 < 0.02) continue;
      ctx.globalAlpha = a2 * drainAll;
      ctx.beginPath();
      ctx.arc(bo2.x, bo2.y, 1.0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- chain watermarks
    ctx.font = '500 8px "CMU Sans Serif", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var lk = 0; lk < CHAIN_KEYS.length; lk++) {
      var ck = CHAIN_KEYS[lk];
      var meta = chainMeta[ck];
      if (!meta) continue;
      var hot = synthesis && synthesis.chain === ck && (state === 'facts' || state === 'connections' || state === 'forming' || state === 'answered');
      var la = hot ? 0.5 + 0.2 * Math.sin(now * 0.005) : 0.09;
      ctx.fillStyle = lerpColor(la * drainAll);
      ctx.fillText(CHAINS[ck].label.toUpperCase(), meta.x, clamp(meta.y - meta.r - 22, 30, H - 10));
    }

    // ---- cells
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var n2 = 0; n2 < cells.length; n2++) {
      var nd2 = cells[n2];
      var ndr = ndrain(nd2);
      var ch2 = Math.min(1, nd2.charge);

      if (nd2.fired) {
        var ripple = nd2.flashT;
        if (ripple > 0) {
          ctx.strokeStyle = lerpColor(ripple * 0.5 * ndr);
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(nd2.qx, nd2.qy, (1 - ripple) * 30, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.save();
        ctx.translate(nd2.qx, nd2.qy);
        ctx.fillStyle = 'rgba(10,10,15,0.78)';
        roundRect(ctx, -nd2.w / 2, -nd2.h / 2, nd2.w, nd2.h, nd2.h / 2);
        ctx.fill();
        ctx.strokeStyle = lerpColor((0.45 + 0.35 * ch2) * ndr);
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.font = '12px "CMU Sans Serif", sans-serif';
        ctx.fillStyle = ACCENT;
        ctx.globalAlpha = ndr * (0.6 + 0.4 * ch2);
        ctx.fillText(nd2.text, 0, 0);
        // the order the fact was shown in
        if (nd2.litIdx > 0) {
          ctx.font = '700 9px "CMU Sans Serif", sans-serif';
          ctx.globalAlpha = ndr * 0.85;
          ctx.beginPath();
          ctx.arc(nd2.w / 2 - 6, -nd2.h / 2 + 6, 7, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(10,10,15,0.9)';
          ctx.fill();
          ctx.strokeStyle = lerpColor(0.8 * ndr);
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = ACCENT;
          ctx.textAlign = 'center';
          ctx.fillText(String(nd2.litIdx), nd2.w / 2 - 6, -nd2.h / 2 + 6);
          ctx.textAlign = 'center';
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      } else {
        var rest = 0.5 + 0.5 * Math.sin(now * 0.002 + nd2.glowph);
        var spark = nd2.sparkF > 0 ? nd2.sparkF : 0;
        ctx.fillStyle = 'rgba(10,10,15,0.72)';
        roundRect(ctx, nd2.qx - nd2.w / 2, nd2.qy - nd2.h / 2, nd2.w, nd2.h, nd2.h / 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(228,228,234,' + (0.06 + rest * 0.015 + spark * 0.1).toFixed(3) + ')';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.font = '12px "CMU Sans Serif", sans-serif';
        ctx.fillStyle = 'rgba(228,228,234,' + (0.27 + rest * 0.05 + spark * 0.35).toFixed(3) + ')';
        ctx.fillText(nd2.text, nd2.qx, nd2.qy);
      }
    }

    // prompt pill
    if (promptCell) {
      var pn = promptCell;
      var pdd = pn.drain > 0 ? (1 - pn.drain) : 1;
      ctx.save();
      ctx.translate(pn.qx, pn.qy);
      ctx.fillStyle = 'rgba(10,10,15,0.9)';
      roundRect(ctx, -pn.w / 2, -pn.h / 2, pn.w, pn.h, pn.h / 2);
      ctx.fill();
      ctx.strokeStyle = lerpColor(0.75 * pdd);
      ctx.lineWidth = 1.3;
      ctx.stroke();
      ctx.font = '700 13px "CMU Sans Serif", sans-serif';
      ctx.fillStyle = ACCENT;
      ctx.globalAlpha = pdd;
      ctx.fillText(pn.text, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function ndrain(n) {
    return n.drain > 0 ? (1 - n.drain) : 1;
  }

  function nearestOf(list, x, y) {
    var best = list[0], bd = Infinity;
    for (var i = 0; i < list.length; i++) {
      var d = dist(list[i].qx, list[i].qy, x, y);
      if (d < bd) { bd = d; best = list[i]; }
    }
    return best;
  }

  // ------------------------------------------------------- boot

  function setBox(off) {
    inputEl.disabled = off;
    submitEl.disabled = off;
    if (off) inputEl.blur();
  }

  submitEl.addEventListener('click', function () { run(inputEl.value); });
  inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { run(inputEl.value); } });

  function tick(ts) {
    var dt = lastT ? Math.min(ts - lastT, 50) : 16;
    lastT = ts;
    now = ts; frame = ts;
    update(dt);
    draw();
    requestAnimationFrame(tick);
  }

  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildTissue();
    buildLayout();
    buildNerveNet();
    buildDrizzle();
    buildMotes();
    state = 'idle'; impulses = []; promptCell = null; synthesis = null; assocEdges = []; edgesBuilt = [];
    _deliveryCache = {};
    chipsEl.textContent = '';
    kwstripEl.classList.remove('show');
    stagesEl.classList.add('off');
    document.querySelector('.reply').classList.remove('show');
    replyEl.textContent = '';
    setBox(false);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { resize(); });
  }
})();
</script>
</body>
</html>
